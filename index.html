<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0F1621">
<meta name="description" content="Silk Road: a turn-based merchant game. Build a trading house from a ruined caravanserai outside Samarkand, 1247.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>The Samarkand Ledger</title>
<style>
:root{
  --ground:#0F1621;
  --ground-2:#0B1019;
  --panel:#182234;
  --panel-hi:#202D45;
  --line:#2B3A56;
  --line-soft:#212C42;
  --text:#EDE4D2;
  --muted:#93A1BC;
  --dim:#6D7B96;
  --brass:#D9A441;
  --brass-hi:#F0C265;
  --brass-dim:#7C6027;
  --tile:#35A79C;
  --lapis:#6B87DE;
  --madder:#C4544A;
  --silk:#E4CFAE;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --r:10px;
  --f-disp:"Amiri","Iowan Old Style",Georgia,serif;
  --f-ui:"Alegreya Sans","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--text);
  font-family:var(--f-ui);font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent;
}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:700;text-wrap:balance;letter-spacing:.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- frame ---------- */
.frame{max-width:620px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:64px;
  background:linear-gradient(180deg,#111A28 0%,var(--ground) 240px);
  border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
@media (max-width:640px){.frame{border:0}}

/* ---------- hud ---------- */
#hud{position:sticky;top:0;z-index:40;background:rgba(11,16,25,.93);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hud-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 14px 5px}
.house{font-family:var(--f-disp);font-size:19px;line-height:1.1;color:var(--silk)}
.house small{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin-top:2px}
.date{text-align:right;font-size:12px;color:var(--muted);letter-spacing:.05em;flex:none}
.date b{display:block;font-family:var(--f-num);font-size:15px;color:var(--text);font-weight:500}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border-top:1px solid var(--line)}
.chip{background:var(--ground-2);padding:6px 4px 7px;text-align:center;position:relative;overflow:hidden}
.chip .k{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.chip .v{display:block;font-family:var(--f-num);font-size:17px;font-weight:500;letter-spacing:-.02em;margin-top:1px}
.chip.d .v{color:var(--brass)} .chip.s .v{color:var(--tile)}
.chip.r .v{color:var(--lapis)} .chip.h .v{color:var(--silk)}
.chip.warn::after{content:"";position:absolute;inset:0;border:1px solid var(--madder);pointer-events:none;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- view ---------- */
main{padding:14px 14px 0;min-height:calc(100dvh - 320px)}
.sec{margin:0 0 18px}
.sec>h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);
  font-family:var(--f-ui);font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:9px}
.sec>h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--brass-dim),transparent)}
.lede{color:var(--muted);font-size:14px;margin:0 0 12px}

.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 13px}
.rows{display:flex;flex-direction:column;background:var(--panel);
  border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:11px 13px;text-align:left;width:100%;
  background:none;border:0;border-top:1px solid var(--line-soft);cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--panel-hi)}
.row.static{cursor:default}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.row .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.row .end{text-align:right;flex:none;font-family:var(--f-num);font-size:14px}
.row .end small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--dim);letter-spacing:.06em}
.row .chev{color:var(--dim);flex:none;font-size:17px;margin-left:-4px}
.row[disabled]{opacity:.45;cursor:default}
.glyph{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px;
  background:var(--panel-hi);border:1px solid var(--line);font-family:var(--f-disp);font-size:17px;color:var(--silk)}

.tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;
  border:1px solid var(--line);color:var(--muted);font-weight:700;white-space:nowrap}
.tag.good{color:var(--tile);border-color:#22564f;background:#0f2a28}
.tag.bad{color:var(--madder);border-color:#5a2a26;background:#2a1412}
.tag.gold{color:var(--brass);border-color:var(--brass-dim);background:#2a2110}
.tag.cool{color:var(--lapis);border-color:#2f3f6e;background:#141c33}

.btn{display:block;width:100%;padding:13px;border-radius:var(--r);border:1px solid var(--brass-dim);
  background:linear-gradient(180deg,#2A2413,#1D1A0F);color:var(--brass-hi);font-weight:700;
  font-size:15px;letter-spacing:.04em;cursor:pointer}
.btn:active{background:#332B15}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{border-color:var(--line);background:var(--panel);color:var(--text)}
.btn.ghost:active{background:var(--panel-hi)}
.btn.danger{border-color:#5a2a26;background:#231311;color:#E08B82}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}

.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px;border-top:1px dashed var(--line-soft)}
.kv:first-child{border-top:0}
.kv .k{color:var(--muted)} .kv .v{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pos{color:var(--tile)} .neg{color:var(--madder)} .gold{color:var(--brass)}

/* ---------- bazaar tap ---------- */
.haggle{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--brass-dim);
  background:radial-gradient(120% 90% at 50% 0%,#2E2718 0%,#151D2B 70%);padding:20px 14px 16px;
  text-align:center;width:100%;cursor:pointer;display:block;user-select:none}
.haggle:active{background:radial-gradient(120% 90% at 50% 0%,#3A3120 0%,#151D2B 70%)}
.haggle > span{display:block}
.haggle .hd{font-family:var(--f-disp);font-size:23px;line-height:1.15;color:var(--brass-hi)}
.haggle .hs{font-size:12.5px;color:var(--muted);margin-top:3px}
.haggle .meter{height:5px;border-radius:3px;background:#0C1220;margin-top:11px;overflow:hidden;border:1px solid var(--line)}
.haggle .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-dim),var(--brass));transition:width .18s}
.coin{position:absolute;pointer-events:none;font-family:var(--f-num);font-weight:600;font-size:15px;
  color:var(--brass-hi);animation:fly .75s ease-out forwards;text-shadow:0 2px 6px #000}
@keyframes fly{0%{opacity:0;transform:translateY(0) scale(.8)}18%{opacity:1}
  100%{opacity:0;transform:translateY(-58px) scale(1.05)}}

/* ---------- stepper ---------- */
.step{display:flex;align-items:center;gap:8px}
.step button{width:42px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel-hi);
  font-size:20px;font-family:var(--f-num);line-height:1;cursor:pointer}
.step button:active{background:#2A3A57}
.step .q{flex:1;text-align:center;font-family:var(--f-num);font-size:20px;font-weight:600}
.step .q small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--dim);letter-spacing:.08em}

.pillrow{display:flex;gap:7px;flex-wrap:wrap}
.pill{padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);
  font-size:13.5px;cursor:pointer;color:var(--muted)}
.pill[aria-pressed="true"]{border-color:var(--brass);color:var(--brass-hi);background:#241E10}

/* ---------- journal ---------- */
.entry{border-left:2px solid var(--line);padding:2px 0 12px 12px;margin-left:3px;position:relative}
.entry::before{content:"";position:absolute;left:-5px;top:7px;width:8px;height:8px;border-radius:50%;
  background:var(--line);border:2px solid var(--ground)}
.entry.good::before{background:var(--tile)} .entry.bad::before{background:var(--madder)}
.entry.gold::before{background:var(--brass)}
.entry .when{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.entry .txt{font-size:14.5px;margin-top:2px}
.entry .txt em{font-family:var(--f-disp);font-style:italic;color:var(--silk)}
.delta{font-family:var(--f-num);font-size:12.5px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}

/* ---------- ledger table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);text-align:right;
  padding:0 0 6px;font-weight:700;border-bottom:1px solid var(--line)}
.tbl th:first-child{text-align:left}
.tbl td{padding:7px 0;border-bottom:1px solid var(--line-soft);text-align:right;
  font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl td:first-child{text-align:left;font-family:var(--f-ui)}
.tbl td .w{color:var(--dim);font-size:11px;font-family:var(--f-num)}
.scrollx{overflow-x:auto}

/* ---------- action bar + nav ---------- */
.actionbar{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));z-index:35;
  padding:10px 14px;background:linear-gradient(180deg,rgba(15,22,33,0),var(--ground) 30%)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:45;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(11,16,25,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  max-width:620px;margin:0 auto}
nav button{background:none;border:0;padding:7px 2px 9px;cursor:pointer;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;font-weight:700;position:relative}
nav button .ic{display:flex;color:inherit}
nav button .ic svg{display:block}
nav button[aria-current="page"]{color:var(--brass)}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--brass)}
nav .badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;
  background:var(--madder);color:#fff;font-size:10px;line-height:16px;font-family:var(--f-num);padding:0 4px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,9,14,.72);z-index:60;display:flex;align-items:flex-end;
  justify-content:center;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:16px 15px calc(18px + env(safe-area-inset-bottom));
  max-height:88dvh;overflow-y:auto;animation:rise .24s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(28px);opacity:.4}}
.sheet h3{font-size:21px;margin-bottom:3px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin-bottom:13px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
.choice{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--ground-2);margin-top:9px;cursor:pointer}
.choice:active{background:var(--panel-hi)}
.choice .ct{font-weight:700;font-size:15px}
.choice .cs{font-size:12.5px;color:var(--muted);margin-top:2px}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:0;right:0;bottom:calc(126px + env(safe-area-inset-bottom));z-index:70;
  display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:#101827;border:1px solid var(--line);border-left:3px solid var(--brass);
  border-radius:8px;padding:8px 12px;font-size:13.5px;box-shadow:var(--shadow);max-width:100%;
  animation:tin .25s ease-out}
.toast.good{border-left-color:var(--tile)} .toast.bad{border-left-color:var(--madder)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}

.center{text-align:center}
.mt{margin-top:12px} .mb{margin-bottom:10px}
.hint{font-size:12.5px;color:var(--dim);margin-top:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{height:6px;border-radius:3px;background:#0C1220;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--brass)}
.bar.risk i{background:var(--madder)}
.bar.good i{background:var(--tile)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="frame">
  <header id="hud">
    <div class="hud-top">
      <div class="house" id="houseName">The House of Yusuf<small id="houseSeat">Samarkand</small></div>
      <div class="date" id="date"><b>Spring</b>1247</div>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="view"></main>
  <div class="actionbar"><button class="btn" id="endturn">End the Turn</button></div>
  <nav id="nav"></nav>
</div>
<div id="toasts"></div>
<div id="sheetHost"></div>
<script>
"use strict";
/* =====================================================================
   THE SAMARKAND LEDGER — a Silk Road merchant house, 1247
   One authoritative state object (S). Every displayed number is derived
   from it; nothing is tracked in the prose.
   ===================================================================== */

const CONFIG = {
  turnsPerSeason: 2,        // <- granularity dial: 1 = a turn is a season
  startYear: 1247,
  startDucats: 180,
  startStores: 40,
  startRepute: 4,
  hagglesBase: 10,          // free bazaar taps per turn
  storesPerHead: 1,         // household + staff eat this per turn
  storesPerCamel: 0.5,
  storesPerTravellerTurn: 2,
  storePrice: 2,            // ducats per unit of stores
  debtGraceTurns: 3,        // turns in the red before the creditors come
  reputeSaleBonus: 0.004,   // +0.4% sale price per point of Repute
  reputeSaleCap: 0.30,
  distancePay: 0.16,        // every extra turn of road adds this much to the price
  winDucats: 12000, winRepute: 60,
  saveKey: "samarkand-ledger-v1"
};
const SEASONS = ["Spring","Summer","Autumn","Winter"];

/* ---------------------------------------------------------- goods ---- */
const GOODS = {
  silk:      {name:"Bolts of silk",   short:"Silk",      base:42, g:"Si", supply:0.95},
  jade:      {name:"Khotan jade",     short:"Jade",      base:55, g:"Ja", supply:1.15},
  lapis:     {name:"Badakhshan lapis",short:"Lapis",     base:48, g:"La", supply:0.90},
  spices:    {name:"Pepper & casia",  short:"Spices",    base:34, g:"Sp", supply:1.05},
  incense:   {name:"Frankincense",    short:"Incense",   base:30, g:"In", supply:1.10},
  paper:     {name:"Samarkand paper", short:"Paper",     base:16, g:"Pa", supply:0.72},
  glass:     {name:"Syrian glassware",short:"Glass",     base:26, g:"Gl", supply:1.00},
  tea:       {name:"Brick tea",       short:"Tea",       base:22, g:"Te", supply:1.12},
  porcelain: {name:"White porcelain", short:"Porcelain", base:46, g:"Po", supply:1.18},
  horses:    {name:"Ferghana horses", short:"Horses",    base:66, g:"Ho", supply:0.88}
};
const GOOD_IDS = Object.keys(GOODS);

/* ---------------------------------------------------------- cities --- */
// demand: what that market pays, as a multiple of the good's base value.
const CITIES = {
  samarkand:{name:"Samarkand", demand:{}},
  bukhara:  {name:"Bukhara",   demand:{glass:1.35,paper:1.30,silk:1.12,spices:1.15,def:1.14}, source:{good:"paper",  mult:0.62}},
  merv:     {name:"Merv",      demand:{silk:1.42,tea:1.34,porcelain:1.28,def:1.20}, source:{good:"tea",       mult:0.66}},
  balkh:    {name:"Balkh",     demand:{incense:1.46,glass:1.34,horses:1.30,def:1.22}, source:{good:"lapis",   mult:0.70}},
  herat:    {name:"Herat",     demand:{lapis:1.50,porcelain:1.40,silk:1.30,def:1.28}, source:{good:"spices",  mult:0.74}},
  kashgar:  {name:"Kashgar",   demand:{glass:1.66,horses:1.55,paper:1.50,def:1.38}, source:{good:"jade",      mult:0.62}},
  khotan:   {name:"Khotan",    demand:{tea:1.74,spices:1.62,paper:1.58,def:1.44}, source:{good:"jade",        mult:0.52}},
  turfan:   {name:"Turfan",    demand:{lapis:1.80,glass:1.72,incense:1.60,def:1.50}, source:{good:"silk",     mult:0.68}},
  tabriz:   {name:"Tabriz",    demand:{silk:2.05,porcelain:1.92,jade:1.84,tea:1.60,def:1.58}, source:{good:"glass",mult:0.60}},
  dunhuang: {name:"Dunhuang",  demand:{spices:1.94,lapis:1.88,horses:1.80,incense:1.76,def:1.62}, source:{good:"tea",mult:0.58}},
  hormuz:   {name:"Hormuz",    demand:{silk:1.96,porcelain:2.02,jade:1.70,def:1.62}, source:{good:"incense",  mult:0.56}},
  changan:  {name:"Chang'an",  demand:{incense:2.42,lapis:2.30,glass:2.22,horses:2.20,def:1.92}, source:{good:"porcelain",mult:0.50}}
};
const cityPrice = (cityId, goodId) => {
  const c = CITIES[cityId]; const d = c.demand[goodId] || c.demand.def || 1;
  return Math.round(GOODS[goodId].base * d);
};

/* ---------------------------------------------------------- routes --- */
// turns = full round trip. risk = base chance of a complication.
const ROUTES = [
  {id:"bukhara", to:"bukhara", name:"The Bukhara Run",   turns:1, risk:0.07, open:true,
   note:"A week of good road along the Zarafshan."},
  {id:"merv",    to:"merv",    name:"The Merv Road",     turns:2, risk:0.11, cost:70,  rep:6,
   note:"West through the Karakum fringe to the old Seljuk city."},
  {id:"balkh",   to:"balkh",   name:"The Oxus Crossing", turns:2, risk:0.14, cost:90,  rep:9,
   note:"Ferries at Termez, then south to the mother of cities."},
  {id:"herat",   to:"herat",   name:"The Herat Circuit", turns:3, risk:0.16, cost:150, rep:13,
   note:"Khorasan proper. Rich buyers, jealous guilds."},
  {id:"kashgar", to:"kashgar", name:"Over the Pamirs",   turns:4, risk:0.25, cost:230, rep:17, needs:"guide",
   note:"The roof of the world. No man crosses it without a guide."},
  {id:"khotan",  to:"khotan",  name:"The Jade Road",     turns:5, risk:0.27, cost:300, rep:21, needs:"guide",
   note:"The southern rim of the Taklamakan, and the jade rivers."},
  {id:"turfan",  to:"turfan",  name:"The Northern Rim",  turns:6, risk:0.30, cost:390, rep:26, needs:"guide",
   note:"Oasis to oasis under the Flaming Mountains."},
  {id:"tabriz",  to:"tabriz",  name:"The Western Road",  turns:7, risk:0.29, cost:430, rep:30,
   note:"Into Ilkhanid country, where Genoese factors bid in silver."},
  {id:"hormuz",  to:"hormuz",  name:"Down to the Sea",   turns:9, risk:0.31, cost:520, rep:34, needs:"captain",
   note:"Overland to the Gulf, then a dhow's hold to the Indies trade."},
  {id:"dunhuang",to:"dunhuang",name:"The Jade Gate",     turns:8, risk:0.35, cost:600, rep:38, needs:"guide",
   note:"Past the last watchtowers of the old Han wall."},
  {id:"changan", to:"changan", name:"The Long Road",     turns:12,risk:0.37, cost:900, rep:47, needs:"guide",
   note:"All the way east. Men leave as sons and come back as fathers."}
];
const route = id => ROUTES.find(r => r.id === id);

/* ------------------------------------------------------ properties --- */
const PROPS = {
  serai:{ name:"Caravanserai on the Zarafshan", city:"samarkand", staff:"innkeeper", g:"Se",
    tiers:[

/* ------------------------------------------------------ persistence -- */
function save(){
  try{ localStorage.setItem(CONFIG.saveKey, JSON.stringify(S)); }catch(e){}
}
function load(){
  try{
    const raw = localStorage.getItem(CONFIG.saveKey);
    if(!raw) return false;
    const o = JSON.parse(raw);
    if(!o || o.v !== 1) return false;
    S = o;
    // forward-compatible defaults
    S.threads = S.threads || {};
    THREADS.forEach(t => { if(!S.threads[t.id]) S.threads[t.id] = {stage:0,cool:0,done:false}; });
    return true;
  }catch(e){ return false; }
}
function wipe(){ try{ localStorage.removeItem(CONFIG.saveKey); }catch(e){} }

/* ---------------------------------------------------------- helpers -- */
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const chance=p=>Math.random()<p;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>{n=Math.round(n);return Math.abs(n)>=1000?n.toLocaleString("en-US"):String(n);};
const sgn=n=>(n>0?"+":"")+fmt(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=n=>Math.round(n*100)+"%";

const seasonOf = t => SEASONS[Math.floor(t / CONFIG.turnsPerSeason) % 4];
const yearOf   = t => CONFIG.startYear + Math.floor(t / (CONFIG.turnsPerSeason * 4));
const dateStr  = t => seasonOf(t) + " " + yearOf(t);

/* -------------------------------------------------------- accounting - */
// The ONLY way ducats change. Everything displayed is derived from here.
function coin(amount, item){
  amount = Math.round(amount);
  if(amount === 0) return 0;
  S.ducats += amount;
  if(amount > 0) S.stat.earned += amount; else S.stat.spent -= amount;
  S.ledger.push({turn:S.turn, item, dare: amount<0?-amount:0, avere: amount>0?amount:0, bal:S.ducats});
  if(S.ledger.length > 400) S.ledger.splice(0, S.ledger.length - 400);
  return amount;
}
function repute(d, why){
  const before = S.repute;
  S.repute = clamp(S.repute + d, 0, 100);
  return S.repute - before;
}
function post(kind, text, deltas){
  S.journal.unshift({turn:S.turn, kind, text, deltas: deltas || null});
  if(S.journal.length > 120) S.journal.length = 120;
}

/* --------------------------------------------------------- derived --- */
const propTier = id => PROPS[id].tiers[S.props[id]];
const hasStaff = type => S.staff.some(s => s.type === type);
const staffAt  = pid => S.staff.find(s => s.at === pid);
const staffCount = type => S.staff.filter(s => s.type === type).length;

function propIncome(id){
  const t = S.props[id]; if(!t) return 0;
  const def = PROPS[id];
  if(!staffAt(id)) return 0;                       // unstaffed earns nothing
  let inc = def.tiers[t].income;
  if(S.house.some(m => m.role === "steward" && m.at === id)) inc *= 1.25;
  return Math.round(inc);
}
function wages(){ return S.staff.reduce((n,s)=>n + STAFF[s.type].wage, 0); }
function upkeep(){ return Object.entries(S.beasts).reduce((n,[k,q])=>n + q*BEASTS[k].upkeep, 0); }
function grossIncome(){ return Object.keys(PROPS).reduce((n,id)=>n + propIncome(id), 0); }
function netIncome(){ return grossIncome() - wages() - upkeep(); }

function capacity(){                                // warehouse capacity
  let c = PROPS.serai.tiers[S.props.serai].cap || 0;
  c += PROPS.godown.tiers[S.props.godown].cap || 0;
  return c;
}
const held = () => GOOD_IDS.reduce((n,g)=>n + S.goods[g], 0);

function hands(){
  return S.house.filter(m => m.role === "idle" && m.busy <= S.turn).length;
}
function freeMembers(){ return S.house.filter(m => m.role === "idle" && m.busy <= S.turn); }
function beastsOut(){
  const out = {camel:0, araba:0, dhow:0};
  S.caravans.forEach(c => Object.entries(c.beasts).forEach(([k,v]) => out[k] += v));
  return out;
}
function beastsFree(k){ return S.beasts[k] - beastsOut()[k]; }

function buyMult(){                                 // discounts on purchases
  let m = 1;
  m -= PROPS.stall.tiers[S.props.stall].buy || 0;
  if(S.house.some(x => x.role === "market")) m -= 0.10;
  return clamp(m, 0.55, 1);
}
function sellMult(){                                // bonuses on sales
  let m = 1 + Math.min(S.repute * CONFIG.reputeSaleBonus, CONFIG.reputeSaleCap);
  m += PROPS.counting.tiers[S.props.counting].sell || 0;
  m += PROPS.factory.tiers[S.props.factory].sell || 0;
  if(hasStaff("dragoman")) m += 0.07;
  return m;
}
function buyPrice(g){ return Math.max(1, Math.round(GOODS[g].base * S.supply[g] * buyMult())); }
function localSell(g){ return Math.max(1, Math.round(GOODS[g].base * S.supply[g] * 0.82)); }

function riskMod(){            // the share of a road's danger you have taken out of it
  let r = 0;
  if(hasStaff("guards")) r += 0.18;
  if(hasStaff("guide"))  r += 0.14;
  if(S.house.some(m => m.role === "road")) r += 0.15;
  r += (PROPS.depot.tiers[S.props.depot].risk || 0) * 2.5;
  r += Math.min(S.repute, 60) * 0.0025;
  return Math.min(r, 0.62);
}
/* A market you work every turn stops paying. Saturation rises with each run on a
   road and falls back while you are away from it — the reason to go further. */
function satOf(rid){ return Math.min(0.40, (S.routes[rid] && S.routes[rid].sat) || 0); }
function satWord(rid){ const v = satOf(rid); return v < 0.08 ? "fresh" : v < 0.22 ? "worked" : v < 0.34 ? "tiring of you" : "glutted"; }
/* One formula for what a load fetches at the far end. Every screen reads this. */
function distancePremium(r){ return 1 + (r.turns - 1) * CONFIG.distancePay; }
function saleAt(rid, g){
  const r = route(rid);
  const silk = g === "silk" ? (PROPS.dye.tiers[S.props.dye].silk || 0) : 0;
  return cityPrice(r.to, g) * distancePremium(r) * sellMult() * (1 + firstRunBonus(rid)) * (1 - satOf(rid)) * (1 + silk);
}
function firstRunBonus(rid){
  const runs = (S.routes[rid] && S.routes[rid].runs) || 0;
  return 0.40 * Math.pow(0.62, runs);               // decays with each run
}
function netWorth(){
  let n = S.ducats + S.stores * CONFIG.storePrice;
  GOOD_IDS.forEach(g => n += S.goods[g] * localSell(g));
  Object.entries(S.beasts).forEach(([k,q]) => n += q * BEASTS[k].buy * 0.6);
  Object.keys(PROPS).forEach(id => {
    for(let i=1; i<=S.props[id]; i++) n += PROPS[id].tiers[i].cost * 0.6;
  });
  S.caravans.forEach(c => n += c.invested);
  return Math.round(n);
}
function storesNeed(){
  const heads = S.house.filter(m => m.busy <= S.turn).length + S.staff.length;
  const b = beastsFree("camel") + beastsFree("araba")*2;
  const travellers = S.caravans.reduce((n,c)=>n + 1 + Math.round(c.loads/4), 0);
  return Math.ceil(heads*CONFIG.storesPerHead + b*CONFIG.storesPerCamel + travellers*CONFIG.storesPerTravellerTurn);
}
function routeOpen(rid){ return !!(S.routes[rid] && S.routes[rid].open); }
function routeBlocked(r){
  if(r.needs === "guide"   && !hasStaff("guide"))   return "Needs a mountain guide";
  if(r.needs === "captain" && (!hasStaff("captain") || S.beasts.dhow < 1)) return "Needs a dhow and a captain";
  return null;
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function spendHand(){                      // consumes an idle household member
  const m = freeMembers()[0];
  if(!m) return false;
  m.busy = S.turn + 1;
  return true;
}

function haggle(ev, el){
  if(S.over) return;
  if(S.haggles <= 0){ toast("bad","The bazaar has heard enough of you today."); return; }
  S.haggles--; S.stat.taps++;
  const base = 2 + S.props.stall * 2 + Math.floor(S.repute / 8);
  let gain = irnd(base, base + 3 + S.props.stall);
  if(chance(0.06)){ gain *= 3; toast("good","A gullible pilgrim overpays for paper."); }
  coin(gain, "Bazaar haggling");
  flyCoin(ev, el, "+" + gain);
  renderChips();
  const m = document.getElementById("haggleMeter");
  if(m) m.style.width = (100 * S.haggles / maxHaggles()) + "%";
  const c = document.getElementById("haggleCount");
  if(c) c.textContent = S.haggles + " of " + maxHaggles() + " left this turn";
  save();
}
const maxHaggles = () => CONFIG.hagglesBase + S.props.stall * 3;

function buyGoods(g, q){
  q = Math.max(0, Math.min(q, capacity() - held()));
  if(q <= 0){ toast("bad","No room. Build or enlarge a warehouse."); return; }
  const cost = buyPrice(g) * q;
  if(cost > S.ducats){ toast("bad","Not enough ducats."); return; }
  coin(-cost, "Bought " + q + " " + GOODS[g].short.toLowerCase());
  S.goods[g] += q;
  S.supply[g] = clamp(S.supply[g] + q * 0.012, 0.5, 2.2);   // your buying moves the market
  toast("good", "Bought " + q + " " + GOODS[g].short.toLowerCase() + " for " + fmt(cost) + "d");
  after();
}
function sellGoods(g, q){
  q = Math.max(0, Math.min(q, S.goods[g]));
  if(q <= 0) return;
  const gain = localSell(g) * q;
  coin(gain, "Sold " + q + " " + GOODS[g].short.toLowerCase() + " in Samarkand");
  S.goods[g] -= q;
  S.supply[g] = clamp(S.supply[g] - q * 0.012, 0.5, 2.2);
  toast("good","Sold " + q + " " + GOODS[g].short.toLowerCase() + " for " + fmt(gain) + "d");
  after();
}
function buyStores(q){
  const cost = q * CONFIG.storePrice;
  if(cost > S.ducats){ toast("bad","Not enough ducats."); return; }
  coin(-cost, "Grain and fodder ×" + q);
  S.stores += q;
  after();
}

function upgradeProp(id){
  const def = PROPS[id], next = S.props[id] + 1;
  if(next >= def.tiers.length) return;
  const t = def.tiers[next];
  if(t.cost > S.ducats){ toast("bad","Not enough ducats."); return; }
  if(def.rep && S.repute < def.rep){ toast("bad","Your name is not yet worth that much."); return; }
  if(def.needsRoute && !routeOpen(def.needsRoute)){ toast("bad","You have no road there yet."); return; }
  if(!spendHand()){ toast("bad","No Hands left this turn."); return; }
  coin(-t.cost, def.name + " — " + t.name);
  S.props[id] = next;
  repute(next >= def.tiers.length - 1 ? 3 : 2);
  post("gold", "<em>" + esc(t.name) + ".</em> " + esc(def.name) + " stands finished. " + esc(t.note));
  toast("good", t.name + " completed.");
  closeSheet(); after();
}

function hireStaff(type){
  const d = STAFF[type];
  if(d.hire > S.ducats){ toast("bad","Not enough ducats."); return; }
  if(!spendHand()){ toast("bad","No Hands left this turn."); return; }
  coin(-d.hire, "Hired a " + d.name.toLowerCase());
  const id = "s" + Date.now().toString(36) + Math.floor(Math.random()*99);
  const s = {id, type, at:null, busy:0};
  // auto-assign to an unstaffed property that wants this trade
  const want = Object.keys(PROPS).find(p => PROPS[p].staff === type && S.props[p] > 0 && !staffAt(p));
  if(want) s.at = want;
  S.staff.push(s);
  post("", "You take on " + esc(d.name.toLowerCase()) + (want ? " for the " + esc(PROPS[want].name.toLowerCase()) : "") + ".");
  toast("good", d.name + " hired." + (want ? " Posted to the " + PROPS[want].name.toLowerCase() + "." : ""));
  closeSheet(); after();
}
function dismissStaff(sid){
  const i = S.staff.findIndex(s => s.id === sid);
  if(i < 0) return;
  post("", "You pay off your " + esc(STAFF[S.staff[i].type].name.toLowerCase()) + " and send them on.");
  S.staff.splice(i,1); repute(-1); closeSheet(); after();
}
function assignStaff(sid, pid){
  const s = S.staff.find(x => x.id === sid); if(!s) return;
  const cur = staffAt(pid); if(cur) cur.at = null;
  s.at = pid; closeSheet(); after();
}
function setRole(mid, role, at){
  const m = S.house.find(x => x.id === mid); if(!m) return;
  if(m.busy > S.turn){ toast("bad", m.name + " is on the road."); return; }
  m.role = role; m.at = at || null;
  post("", esc(m.name) + " takes up the work of " + esc(ROLES[role].name.toLowerCase()) +
        (at ? " at the " + esc(PROPS[at].name.toLowerCase()) : "") + ".");
  closeSheet(); after();
}
function buyBeast(k, q){
  const d = BEASTS[k], cost = d.buy * q;
  if(cost > S.ducats){ toast("bad","Not enough ducats."); return; }
  coin(-cost, q + "× " + d.name.toLowerCase());
  S.beasts[k] += q;
  toast("good", "Bought " + q + " " + d.name.toLowerCase() + (q>1?"s":"") + ".");
  closeSheet(); after();
}
function openRoute(rid){
  const r = route(rid);
  if(S.repute < (r.rep||0)){ toast("bad","Your name does not open that road yet."); return; }
  if((r.cost||0) > S.ducats){ toast("bad","Not enough ducats."); return; }
  if(!spendHand()){ toast("bad","No Hands left this turn."); return; }
  coin(-(r.cost||0), "Scouted " + r.name.toLowerCase());
  S.routes[rid] = {open:true, runs:0, sat:0};
  repute(2);
  post("gold","<em>" + esc(r.name) + " is opened.</em> You buy a scout's memory: wells, tolls, the names of men who can be trusted with a bond. " + esc(r.note));
  toast("good", r.name + " opened.");
  closeSheet(); after();
}

/* ------------------------------------------------------- the caravan - */
const ESCORTS = [                       // cut = share of the road's risk removed
  {name:"None",         cut:0,    c:0},
  {name:"Hired spears", cut:0.15, c:9},
  {name:"Strong escort",cut:0.30, c:22}
];
function escortCost(i, turns){ return Math.round(ESCORTS[i].c * turns * 1.4); }

function planInit(rid){
  cancelPlan();
  S.plan = {rid, leader:null, beasts:{camel:0,araba:0,dhow:0},
            cargo:Object.fromEntries(GOOD_IDS.map(g=>[g,0])), escort:0, bring:true};
}
const planCap    = () => Object.entries(S.plan.beasts).reduce((n,[k,q])=>n + q*BEASTS[k].cap, 0);
const planLoads  = () => GOOD_IDS.reduce((n,g)=>n + S.plan.cargo[g], 0);
function planValue(){
  return GOOD_IDS.reduce((n,g)=> n + S.plan.cargo[g] * saleAt(S.plan.rid, g), 0);
}
function planRisk(){
  const r = route(S.plan.rid);
  const lead = S.plan.leader && S.plan.leader !== "master"
      ? (S.house.find(m => m.id === S.plan.leader) || {skill:1}).skill : 3;
  const cut = Math.min(0.80, riskMod() + ESCORTS[S.plan.escort].cut + lead*0.03);
  return clamp(r.risk * (1 - cut), 0.02, 0.8);
}
function dispatch(){
  const p = S.plan, r = route(p.rid);
  if(!p.leader){ toast("bad","Choose someone to lead it."); return; }
  if(planLoads() === 0){ toast("bad","An empty caravan earns nothing."); return; }
  if(planLoads() > planCap()){ toast("bad","More cargo than beasts to carry it."); return; }
  const eCost = escortCost(p.escort, r.turns);
  if(eCost > S.ducats){ toast("bad","You cannot pay the escort."); return; }
  let leaderName;
  if(p.leader === "master"){
    const m = S.staff.find(s => s.type === "master" && s.busy <= S.turn);
    if(!m){ toast("bad","Your caravan master is already on the road."); return; }
    m.busy = S.turn + r.turns; leaderName = "your caravan master";
  }else{
    const m = S.house.find(x => x.id === p.leader);
    if(!m || m.busy > S.turn){ toast("bad","That one cannot go."); return; }
    m.busy = S.turn + r.turns; leaderName = m.name;
  }
  if(eCost) coin(-eCost, "Escort for " + r.name.toLowerCase());
  let invested = 0;
  GOOD_IDS.forEach(g => { invested += S.plan.cargo[g] * buyPrice(g); });   // cargo left the warehouse as it was loaded
  S.caravans.push({
    id:"c" + Date.now().toString(36), rid:p.rid, leader:p.leader, leaderName,
    beasts:{...p.beasts}, cargo:{...p.cargo}, loads:planLoads(), escort:p.escort,
    bring:p.bring, out:S.turn, due:S.turn + r.turns, invested:Math.round(invested),
    expect:Math.round(planValue()), risk:planRisk()
  });
  post("gold","<em>" + esc(r.name) + ".</em> " + esc(leaderName) + " leads " + planLoads() +
      " loads out through the eastern gate. Expected back in " + r.turns + " turn" + (r.turns>1?"s":"") + ".");
  toast("good","Caravan away.");
  S.plan = null; go("roads"); after();
}

/* ------------------------------------------------ caravan resolution - */
function resolveCaravan(c){
  const r = route(c.rid), rec = S.routes[c.rid];
  let lossFrac = 0, tag = "good", lines = [];
  const hit = Math.random() < c.risk;
  if(hit){
    const roll = Math.random();
    if(roll < 0.55){
      lossFrac = rnd(0.10, 0.28); tag = "bad";
      lines.push(pick([
        "A toll-master at a river crossing invents a new tax and will not be argued out of it.",
        "Two camels founder in a salt flat and their loads are shared out to lighten the rest.",
        "Rain gets into the bales at a bad halt; the dyes run."
      ]));
    }else if(roll < 0.85){
      lossFrac = rnd(0.30, 0.55); tag = "bad"; repute(-1);
      lines.push(pick([
        "Riders take the rear of the column at dawn and are gone before the guards are horsed.",
        "A three-day storm pins the caravan in a dry wadi; the water goes before the food does.",
        "A rival's men reach the market first and the buyers have already spent their silver."
      ]));
    }else{
      lossFrac = rnd(0.70, 1.00); tag = "bad"; repute(-3);
      const lost = Math.min(c.beasts.camel, Math.max(1, Math.floor(c.beasts.camel * 0.5)));
      S.beasts.camel -= lost; c.beasts.camel -= lost;
      S.stat.tripsLost++;
      lines.push(pick([
        "Bandits take the caravan whole in a defile east of the last well. Men come back on foot.",
        "The pass closes early. What is not buried is abandoned, and the survivors walk out.",
        "A garrison commander seizes the goods as contraband. There is no court that will hear you."
      ]));
      if(lost) lines.push(lost + " camel" + (lost>1?"s are":" is") + " lost with the loads.");
    }
  }
  let revenue = 0;
  GOOD_IDS.forEach(g => {
    const q = c.cargo[g] * (1 - lossFrac); if(q > 0) revenue += q * saleAt(c.rid, g);
  });
  revenue = Math.round(revenue);
  if(revenue) coin(revenue, r.name + " — sales at " + CITIES[r.to].name);

  // return cargo, bought cheap at the far market
  let brought = null;
  if(c.bring && revenue > 0 && CITIES[r.to].source && lossFrac < 0.7){
    const src = CITIES[r.to].source;
    const unit = Math.max(1, Math.round(GOODS[src.good].base * src.mult));
    const room = Math.max(0, capacity() - held());
    const q = Math.min(Math.floor(revenue * 0.3 / unit), room, Math.floor(c.loads * 0.8));
    if(q > 0){
      coin(-q * unit, "Return cargo from " + CITIES[r.to].name);
      S.goods[src.good] += q;
      brought = q + " " + GOODS[src.good].short.toLowerCase();
    }
  }
  rec.runs = (rec.runs || 0) + 1;
  rec.sat = (rec.sat || 0) + 0.13;      // you have just sold into this market
  S.stat.tripsDone++;
  if(!hit){
    repute(Math.max(1, Math.round(r.turns / 2)));
    lines.push(pick([
      "The column comes in dusty and whole, and the gate-keeper counts every beast.",
      "Clean road, fair weights, and a buyer who pays in the coin he promised.",
      "Nothing worth telling happened, which is the best thing a caravan master can say."
    ]));
  }
  // the leader is wiser for it
  if(c.leader !== "master"){
    const m = S.house.find(x => x.id === c.leader);
    if(m && m.skill < 5 && chance(0.45)){ m.skill++; lines.push(esc(m.name) + " comes back harder to fool."); }
  }
  const profit = revenue - c.invested;
  post(tag === "good" ? "good" : "bad",
    "<em>" + esc(c.leaderName) + " is back from " + esc(CITIES[r.to].name) + ".</em> " + lines.join(" ") +
    (brought ? " They bring " + brought + " home in the empty panniers." : ""),
    [ (revenue?"+" + fmt(revenue) + "d sales":""),
      (profit>=0?"net +" + fmt(profit) + "d":"net " + fmt(profit) + "d"),
      (lossFrac>0?"lost " + pct(lossFrac) + " of the cargo":"") ].filter(Boolean));
  fireThread("caravan", {route:r, city:CITIES[r.to].name, hit, profit});
}

function fireThreadId(id, ctx){
  const t = THREADS.find(x => x.id === id);
  return t ? runBeat(t, ctx) : false;
}
function runBeat(t, ctx){
  const st = S.threads[t.id];
  if(!st || st.done || st.cool > S.turn) return false;
  const beat = t.stages[st.stage];
  if(!beat){ st.done = true; return false; }
  let ok = false;
  try{ ok = beat.when(ctx); }catch(e){ ok = false; }
  if(!ok) return false;
  if(beat.run(ctx) !== false){
    st.stage++; st.cool = S.turn + irnd(2,4);
    if(st.stage >= t.stages.length) st.done = true;
  }
  return true;
}
function fireThread(trigger, ctx){
  for(const t of THREADS){
    const st = S.threads[t.id];
    if(!st || st.done || st.cool > S.turn) continue;
    if((t.trigger || "turn") !== trigger) continue;
    if(runBeat(t, ctx)) return true;   // at most one beat per trigger — arcs breathe
  }
  return false;
}

/* =====================================================================
   END OF TURN
   ===================================================================== */
function endTurn(){
  if(S.over) return;
  if(sheetOpen()) return;

  /* --- 1. the closing turn's standing business ------------------- */
  const gross = grossIncome();
  if(S.flags.postContract) { /* yam contract folded into standing income */ }
  const yam = S.flags.postContract ? 14 + S.props.serai*4 : 0;
  if(gross + yam > 0) coin(gross + yam, "Standing income" + (yam ? " (incl. post-stage)" : ""));
  const w = wages(); if(w) coin(-w, "Wages");
  const u = upkeep(); if(u) coin(-u, "Fodder and farriers");
  if(S.flags.loan){
    const p = Math.min(S.flags.loan.per, S.flags.loan.left);
    coin(-p, "Repayment to Yakub");
    S.flags.loan.left -= p;
    if(S.flags.loan.left <= 0) S.flags.loan.left = 0;
  }

  /* --- 2. the household eats ------------------------------------ */
  const need = storesNeed();
  if(S.stores >= need){
    S.stores -= need;
  }else{
    const shortfall = need - S.stores;
    S.stores = 0;
    const emergency = Math.round(shortfall * CONFIG.storePrice * 1.5);
    coin(-emergency, "Emergency grain at famine prices");
    repute(-1);
    post("bad","<em>The stores are empty.</em> You buy grain in the panic market at half again its worth, and the drivers notice which house could not feed them.",["-"+fmt(emergency)+"d","-1 repute"]);
  }
  const seraiStores = PROPS.serai.tiers[S.props.serai].stores || 0;
  if(seraiStores && staffAt("serai")) S.stores += seraiStores;

  /* --- 3. the calendar turns ------------------------------------ */
  const oldYear = yearOf(S.turn);
  S.turn++;
  if(yearOf(S.turn) !== oldYear) S.house.forEach(m => m.age++);
  S.haggles = maxHaggles();

  /* --- 4. caravans come home ------------------------------------ */
  const due = S.caravans.filter(c => c.due <= S.turn);
  S.caravans = S.caravans.filter(c => c.due > S.turn);
  due.forEach(resolveCaravan);

  Object.values(S.routes).forEach(r => { if(r.sat) r.sat = r.sat * 0.72; });

  /* --- 5. the bazaar drifts ------------------------------------- */
  GOOD_IDS.forEach(g => {
    const drift = rnd(-0.07, 0.07) + (GOODS[g].supply - S.supply[g]) * 0.12;
    S.supply[g] = clamp(S.supply[g] + drift, 0.55, 2.1);
  });

  /* --- 6. one thing happens ------------------------------------- */
  if(!sheetOpen() && chance(0.72)) rollEvent();

  /* --- 7. the long threads -------------------------------------- */
  if(!sheetOpen() && S.ducats < 0) fireThreadId("debt", null);
  if(!sheetOpen()) fireThread("turn", null);

  /* --- 8. solvency ---------------------------------------------- */
  if(S.ducats < 0){
    S.debtTurns++;
    if(S.debtTurns >= CONFIG.debtGraceTurns) return lose();
    post("bad","<em>You are in the red by " + fmt(-S.ducats) + " ducats.</em> The creditors of the cloth row allow " +
      (CONFIG.debtGraceTurns - S.debtTurns) + " more turn" + (CONFIG.debtGraceTurns - S.debtTurns === 1 ? "" : "s") + " before they take the serai.");
  }else S.debtTurns = 0;

  checkWin();
  after();
  if(!sheetOpen()) toast("", dateStr(S.turn) + " — " + hands() + " Hand" + (hands()===1?"":"s") + " to spend.");
}

function rollEvent(){
  const pool = EVENTS.filter(e => { try{ return e.when(); }catch(err){ return false; } });
  if(!pool.length) return;
  let total = pool.reduce((n,e)=>n + e.w, 0), r = Math.random()*total, chosen = pool[0];
  for(const e of pool){ r -= e.w; if(r <= 0){ chosen = e; break; } }
  let res = null;
  try{ res = chosen.run(); }catch(err){ res = null; }
  if(res && res.text) post(res.kind || "", res.text, res.d);
}

function checkWin(){
  if(S.over) return;
  const far = ["dunhuang","changan","turfan"].some(id => S.routes[id] && S.routes[id].runs > 0);
  if(netWorth() >= CONFIG.winDucats && S.repute >= CONFIG.winRepute && far){
    S.over = "win";
    post("gold","<em>Master of the Road.</em> Your mark is honoured from Tabriz to the Jade Gate, and men who have never seen your face stable their beasts in your yards.");
  }
}
function lose(){
  S.over = "lose";
  post("bad","<em>The creditors come.</em> They take the serai, the beasts and the godown, and leave you the clothes you stand in and the road you came by.");
  after();
}
function goalProgress(){
  const far = ["dunhuang","changan","turfan"].some(id => S.routes[id] && S.routes[id].runs > 0);
  return [
    {k:"Worth "+fmt(CONFIG.winDucats)+" ducats", v:clamp(netWorth()/CONFIG.winDucats,0,1), now:fmt(netWorth())},
    {k:"Repute "+CONFIG.winRepute,               v:clamp(S.repute/CONFIG.winRepute,0,1), now:S.repute},
    {k:"A caravan home from the far east",       v:far?1:0, now:far?"done":"not yet"}
  ];
}

  let best = null;
  ROUTES.forEach(r => { if(!routeOpen(r.id)) return;
    const p = Math.round(saleAt(r.id, g));
    if(!best || p > best.p) best = {p, city:CITIES[r.to].name};
  });
  return best;
}

      '<button data-a="cargo-" data-v="' + g + '">&minus;</button>' +
      '<span class="q">' + p.cargo[g] + '<small>of ' + (S.goods[g]+p.cargo[g]) + '</small></span>' +
      '<button data-a="cargo+" data-v="' + g + '">+</button></span></span></div>';
  });
  if(any) h += '<div class="btnrow"><button class="btn ghost sm" data-a="fill">Load best cargo</button>' +
    '<button class="btn ghost sm" data-a="clearcargo">Clear</button></div>';
  h += '</div>';

  h += '<div class="panel mb"><div class="kv"><span class="k">Escort</span><span class="v">' + (eCost?fmt(eCost)+"d":"free") + '</span></div><div class="pillrow mt">' +
    ESCORTS.map((e,i)=>'<button class="pill" data-a="escort" data-v="' + i + '" aria-pressed="' + (p.escort===i) + '">' +
      e.name + (e.cut?' &minus;' + Math.round(e.cut*100) + '%':'') + '</button>').join("") + '</div>' +
    '<div class="kv mt"><span class="k">Bring a return cargo</span><span class="v">' +
      '<button class="pill" data-a="bring" aria-pressed="' + p.bring + '">' +
      (p.bring ? "Yes — " + GOODS[CITIES[r.to].source ? CITIES[r.to].source.good : "silk"].short.toLowerCase() + " from " + CITIES[r.to].name : "No, coin only") +
      '</button></span></div></div>';

  h += '<div class="panel mb">' +
    '<div class="kv"><span class="k">Cargo at cost</span><span class="v">' + fmt(invested) + 'd</span></div>' +
    '<div class="kv"><span class="k">Expected at ' + CITIES[r.to].name + '</span><span class="v gold">' + fmt(val) + 'd</span></div>' +
    '<div class="kv"><span class="k">Distance premium</span><span class="v pos">+' + Math.round((distancePremium(r)-1)*100) + '%</span></div>' +
    '<div class="kv"><span class="k">That market is</span><span class="v ' + (satOf(r.id)>0.2?"neg":"") + '">' + satWord(r.id) +
      (satOf(r.id)>0.02 ? " (-" + Math.round(satOf(r.id)*100) + "%)" : "") + '</span></div>' +
    '<div class="kv"><span class="k">Expected profit</span><span class="v ' + (val-invested-eCost>=0?"pos":"neg") + '">' + sgn(val-invested-eCost) + 'd</span></div>' +
    '<div class="kv"><span class="k">Chance of trouble</span><span class="v neg">' + pct(risk) + '</span></div>' +
    '<div class="bar risk"><i style="width:' + Math.round(risk*100) + '%"></i></div></div>';

  h += '<div class="btnrow"><button class="btn ghost" data-a="cancel">Back</button>' +
       '<button class="btn" data-a="dispatch">Send it out</button></div>';
  return h + '</section>';
}

/* ------------------------------------------------------------ estate - */
function viewEstate(){
  let h = '<section class="sec"><h2>Property</h2><div class="rows">';
  Object.entries(PROPS).forEach(([id,def]) => {
    const tier = S.props[id], t = def.tiers[tier], next = def.tiers[tier+1];
    const locked = (def.rep && S.repute < def.rep) || (def.needsRoute && !routeOpen(def.needsRoute));
    const unstaffed = tier > 0 && !staffAt(id);
    h += '<button class="row" data-a="prop" data-v="' + id + '">' +
      '<span class="glyph">' + def.g + '</span>' +
      '<span class="main"><span class="t">' + def.name.replace(/,.*$/,"") +
        (unstaffed ? '<span class="tag bad">unstaffed</span>' : '') +
        (locked && tier===0 ? '<span class="tag">' + (def.rep ? "repute " + def.rep : "needs the road") + '</span>' : '') + '</span>' +
      '<span class="sub">' + t.name + (next ? ' &middot; next ' + fmt(next.cost) + 'd' : ' &middot; complete') + '</span></span>' +
      '<span class="end ' + (propIncome(id)?"pos":"") + '">' + (propIncome(id) ? "+" + propIncome(id) : "0") + '<small>per turn</small></span>' +
      '<span class="chev">›</span></button>';
  });
  h += '</div></section>';

  h += '<section class="sec"><h2>Beasts</h2><div class="rows">';
  Object.entries(BEASTS).forEach(([k,d]) => {
    if(k === "dhow" && !routeOpen("hormuz")) return;
    h += '<button class="row" data-a="beast" data-v="' + k + '">' +
      '<span class="glyph">' + d.g + '</span>' +
      '<span class="main"><span class="t">' + d.name + '</span><span class="sub">' + d.note + '</span></span>' +
      '<span class="end">' + S.beasts[k] + '<small>' + beastsFree(k) + ' free</small></span><span class="chev">›</span></button>';
  });
  h += '</div></section>';

  h += '<section class="sec"><h2>People on wages</h2><div class="rows">';
  if(!S.staff.length) h += '<div class="row static"><span class="main"><span class="sub">Nobody but your own family. Every property you build sits idle until somebody keeps it.</span></span></div>';
  S.staff.forEach(s => {
    const d = STAFF[s.type];
    h += '<button class="row" data-a="staff" data-v="' + s.id + '">' +
      '<span class="glyph">' + d.name.slice(0,2) + '</span>' +
      '<span class="main"><span class="t">' + d.name + (s.busy > S.turn ? '<span class="tag cool">on the road</span>' : '') + '</span>' +
      '<span class="sub">' + (s.at ? "At the " + PROPS[s.at].name.toLowerCase() : (d.effect || "Unposted")) + '</span></span>' +
      '<span class="end neg">-' + d.wage + '<small>per turn</small></span><span class="chev">›</span></button>';
  });
  h += '</div><button class="btn mt" data-a="hire">Hire someone</button></section>';
  return h;
}

/* ------------------------------------------------------------- house - */
function viewHouse(){
  let h = '<section class="sec"><h2>Your household</h2><div class="rows">';
  S.house.forEach(m => {
    const away = m.busy > S.turn;
    h += '<button class="row" data-a="member" data-v="' + m.id + '">' +
      '<span class="glyph">' + esc(m.name.slice(0,2)) + '</span>' +
      '<span class="main"><span class="t">' + esc(m.name) + (m.you ? '<span class="tag gold">you</span>' : '') +
        (m.partner ? '<span class="tag gold">partner</span>' : '') +
        (away ? '<span class="tag cool">away</span>' : '') + '</span>' +
      '<span class="sub">' + m.age + ' years &middot; ' + ROLES[m.role].name +
        (m.at ? " of the " + PROPS[m.at].name.toLowerCase().replace(/,.*$/,"") : "") + '</span></span>' +
      '<span class="end">' + "★".repeat(m.skill) + '<small>skill</small></span><span class="chev">›</span></button>';
  });
  h += '</div><p class="hint">Anyone at your side gives you a Hand each turn. Anyone given a standing role gives you none — and earns more than a Hand is worth.</p></section>';

  h += '<section class="sec"><h2>The city</h2><div class="rows">';
  SOCIAL.forEach(a => {
    const c = a.cost(), no = c > S.ducats || hands() < 1 || (a.when && !a.when());
    h += '<button class="row" data-a="social" data-v="' + a.id + '"' + (no ? " disabled" : "") + '>' +
      '<span class="main"><span class="t">' + a.name + '</span><span class="sub">' + a.desc + '</span></span>' +
      '<span class="end gold">' + fmt(c) + 'd<small>and a Hand</small></span></button>';
  });
  h += '</div><p class="hint">Repute opens roads, properties and offices, and adds up to 30% to every price you get. It is worth buying.</p></section>';

  h += '<section class="sec"><h2>The journal</h2>';
  if(!S.journal.length) h += '<p class="lede">Nothing has happened yet.</p>';
  S.journal.slice(0,30).forEach(j => {
    h += '<div class="entry ' + (j.kind||"") + '"><div class="when">' + dateStr(j.turn) + '</div>' +
      '<div class="txt">' + j.text + '</div>' +
      (j.deltas && j.deltas.length ? '<div class="delta">' + j.deltas.map(d=>'<span>' + esc(d) + '</span>').join("") + '</div>' : "") +
      '</div>';
  });
  return h + '</section>';
}

/* ------------------------------------------------------------ ledger - */

    '<div class="kv"><span class="k">Property income (staffed)</span><span class="v pos">+' + fmt(g) + '</span></div>' +

    '<div class="kv"><span class="k">Stores eaten each turn</span><span class="v">' + storesNeed() + '</span></div>' +
    '<div class="kv"><span class="k">Net worth</span><span class="v gold">' + fmt(netWorth()) + '</span></div>' +
    '</div></section>';

  h += '<section class="sec"><h2>The ledger</h2><div class="panel"><div class="scrollx"><table class="tbl">' +
    '<thead><tr><th>Item</th><th>Dare</th><th>Avere</th><th>Balance</th></tr></thead><tbody>';
  const rows = S.ledger.slice(-40).reverse();
  if(!rows.length) h += '<tr><td colspan="4">No entries yet.</td></tr>';
  rows.forEach(r => {
    h += '<tr><td>' + esc(r.item) + '<span class="w"> ' + dateStr(r.turn) + '</span></td>' +

      '<td class="pos">' + (r.avere ? fmt(r.avere) : "") + '</td>' +

    '<div class="kv"><span class="k">Caravans completed</span><span class="v">' + S.stat.tripsDone + '</span></div>' +
    '<div class="kv"><span class="k">Caravans lost</span><span class="v neg">' + S.stat.tripsLost + '</span></div>' +
    '<div class="kv"><span class="k">Taken in all</span><span class="v pos">' + fmt(S.stat.earned) + '</span></div>' +
    '<div class="kv"><span class="k">Paid out in all</span><span class="v neg">' + fmt(S.stat.spent) + '</span></div>' +
    '</div><button class="btn ghost mt" data-a="restart">Abandon this house and begin again</button></section>';

}

function viewOver(){
  const win = S.over === "win";

    '<h2 style="justify-content:center">' + (win ? "Master of the Road" : "The house is broken") + '</h2>' +
    '<p class="lede">' + (win

    '<div class="kv"><span class="k">Repute</span><span class="v">' + S.repute + '</span></div>' +
    '<div class="kv"><span class="k">Years on the road</span><span class="v">' + (yearOf(S.turn)-CONFIG.startYear) + '</span></div>' +

/* =====================================================================
   SHEETS, TOASTS, INPUT
   ===================================================================== */
let sheetRender = null, sheetQty = 1, pendingChoices = null;
const host = $("#sheetHost");
const sheetOpen = () => !!sheetRender;
function openSheet(fn, q){ sheetRender = fn; if(q !== undefined) sheetQty = q; paintSheet(); }
function closeSheet(){ sheetRender = null; pendingChoices = null; host.innerHTML = ""; }
function paintSheet(){
  if(!sheetRender){ host.innerHTML = ""; return; }
  host.innerHTML = '<div class="scrim" data-a="scrim"><div class="sheet"><div class="grab"></div>' + sheetRender() + '</div></div>';
}
function refreshSheet(){ if(sheetRender) paintSheet(); renderChips(); }

function ask(title, sub, choices){
  pendingChoices = choices;
  openSheet(() => '<h3>' + esc(title) + '</h3><p class="sub">' + esc(sub) + '</p>' +
    choices.map((c,i) => '<button class="choice" data-a="choice" data-v="' + i + '">' +
      '<span class="ct">' + esc(c.t) + '</span>' + (c.s ? '<span class="cs">' + esc(c.s) + '</span>' : "") + '</button>').join(""));
  return null;
}
function toast(kind, text){
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = text;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0";
    setTimeout(() => el.remove(), 320); }, 2200);
}
function flyCoin(ev, btn, text){
  if(!btn) return;
  const r = btn.getBoundingClientRect();
  const el = document.createElement("span");
  el.className = "coin"; el.textContent = text;
  const x = ev.clientX !== undefined && ev.clientX ? ev.clientX - r.left : r.width/2;
  el.style.left = clamp(x, 20, r.width-30) + "px";
  el.style.top = (ev.clientY !== undefined && ev.clientY ? ev.clientY - r.top : r.height/2) + "px";
  btn.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

/* ------------------------------------------------------- the sheets -- */
function sheetGood(g){
  const d = GOODS[g], bp = buyPrice(g), sp = localSell(g), room = capacity()-held();
  const maxBuy = Math.max(0, Math.min(room, Math.floor(S.ducats / bp)));
  const q = clamp(sheetQty, 1, Math.max(1, Math.max(maxBuy, S.goods[g])));
  let rows = "";
  ROUTES.filter(r => routeOpen(r.id)).forEach(r => {
    const p = Math.round(saleAt(r.id, g));
    rows += '<div class="kv"><span class="k">' + CITIES[r.to].name + ' <span class="num">(' + r.turns + 't)</span></span>' +
      '<span class="v ' + (p>bp?"pos":"neg") + '">' + p + 'd</span></div>';
  });
  return '<h3>' + d.name + '</h3><p class="sub">You hold ' + S.goods[g] + '. Room for ' + room + ' more loads.</p>' +
    '<div class="step mb"><button data-a="q-">&minus;</button><span class="q">' + q +
      '<small>' + fmt(q*bp) + 'd to buy · ' + fmt(q*sp) + 'd to sell here</small></span>' +
      '<button data-a="q+">+</button></div>' +
    '<div class="pillrow mb"><button class="pill" data-a="qset" data-v="1">1</button>' +
      '<button class="pill" data-a="qset" data-v="5">5</button>' +
      '<button class="pill" data-a="qset" data-v="10">10</button>' +
      '<button class="pill" data-a="qset" data-v="' + maxBuy + '">Max buy (' + maxBuy + ')</button>' +
      (S.goods[g] ? '<button class="pill" data-a="qset" data-v="' + S.goods[g] + '">All held (' + S.goods[g] + ')</button>' : '') + '</div>' +
    '<div class="btnrow"><button class="btn" data-a="buy" data-v="' + g + '"' + (maxBuy<1?" disabled":"") + '>Buy ' + q + ' · ' + fmt(q*bp) + 'd</button>' +
      '<button class="btn ghost" data-a="sell" data-v="' + g + '"' + (!S.goods[g]?" disabled":"") + '>Sell ' + Math.min(q,S.goods[g]) + ' here</button></div>' +
    '<div class="panel mt"><div class="kv"><span class="k"><b>What they pay elsewhere</b></span></div>' +
      (rows || '<p class="hint">No roads opened yet. Everything must be sold at home.</p>') + '</div>' +
    '<button class="btn ghost mt" data-a="close">Close</button>';
}

function sheetProp(id){
  const def = PROPS[id], tier = S.props[id], t = def.tiers[tier], next = def.tiers[tier+1];
  const s = staffAt(id);
  const lockRep = def.rep && S.repute < def.rep;
  const lockRoute = def.needsRoute && !routeOpen(def.needsRoute);
  const spare = S.staff.filter(x => x.type === def.staff && x.at !== id);
  let h = '<h3>' + def.name + '</h3><p class="sub">' + t.name + ' &mdash; ' + (t.note || "Not yet built.") + '</p>' +
    '<div class="panel mb">' +
    '<div class="kv"><span class="k">Income each turn</span><span class="v ' + (propIncome(id)?"pos":"") + '">' + (propIncome(id)?"+"+propIncome(id):"none") + '</span></div>' +
    (t.cap ? '<div class="kv"><span class="k">Warehouse space</span><span class="v">+' + t.cap + ' loads</span></div>' : '') +
    (t.buy ? '<div class="kv"><span class="k">Bazaar discount</span><span class="v">-' + Math.round(t.buy*100) + '%</span></div>' : '') +
    (t.sell ? '<div class="kv"><span class="k">Sale prices</span><span class="v">+' + Math.round(t.sell*100) + '%</span></div>' : '') +
    (t.silk ? '<div class="kv"><span class="k">Silk finished here sells for</span><span class="v">+' + Math.round(t.silk*100) + '%</span></div>' : '') +
    (t.risk ? '<div class="kv"><span class="k">Risk on every caravan</span><span class="v pos">-' + Math.round(t.risk*100) + '%</span></div>' : '') +
    (t.stores ? '<div class="kv"><span class="k">Stores made each turn</span><span class="v pos">+' + t.stores + '</span></div>' : '') +
    '<div class="kv"><span class="k">Kept by</span><span class="v">' + (s ? STAFF[s.type].name : (tier>0 ? '<span class="neg">nobody — it earns nothing</span>' : "&mdash;")) + '</span></div>' +
    '</div>';
  if(tier > 0 && !s){
    h += '<button class="btn mb" data-a="hirepick" data-v="' + def.staff + '">Hire a ' + STAFF[def.staff].name.toLowerCase() + ' · ' + STAFF[def.staff].hire + 'd</button>';
    spare.forEach(x => h += '<button class="btn ghost mb" data-a="assign" data-v="' + x.id + '|' + id + '">Post your ' + STAFF[x.type].name.toLowerCase() + ' here</button>');
  }
  if(next){
    const blocked = lockRep ? "Repute " + def.rep + " required" : lockRoute ? "You have no road to " + CITIES[def.city].name : null;
    h += '<div class="panel mb"><div class="kv"><span class="k"><b>' + next.name + '</b></span><span class="v gold">' + fmt(next.cost) + 'd</span></div>' +
      '<p class="hint">' + (next.note || "") + ' Costs one Hand.</p></div>' +
      '<button class="btn" data-a="upgrade" data-v="' + id + '"' + (blocked || next.cost>S.ducats || hands()<1 ? " disabled" : "") + '>' +
      (blocked || (next.cost>S.ducats ? "Not enough ducats" : hands()<1 ? "No Hands left this turn" : "Build it · " + fmt(next.cost) + "d")) + '</button>';
  }else h += '<p class="hint">This property is finished. Nothing more can be built here.</p>';
  return h + '<button class="btn ghost mt" data-a="close">Close</button>';
}

function sheetBeast(k){
  const d = BEASTS[k], maxQ = Math.max(1, Math.floor(S.ducats / d.buy));
  const q = clamp(sheetQty, 1, maxQ);
  return '<h3>' + d.name + '</h3><p class="sub">' + d.note + ' Upkeep ' + d.upkeep + 'd each, every turn.</p>' +
    '<div class="step mb"><button data-a="q-">&minus;</button><span class="q">' + q + '<small>' + fmt(q*d.buy) + 'd</small></span><button data-a="q+">+</button></div>' +
    '<button class="btn" data-a="beastbuy" data-v="' + k + '"' + (d.buy*q > S.ducats ? " disabled" : "") + '>Buy ' + q + ' · ' + fmt(q*d.buy) + 'd</button>' +
    '<p class="hint">You own ' + S.beasts[k] + ', of which ' + beastsFree(k) + ' are in the yard. Capacity ' + d.cap + ' loads each.</p>' +
    '<button class="btn ghost mt" data-a="close">Close</button>';
}

function sheetHire(){
  return '<h3>Hire</h3><p class="sub">A signing fee now, wages every turn after. Costs one Hand.</p><div class="rows">' +
    Object.entries(STAFF).map(([k,d]) => {
      const need = Object.keys(PROPS).find(p => PROPS[p].staff === k && S.props[p] > 0 && !staffAt(p));
      return '<button class="row" data-a="hirebuy" data-v="' + k + '"' + (d.hire > S.ducats || hands() < 1 ? " disabled" : "") + '>' +
      '<span class="glyph">' + d.name.slice(0,2) + '</span>' +
      '<span class="main"><span class="t">' + d.name + (need ? '<span class="tag good">wanted</span>' : '') + '</span>' +
      '<span class="sub">' + (d.effect || d.desc) + '</span></span>' +
      '<span class="end gold">' + d.hire + '<small>then ' + d.wage + '/turn</small></span></button>';
    }).join("") + '</div>' +
    (hands() < 1 ? '<p class="hint">No Hands left this turn.</p>' : '') +
    '<button class="btn ghost mt" data-a="close">Close</button>';
}
function sheetStaff(sid){
  const s = S.staff.find(x => x.id === sid); if(!s) return "";
  const d = STAFF[s.type];
  const posts = Object.keys(PROPS).filter(p => PROPS[p].staff === s.type && S.props[p] > 0);
  return '<h3>' + d.name + '</h3><p class="sub">' + d.desc + '</p>' +
    '<div class="panel mb"><div class="kv"><span class="k">Wage</span><span class="v neg">-' + d.wage + ' each turn</span></div>' +
    '<div class="kv"><span class="k">Posted to</span><span class="v">' + (s.at ? PROPS[s.at].name : "nowhere") + '</span></div></div>' +
    posts.map(p => '<button class="btn ghost mb" data-a="assign" data-v="' + s.id + '|' + p + '"' + (s.at===p?" disabled":"") + '>Post to the ' + PROPS[p].name.toLowerCase() + '</button>').join("") +
    '<button class="btn danger mt" data-a="dismiss" data-v="' + s.id + '">Pay off and dismiss</button>' +
    '<button class="btn ghost mt" data-a="close">Close</button>';
}
function sheetMember(mid){
  const m = S.house.find(x => x.id === mid); if(!m) return "";
  const built = Object.keys(PROPS).filter(p => S.props[p] > 0);
  let h = '<h3>' + esc(m.name) + '</h3><p class="sub">' + m.age + ' years old &middot; skill ' + m.skill + ' of 5' +
    (m.busy > S.turn ? ' &middot; away until turn ' + (m.busy+1) : "") + '</p>';
  if(m.busy > S.turn) return h + '<p class="hint">On the road. Nothing can be changed until they are home.</p><button class="btn ghost mt" data-a="close">Close</button>';
  h += '<div class="rows mb">' + Object.entries(ROLES).map(([k,r]) => {
    if(k === "steward") return "";
    return '<button class="row" data-a="role" data-v="' + m.id + '|' + k + '"' + (m.role===k?" disabled":"") + '>' +
      '<span class="main"><span class="t">' + r.name + (m.role===k?'<span class="tag gold">current</span>':'') + '</span>' +
      '<span class="sub">' + r.desc + '</span></span><span class="chev">›</span></button>';
  }).join("") +
  built.map(p => '<button class="row" data-a="role" data-v="' + m.id + '|steward|' + p + '"' +
      (m.role==="steward"&&m.at===p?" disabled":"") + '><span class="main">' +
      '<span class="t">Steward of the ' + PROPS[p].name.toLowerCase().replace(/,.*$/,"") +
      (m.role==="steward"&&m.at===p?'<span class="tag gold">current</span>':'') + '</span>' +
      '<span class="sub">+25% of that property\'s income. Gives no Hand.</span></span><span class="chev">›</span></button>').join("") +
  '</div>';
  return h + '<button class="btn ghost" data-a="close">Close</button>';
}
function sheetRoute(rid){
  const r = route(rid), disc = S.flags["disc_"+rid] ? 0.7 : 1, cost = Math.round((r.cost||0)*disc);
  return '<h3>' + r.name + '</h3><p class="sub">' + r.note + '</p>' +
    '<div class="panel mb"><div class="kv"><span class="k">To</span><span class="v">' + CITIES[r.to].name + '</span></div>' +
    '<div class="kv"><span class="k">Round trip</span><span class="v">' + r.turns + ' turns</span></div>' +
    '<div class="kv"><span class="k">Base risk</span><span class="v neg">' + pct(r.risk) + '</span></div>' +
    '<div class="kv"><span class="k">Scouting</span><span class="v gold">' + fmt(cost) + 'd' + (disc<1?' (rumour heard)':'') + '</span></div>' +
    (r.needs ? '<div class="kv"><span class="k">Requires</span><span class="v">' + (r.needs==="guide"?"a mountain guide":"a dhow and a captain") + '</span></div>' : '') +
    '<div class="kv"><span class="k">They pay well for</span><span class="v">' +
      Object.entries(CITIES[r.to].demand).filter(([k])=>k!=="def").sort((a,b)=>b[1]-a[1]).slice(0,3)
        .map(([k])=>GOODS[k].short.toLowerCase()).join(", ") + '</span></div></div>' +
    '<button class="btn" data-a="scout" data-v="' + rid + '"' + (cost>S.ducats||hands()<1?" disabled":"") + '>' +
      (cost>S.ducats ? "Not enough ducats" : hands()<1 ? "No Hands left this turn" : "Scout it · " + fmt(cost) + "d and a Hand") + '</button>' +
    '<button class="btn ghost mt" data-a="close">Close</button>';
}
const SON_NAMES = ["Tair","Sanjar","Ilyas","Rustam","Davud","Arslan","Kamil","Bahram"];
function sheetIntro(){
  return '<h3>The House of the Broken Serai</h3>' +
    '<p class="sub">Samarkand, the spring of 1247. The wars are over, the roads are open under Mongol law, and a ruined caravanserai on the Zarafshan can be had for what you have.</p>' +
    '<div class="panel mb"><div class="kv"><span class="k">Your name</span></div>' +
    '<input id="pname" value="Yusuf ibn Ishaq" maxlength="28" style="width:100%;margin-top:6px;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--ground-2)"></div>' +
    '<div class="panel mb"><p class="hint" style="margin:0">' +
      '<b>Hands</b> are actions. You and your two sons give three a turn; a standing role trades a Hand for income.<br>' +
      '<b>Ducats</b> below zero for three turns and the creditors take everything.<br>' +
      '<b>Stores</b> feed the household, the staff and the beasts. Run out and you buy at famine prices.<br>' +
      '<b>Repute</b> opens roads, offices and better prices.<br>' +
      'Buy cheap in the bazaar, carry it far, sell dear. Then buy the property that earns while you sleep.</p></div>' +
    '<button class="btn" data-a="newgame">Take the serai</button>';
}

/* --------------------------------------------------------- the wiring - */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]"); if(!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  if(a === "scrim" && e.target === t){ closeSheet(); return; }
  if(a === "scrim") return;
  if(t.disabled) return;

  switch(a){
    case "go": go(v); break;
    case "cancel": cancelPlan(); after(); window.scrollTo(0,0); break;
    case "close": closeSheet(); render(); break;
    case "haggle": haggle(e, t); break;
    case "stores": buyStores(+v); break;

    case "good": openSheet(() => sheetGood(v), 1); break;
    case "q+": sheetQty = Math.min(999, sheetQty+1); refreshSheet(); break;
    case "q-": sheetQty = Math.max(1, sheetQty-1); refreshSheet(); break;
    case "qset": sheetQty = Math.max(1, +v); refreshSheet(); break;
    case "buy": buyGoods(v, sheetQty); refreshSheet(); break;
    case "sell": sellGoods(v, sheetQty); refreshSheet(); break;

    case "prop": openSheet(() => sheetProp(v)); break;
    case "upgrade": upgradeProp(v); break;
    case "beast": openSheet(() => sheetBeast(v), 1); break;
    case "beastbuy": buyBeast(v, sheetQty); break;
    case "hire": case "hirepick": openSheet(() => sheetHire()); break;
    case "hirebuy": hireStaff(v); break;
    case "staff": openSheet(() => sheetStaff(v)); break;
    case "dismiss": dismissStaff(v); break;
    case "assign": { const [sid,pid] = v.split("|"); assignStaff(sid,pid); break; }
    case "member": openSheet(() => sheetMember(v)); break;
    case "social": doSocial(v); break;
    case "role": { const p = v.split("|"); setRole(p[0], p[1], p[2]); break; }

    case "route": openSheet(() => sheetRoute(v)); break;
    case "scout": openRoute(v); break;
    case "plan": planInit(v); after(); window.scrollTo(0,0); break;
    case "leader": S.plan.leader = v; after(); break;
    case "escort": S.plan.escort = +v; after(); break;
    case "bring": S.plan.bring = !S.plan.bring; after(); break;
    case "beast+": if(beastsFree(v) > S.plan.beasts[v]) S.plan.beasts[v]++; after(); break;
    case "beast-": if(S.plan.beasts[v] > 0){ S.plan.beasts[v]--;
        while(planLoads() > planCap()){ const g = GOOD_IDS.find(x => S.plan.cargo[x] > 0); if(!g) break; S.plan.cargo[g]--; S.goods[g]++; } }
      after(); break;
    case "cargo+": if(S.goods[v] > 0 && planLoads() < planCap()){ S.goods[v]--; S.plan.cargo[v]++; } after(); break;
    case "cargo-": if(S.plan.cargo[v] > 0){ S.plan.cargo[v]--; S.goods[v]++; } after(); break;
    case "clearcargo": GOOD_IDS.forEach(g => { S.goods[g] += S.plan.cargo[g]; S.plan.cargo[g] = 0; }); after(); break;
    case "fill": autoFill(); after(); break;
    case "dispatch": dispatch(); break;

    case "choice": {
      const c = pendingChoices && pendingChoices[+v];
      closeSheet();
      if(c && c.do) c.do();
      after(); break;
    }
    case "restart":
      ask("Abandon the house?","Everything is lost and a new house begins in the spring of 1247.",[
        {t:"Begin again", s:"", do(){ wipe(); closeSheet(); startIntro(); }},
        {t:"No", s:"", do(){}}
      ]);
      break;
    case "newgame": {
      const el = document.getElementById("pname");
      const name = (el && el.value.trim()) || "Yusuf ibn Ishaq";
      const pool = SON_NAMES.slice(); const a1 = pool.splice(irnd(0,pool.length-1),1)[0]; const a2 = pool[irnd(0,pool.length-1)];
      newGame("The House of " + name.split(" ")[0], name, a1, a2);
      closeSheet(); after(); break;
    }
  }
});
$("#endturn").addEventListener("click", () => {
  if(hands() > 0 && !S.over && !S.flags.noHandWarn){
    ask("Hands unspent","You still have " + hands() + " Hand" + (hands()===1?"":"s") + " this turn. A Hand not spent is gone.",[
      {t:"End the turn anyway", s:"", do(){ endTurn(); }},
      {t:"Wait — I'll use them", s:"", do(){}},
      {t:"End it, and stop asking", s:"You know how Hands work now.", do(){ S.flags.noHandWarn = true; endTurn(); }}
    ]);
    return;
  }
  endTurn();
});

function autoFill(){
  const ranked = GOOD_IDS.map(g => ({g, m: saleAt(S.plan.rid, g) - buyPrice(g)})).sort((a,b) => b.m - a.m);
  ranked.forEach(({g,m}) => {
    if(m <= 0) return;
    while(S.goods[g] > 0 && planLoads() < planCap()){ S.goods[g]--; S.plan.cargo[g]++; }
  });
}

function startIntro(){ openSheet(sheetIntro); }

/* ------------------------------------------------------------- boot -- */
(function boot(){
  if(load()){ render(); }
  else{ newGame("The House of Yusuf","Yusuf ibn Ishaq","Tair","Sanjar"); render(); startIntro(); }
  window.addEventListener("beforeunload", save);
})();
</script>
</body>
</html>
