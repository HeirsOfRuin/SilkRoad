/* =====================================================================
   THE CARAVAN
   ===================================================================== */
const ESCORTS = [
  {name:"None",         cut:0,    c:0},
  {name:"Hired spears", cut:0.15, c:9},
  {name:"Strong escort",cut:0.30, c:22}
];
const escortCost = (i, turns) => Math.round(ESCORTS[i].c * turns * 1.4);
const keyOf = (line, tier) => line + ":" + tier;

function planInit(rid){
  cancelPlan();
  S.plan = {rid, leader:null, units:{}, cargo:Object.fromEntries(GOOD_IDS.map(g=>[g,0])), escort:0, bring:true};
}
function cancelPlan(){
  if(!S.plan) return;
  GOOD_IDS.forEach(g => { S.goods[g] += S.plan.cargo[g] || 0; });   // unload before you walk away
  S.plan = null;
}
function planGroups(){                       // what may go on this road
  const r = route(S.plan.rid), out = [];
  FLEET_LINES.forEach(line => {
    if(!lineOk(line, r.terrain)) return;
    FLEET[line].tiers.forEach((t, tier) => {
      const free = freeOn(line, tier).length;
      const taken = S.plan.units[keyOf(line,tier)] || 0;
      if(free > 0 || taken > 0) out.push({line, tier, def:t, free, taken});
    });
  });
  return out;
}
const planCap = () => Object.entries(S.plan.units)
  .reduce((n,[k,q]) => { const [line,tier] = k.split(":"); return n + q * FLEET[line].tiers[+tier].cap; }, 0);
const planLoads = () => GOOD_IDS.reduce((n,g)=>n + S.plan.cargo[g], 0);
const planValue = () => GOOD_IDS.reduce((n,g)=> n + S.plan.cargo[g] * saleAt(S.plan.rid, g), 0);
function planRisk(){
  const p = S.plan;
  const lead = p.leader ? (leaderOf(p.leader) || {skill:2}).skill : 2;
  return routeRisk(p.rid, ESCORTS[p.escort].cut + lead*0.03);
}
function leaderOf(id){
  return S.house.find(m => m.id === id) || S.staff.find(s => s.id === id) || null;
}
function leaderName(id){
  const l = leaderOf(id);
  if(!l) return "your caravan master";
  return l.name + (l.type ? " (your " + STAFF[l.type].name.toLowerCase() + ")" : "");
}
function autoFill(){
  GOOD_IDS.map(g => ({g, m: saleAt(S.plan.rid, g) - buyPrice(g)})).sort((a,b) => b.m - a.m)
    .forEach(({g,m}) => {
      if(m <= 0) return;
      while(S.goods[g] > 0 && planLoads() < planCap()){ S.goods[g]--; S.plan.cargo[g]++; }
    });
}
function dispatch(){
  const p = S.plan, r = route(p.rid);
  const block = routeBlocked(r);
  if(block){ toast("bad", block + "."); return; }
  if(!p.leader){ toast("bad","Choose someone to lead it."); return; }
  if(planLoads() === 0){ toast("bad","An empty caravan earns nothing."); return; }
  if(planLoads() > planCap()){ toast("bad","More cargo than beasts to carry it."); return; }
  const eCost = escortCost(p.escort, r.turns);
  if(eCost > S.ducats){ toast("bad","You cannot pay the escort."); return; }
  const lead = leaderOf(p.leader);
  if(!lead || lead.busy > S.turn){ toast("bad","That one cannot go."); return; }

  // take the actual units out of the yard
  const taken = [];
  for(const [k,q] of Object.entries(p.units)){
    const [line, tier] = k.split(":");
    const avail = freeOn(line, +tier);
    if(avail.length < q){ toast("bad","Those beasts are not all in the yard."); return; }
    for(let i=0;i<q;i++) taken.push(avail[i]);
  }
  lead.busy = S.turn + r.turns;
  taken.forEach(u => u.busy = S.turn + r.turns);
  if(eCost) coin(-eCost, "Escort for " + r.name.toLowerCase());
  let invested = 0;
  GOOD_IDS.forEach(g => { invested += p.cargo[g] * buyPrice(g); });   // cargo left the godown as it was loaded

  S.caravans.push({
    id:uid("c"), rid:p.rid, leader:p.leader, leaderName:leaderName(p.leader),
    units:taken.map(u => u.id), cargo:{...p.cargo}, loads:planLoads(), escort:p.escort,
    bring:p.bring, out:S.turn, due:S.turn + r.turns, invested:Math.round(invested),
    expect:Math.round(planValue()), risk:planRisk()
  });
  post("gold","<em>" + esc(r.name) + ".</em> " + esc(leaderName(p.leader)) + " leads " + planLoads() +
      " loads out through the eastern gate. Expected back in " + r.turns + " turn" + (r.turns>1?"s":"") + ".");
  toast("good","Caravan away.");
  S.plan = null; S.tab = "roads"; after();
}

/* -------------------------------------------------- what came back --- */
function tripText(e, ctx){
  return e.x.replace(/\{leader\}/g, esc(ctx.leader))
            .replace(/\{city\}/g, esc(ctx.city))
            .replace(/\{road\}/g, esc(ctx.road));
}
function pickTrip(terrain, kind){
  const pool = TRIP_EVENTS.filter(e => (e.t === "any" || e.t === terrain) && e.k === kind);
  return pool.length ? pick(pool) : null;
}
function applyFx(fx, ctx){
  if(!fx) return null;
  if(fx === "coin"){ const n = irnd(45, 130 + ctx.r.turns*14); coin(n, "On the road: a side bargain"); return "+" + fmt(n) + "d"; }
  if(fx === "goods"){
    const src = CITIES[ctx.r.to].source; if(!src) return null;
    const q = Math.min(irnd(2,5), Math.max(0, capacity() - held())); if(q <= 0) return null;
    S.goods[src.good] += q; return "+" + q + " " + GOODS[src.good].short.toLowerCase();
  }
  if(fx === "repute"){ const r = repute(3); return "+" + r + " repute"; }
  if(fx === "stores"){ const n = irnd(10,24); S.stores += n; return "+" + n + " stores"; }
  if(fx === "camel"){ addUnit("camel", 0); return "+1 camel"; }
  if(fx === "rumour"){
    const un = ROUTES.filter(r => !routeOpen(r.id) && !S.flags["disc_"+r.id]);
    if(!un.length) return null;
    const r = pick(un); S.flags["disc_"+r.id] = true; return "rumour: " + r.name;
  }
  if(fx === "skill"){
    const l = leaderOf(ctx.c.leader);
    if(l && l.skill < 5){ l.skill++; return "skill " + l.skill; }
    return null;
  }
  if(fx === "loyalty"){ S.staff.forEach(s => s.loyalty = clamp(s.loyalty+8,0,100)); return "the yard is pleased"; }
  if(fx === "loyalty-"){ S.staff.forEach(s => s.loyalty = clamp(s.loyalty-6,0,100)); return "the yard grumbles"; }
  if(fx.indexOf("issue:") === 0){
    const id = fx.slice(6);
    const data = id === "bandits" ? {rid:ctx.c.rid} : id === "plague" ? {city:ctx.r.to} : null;
    if(!hasIssue(id) || ISSUES[id].route || ISSUES[id].city){ addIssue(id, data); return "a matter outstanding"; }
    return null;
  }
  return null;
}

function resolveCaravan(c){
  const r = route(c.rid), rec = S.routes[c.rid];
  const ctx = {c, r, leader:c.leaderName, city:CITIES[r.to].name, road:r.name};
  const hit = Math.random() < c.risk;
  let kind, lossFrac = 0, tag = "good";
  if(hit){
    const roll = Math.random();
    if(roll < 0.55){ kind = "minor";    lossFrac = rnd(0.08,0.25); tag = "bad"; }
    else if(roll < 0.85){ kind = "moderate"; lossFrac = rnd(0.26,0.52); tag = "bad"; repute(-1); }
    else{
      kind = "severe"; lossFrac = rnd(0.65,1.00); tag = "bad"; repute(-3);
      S.stat.tripsLost++;
      const doomed = c.units.filter(() => chance(0.45));
      if(doomed.length) S.fleet = S.fleet.filter(u => doomed.indexOf(u.id) < 0);
      ctx.beastsLost = doomed.length;
    }
  }else{
    kind = chance(0.28) ? "boon" : "colour";
  }
  const ev = pickTrip(r.terrain, kind) || pickTrip("any", kind);
  const lines = [], deltas = [];
  if(ev) lines.push(tripText(ev, ctx));
  if(ctx.beastsLost) lines.push(ctx.beastsLost + (ctx.beastsLost === 1 ? " beast was" : " beasts were") + " lost with the loads.");

  /* what actually arrived */
  const delivered = {};
  GOOD_IDS.forEach(g => delivered[g] = c.cargo[g] * (1 - lossFrac));

  /* contracts are filled before the market sees anything */
  const done = [];
  S.contracts.filter(k => k.city === r.to).forEach(k => {
    if(Math.floor(delivered[k.good]) >= k.qty){
      delivered[k.good] -= k.qty;
      const paid = k.qty * k.pay;
      coin(paid, "Contract: " + k.qty + " " + GOODS[k.good].short.toLowerCase() + " to " + CITIES[k.city].name);
      repute(k.rep); S.stat.deals++; done.push(k);
      lines.push("The order for " + esc(k.patron) + " is filled to the load and paid on the quay.");
      deltas.push("contract +" + fmt(paid) + "d");
    }
  });
  if(done.length) S.contracts = S.contracts.filter(k => done.indexOf(k) < 0);

  /* and the rest goes to market */
  let revenue = 0;
  GOOD_IDS.forEach(g => { if(delivered[g] > 0) revenue += delivered[g] * saleAt(c.rid, g); });
  revenue = Math.round(revenue);
  if(revenue) coin(revenue, r.name + " — sales at " + CITIES[r.to].name);

  /* return cargo, bought cheap at the far market */
  let brought = null;
  if(c.bring && revenue > 0 && CITIES[r.to].source && lossFrac < 0.7){
    const src = CITIES[r.to].source;
    const unit = Math.max(1, Math.round(GOODS[src.good].base * src.mult));
    const room = Math.max(0, capacity() - held());
    const q = Math.min(Math.floor(revenue * 0.3 / unit), room, Math.floor(c.loads * 0.8));
    if(q > 0){
      coin(-q * unit, "Return cargo from " + CITIES[r.to].name);
      S.goods[src.good] += q;
      brought = q + " " + GOODS[src.good].short.toLowerCase();
    }
  }

  rec.runs = (rec.runs || 0) + 1;
  rec.sat = (rec.sat || 0) + CONFIG.satPerRun;
  S.stat.tripsDone++;
  if(!hit) repute(Math.max(1, Math.round(r.turns / 2)));
  const fxNote = ev ? applyFx(ev.fx, ctx) : null;
  if(fxNote) deltas.push(fxNote);

  const l = leaderOf(c.leader);
  if(l && !l.type && l.skill < 5 && chance(0.40)){ l.skill++; lines.push(esc(l.name) + " comes back harder to fool."); }
  if(l && l.type) l.loyalty = clamp(l.loyalty + (hit ? -4 : 6), 0, 100);

  const profit = revenue - c.invested;
  deltas.unshift(revenue ? "+" + fmt(revenue) + "d sales" : "");
  deltas.push(profit >= 0 ? "net +" + fmt(profit) + "d" : "net " + fmt(profit) + "d");
  if(lossFrac > 0) deltas.push("lost " + pct(lossFrac) + " of the cargo");
  post(tag === "good" ? (kind === "boon" ? "gold" : "good") : "bad",
    "<em>" + esc(c.leaderName) + " is back from " + esc(CITIES[r.to].name) + ".</em> " + lines.join(" ") +
    (brought ? " They bring " + brought + " home in the empty panniers." : ""),
    deltas.filter(Boolean));
  fireThread("caravan", {route:r, city:CITIES[r.to].name, hit, profit});
}

/* =====================================================================
   END OF TURN
   ===================================================================== */
function endTurn(){
  if(S.over) return;
  if(sheetOpen()) return;
  const e = issueEff();

  /* 1. standing business */
  const gross = grossIncome() + yamIncome();
  if(gross > 0) coin(gross, "Standing income" + (yamIncome() ? " (incl. post-stage)" : ""));
  const w = wages(); if(w) coin(-w, "Wages");
  const u = upkeep(); if(u) coin(-u, "Fodder and farriers");
  if(e.drain) coin(-e.drain, "Matters outstanding");
  if(S.flags.loan){
    const p = Math.min(S.flags.loan.per, S.flags.loan.left);
    coin(-p, "Repayment to Yakub");
    S.flags.loan.left = Math.max(0, S.flags.loan.left - p);
  }
  if(e.repute) repute(e.repute);

  /* 2. the household eats */
  const need = storesNeed();
  let hungry = false;
  if(S.stores >= need){ S.stores -= need; }
  else{
    hungry = true;
    const shortfall = need - S.stores;
    S.stores = 0;
    const emergency = Math.round(shortfall * CONFIG.storePrice * 1.5);
    coin(-emergency, "Emergency grain at famine prices");
    repute(-1);
    post("bad","<em>The stores are empty.</em> You buy grain in the panic market at half again its worth, and the drivers notice which house could not feed them.",["-"+fmt(emergency)+"d","-1 repute"]);
  }
  const seraiStores = PROPS.serai.tiers[S.props.serai].stores || 0;
  if(seraiStores && staffAt("serai") && e.props.indexOf("serai") < 0) S.stores += seraiStores;

  /* 3. the people you pay */
  S.staff.forEach(s => {
    s.years = (s.years || 0) + 1;
    let d = (S.ducats >= 0 ? 2 : -6) + (hungry ? -5 : 0) - (hasOrigin("hard") ? 3 : 0);
    s.loyalty = clamp((s.loyalty === undefined ? 55 : s.loyalty) + d, 0, 100);
  });
  const quitters = S.staff.filter(s => s.loyalty <= 4 && !s.trusted);
  if(quitters.length){
    S.staff = S.staff.filter(s => quitters.indexOf(s) < 0);
    repute(-2);
    post("bad","<em>" + esc(quitters.map(q=>q.name).join(" and ")) + " walk" + (quitters.length===1?"s":"") +
      " out.</em> No notice, no argument. The gate is left open behind them.");
  }

  /* 4. goods spoil where the roof leaks */
  if(e.decay > 0){
    let lost = 0;
    GOOD_IDS.forEach(g => { const q = Math.floor(S.goods[g] * e.decay); if(q > 0){ S.goods[g] -= q; lost += q; } });
    if(lost) post("bad","Damp gets into the bales again. " + lost + " loads are written off.",["-"+lost+" loads"]);
  }
  if(e.beastLoss > 0 && S.fleet.length && chance(e.beastLoss)){
    const u2 = pick(S.fleet.filter(x => x.busy <= S.turn) .length ? S.fleet.filter(x => x.busy <= S.turn) : S.fleet);
    S.fleet = S.fleet.filter(x => x !== u2);
    post("bad","The murrain takes one of the beasts in the night.",["-1 " + unitDef(u2).name.toLowerCase()]);
  }

  /* 5. the calendar turns */
  const oldYear = yearOf(S.turn);
  S.turn++;
  const newYear = yearOf(S.turn) !== oldYear;
  if(newYear) S.house.forEach(m => m.age++);
  S.haggles = maxHaggles();

  /* 6. caravans come home */
  const due = S.caravans.filter(c => c.due <= S.turn);
  S.caravans = S.caravans.filter(c => c.due > S.turn);
  due.forEach(resolveCaravan);

  /* 7. orders run out of time */
  const late = S.contracts.filter(k => k.due < S.turn);
  if(late.length){
    S.contracts = S.contracts.filter(k => late.indexOf(k) < 0);
    late.forEach(k => {
      const pen = Math.round(k.qty * k.pay * 0.25);
      coin(-pen, "Penalty: " + esc(k.patron));
      repute(-k.rep); S.stat.dealsLate++;
      post("bad","<em>An order missed.</em> " + esc(k.patron) + " waited for " + k.qty + " loads of " +
        GOODS[k.good].short.toLowerCase() + " and did not get them. The penalty is written into the bond.",
        ["-"+fmt(pen)+"d","-"+k.rep+" repute"]);
    });
  }
  /* offers go stale, and new ones arrive */
  S.offers = S.offers.filter(o => chance(0.75));
  if(S.offers.length < 3 && chance(0.5) && contractCities().length){
    const src = (S.marriages.length && chance(0.45)) ? "house:" + pick(S.marriages) : null;
    const o = makeOffer(src);
    if(o) S.offers.push(o);
  }

  /* 8. matters outstanding tick down */
  S.issues = S.issues.filter(it => {
    if(it.until && S.turn >= it.until){
      post("good","<em>Settled by time.</em> " + esc(issueTitle(it)) + " has passed off on its own.");
      return false;
    }
    return true;
  });

  /* 9. the market drifts, and the roads recover */
  GOOD_IDS.forEach(g => {
    const drift = rnd(-0.07, 0.07) + (GOODS[g].supply - S.supply[g]) * 0.12;
    S.supply[g] = clamp(S.supply[g] + drift, 0.55, 2.1);
  });
  Object.values(S.routes).forEach(r => { if(r.sat) r.sat *= CONFIG.satDecay; });

  /* 10. one thing happens, then one beat of a longer story */
  if(!sheetOpen() && chance(0.72)) rollEvent();
  if(!sheetOpen() && S.ducats < 0) fireThreadId("debt", null);
  if(!sheetOpen()) fireThread("turn", null);

  /* 11. mortality */
  if(newYear) mortality();

  /* 12. solvency */
  if(S.over) return;
  const grace = CONFIG.debtGraceTurns + bonus().graceTurns;
  if(S.ducats < 0){
    S.debtTurns++;
    if(S.debtTurns >= grace) return lose();
    post("bad","<em>You are in the red by " + fmt(-S.ducats) + " ducats.</em> The creditors of the cloth row allow " +
      (grace - S.debtTurns) + " more turn" + (grace - S.debtTurns === 1 ? "" : "s") + " before they take the serai.");
  }else S.debtTurns = 0;

  checkWin();
  after();
  if(!sheetOpen()) toast("", dateStr(S.turn) + " — " + hands() + " Hand" + (hands()===1?"":"s") + " to spend.");
}

/* the price of starting old */
function mortality(){
  const you = S.house.find(m => m.you); if(!you) return;
  const frail = hasOrigin("weak") ? 8 : 0;
  if(you.age < 56 - frail) return;
  const risk = (you.age - 52 + frail) * 0.02;
  if(!chance(risk)) return;
  const heirs = S.house.filter(m => !m.you && m.age >= 16).sort((a,b)=>b.age-a.age);
  if(!heirs.length){
    S.over = "died";
    post("bad","<em>" + esc(you.name) + " dies in the " + seasonOf(S.turn).toLowerCase() + " of " + yearOf(S.turn) +
      ".</em> There is nobody of an age to take the seal. The creditors divide the yard between them and the name goes out of the cloth row within a year.");
    return;
  }
  const heir = heirs[0];
  you.you = false; you.dead = true;
  S.house = S.house.filter(m => m !== you);
  heir.you = true; heir.role = "idle"; heir.at = null;
  repute(-8);
  post("gold","<em>" + esc(you.name) + " dies at " + you.age + ".</em> " + esc(heir.name) + " takes the seal, the ledger and the debts. " +
    "Half the buyers on the road will have to be met again for the first time.",["-8 repute"]);
}

function rollEvent(){
  const pool = EVENTS.filter(e => { try{ return e.when(); }catch(err){ return false; } });
  if(!pool.length) return;
  let total = pool.reduce((n,e)=>n + e.w, 0), r = Math.random()*total, chosen = pool[0];
  for(const e of pool){ r -= e.w; if(r <= 0){ chosen = e; break; } }
  let res = null;
  try{ res = chosen.run(); }catch(err){ res = null; }
  if(res && res.text) post(res.kind || "", res.text, res.d);
}

function fireThreadId(id, ctx){ const t = THREADS.find(x => x.id === id); return t ? runBeat(t, ctx) : false; }
function runBeat(t, ctx){
  const st = S.threads[t.id];
  if(!st || st.done || st.cool > S.turn) return false;
  const beat = t.stages[st.stage];
  if(!beat){ st.done = true; return false; }
  let ok = false;
  try{ ok = beat.when(ctx); }catch(e){ ok = false; }
  if(!ok) return false;
  if(beat.run(ctx) !== false){
    st.stage++; st.cool = S.turn + irnd(2,4);
    if(st.stage >= t.stages.length) st.done = true;
  }
  return true;
}
function fireThread(trigger, ctx){
  for(const t of THREADS){
    const st = S.threads[t.id];
    if(!st || st.done || st.cool > S.turn) continue;
    if((t.trigger || "turn") !== trigger) continue;
    if(runBeat(t, ctx)) return true;
  }
  return false;
}

function checkWin(){
  if(S.over || S.flags.won) return;
  const far = ["dunhuang","changan","turfan"].some(id => S.routes[id] && S.routes[id].runs > 0);
  if(netWorth() >= CONFIG.winDucats && S.repute >= CONFIG.winRepute && far){
    S.over = "win";
    post("gold","<em>Master of the Road.</em> Your mark is honoured from Tabriz to the Jade Gate, and men who have never seen your face stable their beasts in your yards.");
  }
}
function lose(){
  S.over = "lose";
  post("bad","<em>The creditors come.</em> They take the serai, the beasts and the godown, and leave you the clothes you stand in and the road you came by.");
  after();
}
function goalProgress(){
  const far = ["dunhuang","changan","turfan"].some(id => S.routes[id] && S.routes[id].runs > 0);
  return [
    {k:"Worth "+fmt(CONFIG.winDucats)+" ducats", v:clamp(netWorth()/CONFIG.winDucats,0,1), now:fmt(netWorth())},
    {k:"Repute "+CONFIG.winRepute,               v:clamp(S.repute/CONFIG.winRepute,0,1), now:S.repute},
    {k:"A caravan home from the far east",       v:far?1:0, now:far?"done":"not yet"}
  ];
}

      '<span class="hs">Talk up a bolt, shave a weight, take a broker\'s cut. Costs no Hand.</span>' +
      '<span class="meter"><i id="haggleMeter" style="width:' + (100*S.haggles/maxHaggles()) + '%"></i></span>' +
      '<span class="hs" id="haggleCount">' + S.haggles + ' of ' + maxHaggles() + ' left this turn</span>' +
    '</button></section>';

  h += '<section class="sec"><h2>Grain &amp; fodder</h2><div class="panel">' +
    '<div class="kv"><span class="k">In the pits</span><span class="v">' + fmt(S.stores) + ' stores</span></div>' +
    '<div class="kv"><span class="k">Eaten each turn</span><span class="v ' + (S.stores<need?"neg":"") + '">' + need + '</span></div>' +
    '<div class="btnrow">' +
      '<button class="btn ghost sm" data-a="stores" data-v="10">Buy 10 · ' + (10*CONFIG.storePrice) + 'd</button>' +
      '<button class="btn ghost sm" data-a="stores" data-v="30">Buy 30 · ' + (30*CONFIG.storePrice) + 'd</button>' +
      '<button class="btn ghost sm" data-a="stores" data-v="' + Math.max(10, need*3) + '">Buy ' + Math.max(10,need*3) + ' · ' + (Math.max(10,need*3)*CONFIG.storePrice) + 'd</button>' +
    '</div></div></section>';

  h += '<section class="sec"><h2>The bazaar</h2>' +
    '<p class="lede">Warehouse ' + held() + ' of ' + capacity() + ' loads' + (room<=0 ? ' &mdash; <span class="neg">full</span>' : '') +
    '. Buy low here, sell high at the far end of a road.</p><div class="rows">';
  GOOD_IDS.forEach(g => {
    const best = bestMarket(g), bp = buyPrice(g), owned = S.goods[g];
    const trend = S.supply[g] > GOODS[g].supply + 0.06 ? '<span class="tag bad">dear</span>' :
                  S.supply[g] < GOODS[g].supply - 0.06 ? '<span class="tag good">cheap</span>' : '';
    const wanted = S.contracts.some(k => k.good === g) ? '<span class="tag gold">on order</span>' : '';
    h += '<button class="row" data-a="good" data-v="' + g + '">' +
      '<span class="glyph">' + GOODS[g].g + '</span>' +
      '<span class="main"><span class="t">' + GOODS[g].short + trend + wanted + '</span>' +
      '<span class="sub">' + (best ? "Best known: " + best.p + "d at " + best.city : "No road opened yet") + '</span></span>' +
      '<span class="end gold">' + bp + 'd<small>' + (owned ? "hold " + owned : "buy") + '</small></span>' +
      '<span class="chev">›</span></button>';
  });
  return h + '</div></section>';
}

/* =====================================================================
   THE CHART — a merchant's map, not a survey. Cities sit roughly where
   they sit on the ground, pulled apart where the labels would collide.
   Every road you own is drawn; every caravan is on it, outbound as a
   filled dot and homeward as a ring.
   ===================================================================== */
const MAP = {
  w:1000, h:400,
  at:{
    tabriz:{x:62,y:150,a:"start"},        hormuz:{x:196,y:352},
    urgench:{x:243,y:52,a:"start"},       merv:{x:250,y:156,a:"end"},
    herat:{x:270,y:230,a:"end"},          bukhara:{x:300,y:96,a:"end"},
    samarkand:{x:356,y:126,dy:34},        balkh:{x:346,y:206,a:"end"},
    multan:{x:424,y:302},                 kashgar:{x:492,y:126,dy:-16},
    khotan:{x:546,y:192},                 turfan:{x:668,y:62,a:"start"},
    dunhuang:{x:752,y:112,dy:30},         changan:{x:938,y:214,a:"end"}
  },
  curve:{bukhara:-0.16, merv:0.10, balkh:-0.22, urgench:-0.14, herat:0.16,
         kashgar:-0.10, khotan:0.12, turfan:-0.13, tabriz:0.13, multan:-0.18,
         hormuz:0.20, dunhuang:0.09, changan:-0.11},
  regions:[
    {label:"THE  STEPPE",     cx:330, cy:34,  rx:180, ry:30},
    {label:"THE  TAKLAMAKAN", cx:612, cy:150, rx:132, ry:46},
    {label:"THE  PAMIRS",     cx:446, cy:172, rx:56,  ry:52},
    {label:"THE  GULF",       cx:178, cy:356, rx:92,  ry:32}
  ]
};
function mapPath(rid){
  const r = route(rid), a = MAP.at.samarkand, b = MAP.at[r.to];
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  const k = MAP.curve[rid] || 0.12;
  const cx = (a.x + b.x)/2 - dy * k, cy = (a.y + b.y)/2 + dx * k;
  return {d:"M" + a.x + " " + a.y + " Q" + cx + " " + cy + " " + b.x + " " + b.y, a, b, cx, cy};
}
const bezAt = (p, t) => ({
  x:(1-t)*(1-t)*p.a.x + 2*(1-t)*t*p.cx + t*t*p.b.x,
  y:(1-t)*(1-t)*p.a.y + 2*(1-t)*t*p.cy + t*t*p.b.y
});
function viewChart(){
  let g = "";
  MAP.regions.forEach(r => {
    g += '<ellipse cx="' + r.cx + '" cy="' + r.cy + '" rx="' + r.rx + '" ry="' + r.ry +
      '" fill="var(--panel-hi)" opacity=".38"/>' +
      '<text x="' + r.cx + '" y="' + (r.cy + 6) + '" text-anchor="middle" font-size="14" letter-spacing="3.5" ' +
      'fill="var(--dim)" opacity=".55" font-family="var(--f-ui)" font-weight="700">' + r.label + '</text>';
  });
  // roads first, so the towns sit on top of them
  ROUTES.forEach(r => {
    const p = mapPath(r.id), open = routeOpen(r.id), blocked = open && routeBlocked(r);
    const stroke = blocked ? "var(--madder)" : open ? "var(--brass)" : "var(--line)";
    g += '<path d="' + p.d + '" fill="none" stroke="' + stroke + '" stroke-width="' + (open ? 2.6 : 1.6) +
      '" stroke-linecap="round" opacity="' + (open ? (blocked ? .8 : .92) : .5) + '"' +
      (open && !blocked ? "" : ' stroke-dasharray="7 7"') + '/>';
  });
  // caravans, out and back along their own road
  S.caravans.forEach(c => {
    const r = route(c.rid), p = mapPath(c.rid);
    const frac = clamp((S.turn - c.out) / r.turns, 0, 1);
    const home = frac > 0.5;
    const pt = bezAt(p, home ? (1 - frac) * 2 : frac * 2);
    g += '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="7.5" fill="' +
      (home ? "var(--ground)" : "var(--brass-hi)") + '" stroke="var(--brass-hi)" stroke-width="2.6"/>' +
      '<text x="' + pt.x.toFixed(1) + '" y="' + (pt.y - 14) + '" text-anchor="middle" font-size="15" ' +
      'paint-order="stroke" stroke="var(--ground-2)" stroke-width="4.5" stroke-linejoin="round" ' +
      'fill="var(--brass-hi)" font-family="var(--f-ui)" font-weight="700">' + esc(c.leaderName.split(" ")[0]) + '</text>';
  });
  // towns
  Object.entries(MAP.at).forEach(([city, m]) => {
    const home = city === "samarkand";
    const r = ROUTES.find(x => x.to === city);
    const open = r && routeOpen(r.id), sick = cityBlocked(city);
    const deals = S.contracts.filter(k => k.city === city).length;
    const fill = home ? "var(--brass)" : sick ? "var(--madder)" : open ? "var(--brass)" : "var(--ground-2)";
    const rad = home ? 9 : open ? 6 : 4.5;
    if(deals) g += '<circle cx="' + m.x + '" cy="' + m.y + '" r="' + (rad + 6) +
      '" fill="none" stroke="var(--tile)" stroke-width="2"/>';
    if(home) g += '<circle cx="' + m.x + '" cy="' + m.y + '" r="16" fill="none" stroke="var(--brass)" stroke-width="1.6" opacity=".55"/>';
    g += '<circle cx="' + m.x + '" cy="' + m.y + '" r="' + rad + '" fill="' + fill +
      '" stroke="var(--ground)" stroke-width="2"/>';
    const anchor = m.a || "middle";
    const lx = anchor === "start" ? m.x + 14 : anchor === "end" ? m.x - 14 : m.x;
    const ly = m.y + (m.dy !== undefined ? m.dy : (anchor === "middle" ? 28 : 6));
    g += '<text x="' + lx + '" y="' + ly + '" text-anchor="' + anchor + '" font-size="19" ' +
      'font-family="var(--f-disp)" paint-order="stroke" stroke="var(--ground-2)" stroke-width="5" ' +
      'stroke-linejoin="round" fill="' + (open || home ? "var(--text)" : "var(--dim)") + '">' +
      CITIES[city].name + '</text>';
    if(r) g += '<circle cx="' + m.x + '" cy="' + m.y + '" r="30" fill="transparent" ' +
      'style="cursor:pointer" data-a="mapcity" data-v="' + r.id + '"><title>' + esc(r.name) + '</title></circle>';
  });
  return '<div class="chart"><div class="chart-scroll" id="chartScroll">' +
    '<svg viewBox="0 0 ' + MAP.w + ' ' + MAP.h + '" width="' + MAP.w*0.72 + '" height="' + MAP.h*0.72 + '" ' +
    'role="img" aria-label="A chart of the roads out of Samarkand">' + g + '</svg></div>' +
    '<div class="chart-key"><span><i class="k-open"></i>yours</span><span><i class="k-shut"></i>not yet</span>' +
    '<span><i class="k-out"></i>outbound</span><span><i class="k-back"></i>homeward</span>' +
    '<span><i class="k-deal"></i>an order waiting</span></div></div>';
}

/* ------------------------------------------------------------- roads - */
function viewRoads(){
  const open = ROUTES.filter(r => routeOpen(r.id)).length;
  let h = viewChart() +
    '<p class="lede">' + (S.caravans.length
      ? S.caravans.length + " caravan" + (S.caravans.length===1?"":"s") + " on the road, " + open + " road" + (open===1?"":"s") + " open to you."
      : open + " road" + (open===1?"":"s") + " open to you. Drag the chart east to see how far the road goes.") + '</p>';

  if(S.caravans.length){
    h += '<section class="sec"><h2>On the road</h2><div class="rows">';
    S.caravans.forEach(c => {
      const r = route(c.rid), left = c.due - S.turn, prog = 1 - left / r.turns;
      h += '<div class="row static"><span class="main">' +
        '<span class="t">' + esc(c.leaderName) + ' &rarr; ' + CITIES[r.to].name + '</span>' +
        '<span class="sub">' + c.loads + ' loads &middot; risk ' + pct(c.risk) + ' &middot; expects ' + fmt(c.expect) + 'd' +
        '<span class="bar"><i style="width:' + Math.round(prog*100) + '%"></i></span></span></span>' +
        '<span class="end">' + left + '<small>turn' + (left===1?"":"s") + '</small></span></div>';
    });
    h += '</div></section>';
  }

  if(S.contracts.length || S.offers.length){
    h += '<section class="sec"><h2>Orders</h2><div class="rows">';
    S.contracts.forEach(k => {
      const left = k.due - S.turn, ready = S.goods[k.good] >= k.qty;
      h += '<div class="row static deal ' + (left <= 1 ? "late" : ready ? "ready" : "") + '">' +
        '<span class="glyph">' + GOODS[k.good].g + '</span><span class="main">' +
        '<span class="t">' + k.qty + ' ' + GOODS[k.good].short.toLowerCase() + ' &rarr; ' + CITIES[k.city].name +
        (ready ? '<span class="tag good">in the godown</span>' : '') + '</span>' +
        '<span class="sub">' + esc(k.patron) + ' &middot; ' + k.pay + 'd the load</span></span>' +
        '<span class="end ' + (left<=1?"neg":"") + '">' + Math.max(0,left) + '<small>turns left</small></span></div>';
    });
    S.offers.forEach(o => {
      h += '<button class="row" data-a="offer" data-v="' + o.id + '">' +
        '<span class="glyph">' + GOODS[o.good].g + '</span><span class="main">' +
        '<span class="t">' + o.qty + ' ' + GOODS[o.good].short.toLowerCase() + ' &rarr; ' + CITIES[o.city].name +
        (o.house ? '<span class="tag gold">family</span>' : '<span class="tag">offered</span>') + '</span>' +
        '<span class="sub">' + esc(o.patron) + ' &middot; ' + o.span + ' turns</span></span>' +
        '<span class="end gold">' + o.pay + 'd<small>the load</small></span><span class="chev">›</span></button>';
    });
    h += '</div></section>';
  }

  h += '<section class="sec"><h2>Your roads</h2><div class="rows">';
  ROUTES.filter(r => routeOpen(r.id)).forEach(r => {
    const blocked = routeBlocked(r), fb = firstRunBonus(r.id);
    h += '<button class="row" data-a="plan" data-v="' + r.id + '"' + (blocked ? " disabled" : "") + '>' +
      '<span class="glyph">' + CITIES[r.to].name.slice(0,2) + '</span>' +
      '<span class="main"><span class="t">' + r.name +
        (fb > 0.05 ? '<span class="tag gold">+' + Math.round(fb*100) + '% new road</span>' : '') +
        (blocked ? '<span class="tag bad">' + blocked + '</span>' : '') + '</span>' +
      '<span class="sub">' + r.turns + ' turn' + (r.turns>1?"s":"") + ' &middot; ' + r.terrain +
        ' &middot; risk ' + pct(routeRisk(r.id)) + ' &middot; market ' + satWord(r.id) + '</span></span>' +
      '<span class="chev">›</span></button>';
  });
  h += '</div></section>';

  const closed = ROUTES.filter(r => !routeOpen(r.id));
  if(closed.length){
    h += '<section class="sec"><h2>Roads not yet yours</h2><div class="rows">';
    closed.forEach(r => {
      const repOk = S.repute >= (r.rep||0);
      h += '<button class="row" data-a="route" data-v="' + r.id + '"' + (repOk ? "" : " disabled") + '>' +
        '<span class="glyph">' + CITIES[r.to].name.slice(0,2) + '</span>' +
        '<span class="main"><span class="t">' + r.name + (r.needs ? '<span class="tag">needs a ' + (r.needs==="guide"?"guide":"captain") + '</span>' : '') + '</span>' +
        '<span class="sub">' + (repOk ? "Scout it for " + fmt(routeCost(r.id)) + "d" : "Repute " + r.rep + " required") + '</span></span>' +
        '<span class="end">' + r.turns + '<small>turns</small></span><span class="chev">›</span></button>';
    });
    h += '</div></section>';
  }
  return h;
}

/* ------------------------------------------------------ the planner -- */
function viewPlan(){
  const p = S.plan, r = route(p.rid), cap = planCap(), loads = planLoads();
  const val = planValue(), risk = planRisk(), eCost = escortCost(p.escort, r.turns);
  const invested = GOOD_IDS.reduce((n,g)=>n + p.cargo[g]*buyPrice(g), 0);
  const deals = contractsFor(r.to);

  let h = '<section class="sec"><h2>' + r.name + '</h2>' +
    '<p class="lede">' + r.note + ' Round trip ' + r.turns + ' turn' + (r.turns>1?"s":"") + ' to ' + CITIES[r.to].name +
    ' over ' + r.terrain + '.</p>';

  if(deals.length){
    h += '<div class="panel mb"><div class="kv"><span class="k"><b>Orders waiting at ' + CITIES[r.to].name + '</b></span></div>';
    deals.forEach(k => h += '<div class="kv"><span class="k">' + k.qty + ' ' + GOODS[k.good].short.toLowerCase() +
      ' for ' + esc(k.patron) + '</span><span class="v ' + (p.cargo[k.good] >= k.qty ? "pos" : "neg") + '">' +
      (p.cargo[k.good] >= k.qty ? "loaded" : p.cargo[k.good] + "/" + k.qty) + '</span></div>');
    h += '</div>';
  }

  h += '<div class="panel mb"><div class="kv"><span class="k">Who leads it</span></div><div class="pillrow mt">';
  leaders().forEach(l => {
    h += '<button class="pill" data-a="leader" data-v="' + l.id + '" aria-pressed="' + (p.leader===l.id) + '">' +
      esc(l.name) + ' <span class="num">·' + (l.skill || 3) + '</span>' + (l.type ? " ·" + STAFF[l.type].name.split(" ")[0].toLowerCase() : "") + '</button>';
  });
  if(!leaders().length) h += '<span class="hint">Nobody free. Free a Hand, or hire a caravan master.</span>';
  h += '</div><p class="hint">A leader is away for the whole trip. Higher skill, lower risk.</p></div>';

  h += '<div class="panel mb"><div class="kv"><span class="k">Beasts on this road</span><span class="v">' + cap + ' loads</span></div>';
  const groups = planGroups();
  if(!groups.length) h += '<p class="hint">Nothing you own can travel ' + r.terrain + ' country.</p>';
  groups.forEach(g => {
    h += '<div class="kv"><span class="k">' + g.def.name + ' <span class="num">(' + g.free + ' free · ' + g.def.cap + ' loads)</span></span>' +
      '<span class="v"><span class="step" style="width:150px">' +
      '<button data-a="unit-" data-v="' + keyOf(g.line,g.tier) + '">&minus;</button>' +
      '<span class="q">' + g.taken + '</span>' +
      '<button data-a="unit+" data-v="' + keyOf(g.line,g.tier) + '">+</button></span></span></div>';
  });
  h += '</div>';

  h += '<div class="panel mb"><div class="kv"><span class="k">Cargo</span><span class="v ' + (loads>cap?"neg":"") + '">' + loads + ' / ' + cap + ' loads</span></div>';
  const any = GOOD_IDS.some(g => S.goods[g] > 0 || p.cargo[g] > 0);
  if(!any) h += '<p class="hint">Your warehouse is empty. Buy goods in the bazaar first.</p>';
  GOOD_IDS.forEach(g => {
    if(!S.goods[g] && !p.cargo[g]) return;
    const sell = Math.round(saleAt(r.id, g)), margin = sell - buyPrice(g);
    h += '<div class="kv"><span class="k">' + GOODS[g].short +
      ' <span class="num ' + (margin>0?"pos":"neg") + '">' + sell + 'd (' + sgn(margin) + ')</span></span>' +
      '<span class="v"><span class="step" style="width:150px">' +
      '<button data-a="cargo-" data-v="' + g + '">&minus;</button>' +
      '<span class="q">' + p.cargo[g] + '<small>of ' + (S.goods[g]+p.cargo[g]) + '</small></span>' +
      '<button data-a="cargo+" data-v="' + g + '">+</button></span></span></div>';
  });
  if(any) h += '<div class="btnrow"><button class="btn ghost sm" data-a="fill">Load best cargo</button>' +
    '<button class="btn ghost sm" data-a="clearcargo">Clear</button></div>';
  h += '</div>';

  h += '<div class="panel mb"><div class="kv"><span class="k">Escort</span><span class="v">' + (eCost?fmt(eCost)+"d":"free") + '</span></div><div class="pillrow mt">' +
    ESCORTS.map((e,i)=>'<button class="pill" data-a="escort" data-v="' + i + '" aria-pressed="' + (p.escort===i) + '">' +
      e.name + (e.cut?' &minus;' + Math.round(e.cut*100) + '%':'') + '</button>').join("") + '</div>' +
    '<div class="kv mt"><span class="k">Bring a return cargo</span><span class="v">' +
      '<button class="pill" data-a="bring" aria-pressed="' + p.bring + '">' +
      (p.bring ? "Yes — " + GOODS[CITIES[r.to].source ? CITIES[r.to].source.good : "silk"].short.toLowerCase() + " from " + CITIES[r.to].name : "No, coin only") +
      '</button></span></div></div>';

  h += '<div class="panel mb">' +
    '<div class="kv"><span class="k">Cargo at cost</span><span class="v">' + fmt(invested) + 'd</span></div>' +
    '<div class="kv"><span class="k">Expected at ' + CITIES[r.to].name + '</span><span class="v gold">' + fmt(val) + 'd</span></div>' +
    '<div class="kv"><span class="k">Distance premium</span><span class="v pos">+' + Math.round((distancePremium(r)-1)*100) + '%</span></div>' +
    '<div class="kv"><span class="k">That market is</span><span class="v ' + (satOf(r.id)>0.2?"neg":"") + '">' + satWord(r.id) +
      (satOf(r.id)>0.02 ? " (-" + Math.round(satOf(r.id)*100) + "%)" : "") + '</span></div>' +
    '<div class="kv"><span class="k">Expected profit</span><span class="v ' + (val-invested-eCost>=0?"pos":"neg") + '">' + sgn(val-invested-eCost) + 'd</span></div>' +
    '<div class="kv"><span class="k">Chance of trouble</span><span class="v neg">' + pct(risk) + '</span></div>' +
    '<div class="bar risk"><i style="width:' + Math.round(risk*100) + '%"></i></div></div>';

  h += '<div class="btnrow"><button class="btn ghost" data-a="cancel">Back</button>' +
       '<button class="btn" data-a="dispatch">Send it out</button></div>';
  return h + '</section>';
}

/* ------------------------------------------------------------ estate - */
function viewEstate(){
  const built = Object.keys(PROPS).filter(id => S.props[id] > 0);
  const kept = built.filter(id => staffAt(id)).length;
  let h = banner("gate", "Your holdings",
    built.length ? built.length + " built, " + kept + " kept" : "A ruin on the Zarafshan road") +
    '<section class="sec"><h2>Property</h2><div class="rows">';
  Object.entries(PROPS).forEach(([id,def]) => {
    const tier = S.props[id], t = def.tiers[tier], next = def.tiers[tier+1];
    const locked = (def.rep && S.repute < def.rep) || (def.needsRoute && !routeOpen(def.needsRoute));
    const unstaffed = tier > 0 && !staffAt(id);
    const stopped = issueEff().props.indexOf(id) >= 0;
    h += '<button class="row" data-a="prop" data-v="' + id + '">' +
      '<span class="glyph">' + def.g + '</span>' +
      '<span class="main"><span class="t">' + def.name.replace(/,.*$/,"") +
        (unstaffed ? '<span class="tag bad">unstaffed</span>' : '') +
        (stopped ? '<span class="tag bad">stopped</span>' : '') +
        (locked && tier===0 ? '<span class="tag">' + (def.rep ? "repute " + def.rep : "needs the road") + '</span>' : '') + '</span>' +
      '<span class="sub">' + t.name + (next ? ' &middot; next ' + fmt(propCost(id, tier+1)) + 'd' : ' &middot; complete') + '</span></span>' +
      '<span class="end ' + (propIncome(id)?"pos":"") + '">' + (propIncome(id) ? "+" + propIncome(id) : "0") + '<small>per turn</small></span>' +
      '<span class="chev">›</span></button>';
  });
  h += '</div></section>';

  h += '<section class="sec"><h2>The yard</h2>' +
    '<p class="lede">Beasts and vehicles are worked up one step at a time. A kind you have owned once can be bought ready-made after that &mdash; for rather more than the work would have cost.</p>' +
    '<div class="rows">';
  FLEET_LINES.forEach(line => {
    const d = FLEET[line], owned = S.fleet.filter(u => u.line === line);
    if(!owned.length && unlockedTier(line) === 0 && line === "boat" && !routeOpen("hormuz")) return;
    const cap = owned.reduce((n,u)=>n + unitDef(u).cap, 0);
    const parts = d.tiers.map((t,i) => { const n = unitsOn(line,i).length; return n ? n + "x " + t.name.toLowerCase() : null; }).filter(Boolean);
    h += '<button class="row" data-a="line" data-v="' + line + '">' +
      '<span class="glyph">' + d.g + '</span>' +
      '<span class="main"><span class="t">' + d.name + '<span class="tag">' + d.terrain.join(", ") + '</span></span>' +

  h += '<section class="sec"><h2>People on wages</h2><div class="rows">';

    const d = STAFF[s.type];
    h += '<button class="row" data-a="staff" data-v="' + s.id + '">' +
      '<span class="glyph">' + esc(s.name.slice(0,2)) + '</span>' +
      '<span class="main"><span class="t">' + esc(s.name) +

}

function viewHouse(){
  const out = S.house.filter(travelling).length;
  let h = banner("tent", esc(S.houseName),
    out ? out + " of the house on the road" : "All of the house at home");

  if(S.issues.length){
    h += '<section class="sec"><h2>Matters outstanding</h2><div class="rows">';
    S.issues.forEach((it,i) => {
      const d = ISSUES[it.id];
      h += '<button class="row issue" data-a="issue" data-v="' + i + '">' +
        '<span class="glyph">' + d.g + '</span>' +
        '<span class="main"><span class="t">' + esc(issueTitle(it)) + '</span>' +
        '<span class="sub">' + esc(d.bite) + (it.until ? " Passes in " + Math.max(0,it.until - S.turn) + " turns." : "") + '</span></span>' +
        '<span class="chev">›</span></button>';
    });
    h += '</div></section>';
  }

  h += '<section class="sec"><h2>Your household</h2><div class="rows">';
  S.house.forEach(m => {
    const away = travelling(m), spent = !away && m.busy > S.turn, trip = tripOf(m);
    h += '<button class="row" data-a="member" data-v="' + m.id + '">' +
      (m.portrait ? face(m.portrait) : '<span class="glyph">' + esc(m.name.slice(0,2)) + '</span>') +
      '<span class="main"><span class="t">' + esc(m.name) + (m.you ? '<span class="tag gold">you</span>' : '') +
        (m.partner ? '<span class="tag gold">partner</span>' : '') +
        (away ? '<span class="tag cool">on the road</span>' : '') +
        (spent ? '<span class="tag">hand spent</span>' : '') + '</span>' +
      '<span class="sub">' + m.age + ' years &middot; ' +
        (trip ? "Leading the " + trip.name.toLowerCase().replace(/^the /,"") + " to " + CITIES[trip.to].name
              : ROLES[m.role].name + (m.at ? " of the " + PROPS[m.at].name.toLowerCase().replace(/,.*$/,"") : "")) +
        (m.fromHouse ? " &middot; of " + esc(houseById(m.fromHouse).house.replace("The House of ","")) : "") + '</span></span>' +
      '<span class="end">' + "★".repeat(m.skill) + '<small>skill</small></span><span class="chev">›</span></button>';
  });
  h += '</div><p class="hint">Anyone at your side gives you a Hand each turn. A standing role gives none, and earns more than a Hand is worth. Staff are not Hands &mdash; but a few of them, in time, can be brought into the household.</p></section>';

  const open = HOUSES.filter(canMarry), able = marriageable();
  if(able.length && open.length){
    h += '<section class="sec"><h2>Matches</h2>' +
      '<p class="lede">' + able.length + ' of your household could be married, and ' + open.length +
      ' house' + (open.length===1?"":"s") + ' would consider it. A marriage brings a dowry, a road or a trade, and a pair of Hands.</p><div class="rows">';
    open.slice(0, 6).forEach(hh => {
      h += '<button class="row" data-a="house" data-v="' + hh.id + '">' +
        '<span class="glyph">' + esc(hh.house.replace("The House of ","").slice(0,2)) + '</span>' +
        '<span class="main"><span class="t">' + esc(hh.house.replace("The House of ","")) +
        '<span class="tag cool">' + esc(hh.culture) + '</span></span>' +
        '<span class="sub">' + esc(hh.seat) + ' &middot; ' + esc(hh.trade) + '</span></span>' +
        '<span class="end gold">' + fmt(hh.price) + 'd<small>bride-price</small></span><span class="chev">›</span></button>';
    });
    if(open.length > 6) h += '<div class="row static"><span class="main"><span class="sub">And ' + (open.length-6) + ' more as your name grows.</span></span></div>';
    h += '</div></section>';
  }

  h += '<section class="sec"><h2>The city</h2><div class="rows">';
  SOCIAL.forEach(a => {
    const c = a.cost(), no = c > S.ducats || hands() < 1 || (a.when && !a.when());
    h += '<button class="row" data-a="social" data-v="' + a.id + '"' + (no ? " disabled" : "") + '>' +
      '<span class="main"><span class="t">' + a.name + '</span><span class="sub">' + a.desc + '</span></span>' +
      '<span class="end gold">' + fmt(c) + 'd<small>and a Hand</small></span></button>';
  });
  h += '</div></section>';

  h += '<section class="sec"><h2>The journal</h2>';
  if(!S.journal.length) h += '<p class="lede">Nothing has happened yet.</p>';
  S.journal.slice(0,30).forEach(j => {
    h += '<div class="entry ' + (j.kind||"") + '"><div class="when">' + dateStr(j.turn) + '</div>' +
      '<div class="txt">' + j.text + '</div>' +
      (j.deltas && j.deltas.length ? '<div class="delta">' + j.deltas.map(d=>'<span>' + esc(d) + '</span>').join("") + '</div>' : "") +
      '</div>';
  });
  return h + '</section>';
}

/* =====================================================================
   SHEETS, TOASTS, INPUT
   ===================================================================== */
let sheetRender = null, sheetQty = 1, pendingChoices = null;
const host = $("#sheetHost");
const sheetOpen = () => !!sheetRender;
function openSheet(fn, q){ sheetRender = fn; if(q !== undefined) sheetQty = q; paintSheet(); }
function closeSheet(){
  sheetRender = null; pendingChoices = null; host.innerHTML = "";
  const tz = $("#toasts"); if(tz) tz.classList.remove("up");
}
function paintSheet(){
  const tz = $("#toasts"); if(tz) tz.classList.toggle("up", !!sheetRender);
  if(!sheetRender){ host.innerHTML = ""; return; }
  host.innerHTML = '<div class="scrim" data-a="scrim"><div class="sheet"><div class="grab"></div>' + sheetRender() + '</div></div>';
}
function refreshSheet(){ if(sheetRender) paintSheet(); if(S) renderChips(); }

function ask(title, sub, choices){
  pendingChoices = choices;
  openSheet(() => '<h3>' + esc(title) + '</h3><p class="sub">' + esc(sub) + '</p>' +
    choices.map((c,i) => '<button class="choice" data-a="choice" data-v="' + i + '">' +
      '<span class="ct">' + esc(c.t) + '</span>' + (c.s ? '<span class="cs">' + esc(c.s) + '</span>' : "") + '</button>').join(""));
  return null;
}
function toast(kind, text){
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = text;
  $("#toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0";
    setTimeout(() => el.remove(), 320); }, 2200);
}
function flyCoin(ev, btn, text){
  if(!btn) return;
  const r = btn.getBoundingClientRect();
  const el = document.createElement("span");
  el.className = "coin"; el.textContent = text;
  const x = ev && ev.clientX ? ev.clientX - r.left : r.width/2;
  el.style.left = clamp(x, 20, r.width-30) + "px";
  el.style.top = (ev && ev.clientY ? ev.clientY - r.top : r.height/2) + "px";
  btn.appendChild(el);
  setTimeout(() => el.remove(), 800);
}

/* ------------------------------------------------------- the sheets -- */
function sheetGood(g){
  const d = GOODS[g], bp = buyPrice(g), sp = localSell(g), room = capacity()-held();
  const maxBuy = Math.max(0, Math.min(room, Math.floor(S.ducats / bp)));
  const q = clamp(sheetQty, 1, Math.max(1, Math.max(maxBuy, S.goods[g])));
  let rows = "";
  ROUTES.filter(r => routeOpen(r.id)).forEach(r => {
    const p = Math.round(saleAt(r.id, g));
    rows += '<div class="kv"><span class="k">' + CITIES[r.to].name + ' <span class="num">(' + r.turns + 't)</span></span>' +
      '<span class="v ' + (p>bp?"pos":"neg") + '">' + p + 'd</span></div>';
  });
  const orders = S.contracts.filter(k => k.good === g);
  return '<h3>' + d.name + '</h3><p class="sub">You hold ' + S.goods[g] + '. Room for ' + room + ' more loads.</p>' +
    (orders.length ? '<div class="panel mb">' + orders.map(k => '<div class="kv"><span class="k">On order: ' + k.qty +
      ' to ' + CITIES[k.city].name + '</span><span class="v gold">' + k.pay + 'd</span></div>').join("") + '</div>' : '') +
    '<div class="step mb"><button data-a="q-">&minus;</button><span class="q">' + q +
      '<small>' + fmt(q*bp) + 'd to buy · ' + fmt(q*sp) + 'd to sell here</small></span>' +
      '<button data-a="q+">+</button></div>' +
    '<div class="pillrow mb"><button class="pill" data-a="qset" data-v="1">1</button>' +
      '<button class="pill" data-a="qset" data-v="5">5</button>' +
      '<button class="pill" data-a="qset" data-v="10">10</button>' +
      '<button class="pill" data-a="qset" data-v="' + maxBuy + '">Max buy (' + maxBuy + ')</button>' +
      (S.goods[g] ? '<button class="pill" data-a="qset" data-v="' + S.goods[g] + '">All held (' + S.goods[g] + ')</button>' : '') + '</div>' +
    '<div class="btnrow"><button class="btn" data-a="buy" data-v="' + g + '"' + (maxBuy<1?" disabled":"") + '>Buy ' + q + ' · ' + fmt(q*bp) + 'd</button>' +
      '<button class="btn ghost" data-a="sell" data-v="' + g + '"' + (!S.goods[g]?" disabled":"") + '>Sell ' + Math.min(q,S.goods[g]) + ' here</button></div>' +
    '<div class="panel mt"><div class="kv"><span class="k"><b>What they pay elsewhere</b></span></div>' +
      (rows || '<p class="hint">No roads opened yet. Everything must be sold at home.</p>') + '</div>' +
    '<button class="btn ghost mt" data-a="close">Close</button>';
}

function sheetProp(id){
  const def = PROPS[id], tier = S.props[id], t = def.tiers[tier], next = def.tiers[tier+1];
  const s = staffAt(id);
  const lockRep = def.rep && S.repute < def.rep;
  const lockRoute = def.needsRoute && !routeOpen(def.needsRoute);
  const spare = S.staff.filter(x => x.type === def.staff && x.at !== id);
  let h = '<h3>' + def.name + '</h3><p class="sub">' + t.name + ' &mdash; ' + (t.note || "Not yet built.") + '</p>' +
    '<div class="panel mb">' +
    '<div class="kv"><span class="k">Income each turn</span><span class="v ' + (propIncome(id)?"pos":"") + '">' + (propIncome(id)?"+"+propIncome(id):"none") + '</span></div>' +
    (t.cap ? '<div class="kv"><span class="k">Warehouse space</span><span class="v">+' + t.cap + ' loads</span></div>' : '') +
    (t.buy ? '<div class="kv"><span class="k">Bazaar discount</span><span class="v">-' + Math.round(t.buy*100) + '%</span></div>' : '') +
    (t.sell ? '<div class="kv"><span class="k">Sale prices</span><span class="v">+' + Math.round(t.sell*100) + '%</span></div>' : '') +
    (t.silk ? '<div class="kv"><span class="k">Silk finished here sells for</span><span class="v">+' + Math.round(t.silk*100) + '%</span></div>' : '') +
    (t.risk ? '<div class="kv"><span class="k">Risk on every caravan</span><span class="v pos">-' + Math.round(t.risk*250) + '%</span></div>' : '') +
    (t.stores ? '<div class="kv"><span class="k">Stores made each turn</span><span class="v pos">+' + t.stores + '</span></div>' : '') +
    '<div class="kv"><span class="k">Kept by</span><span class="v">' + (s ? esc(s.name) : (tier>0 ? '<span class="neg">nobody — it earns nothing</span>' : "&mdash;")) + '</span></div>' +
    '</div>';
  if(tier > 0 && !s){
    h += '<button class="btn mb" data-a="hirepick" data-v="' + def.staff + '">Hire a ' + STAFF[def.staff].name.toLowerCase() + ' · ' + STAFF[def.staff].hire + 'd</button>';
    spare.forEach(x => h += '<button class="btn ghost mb" data-a="assign" data-v="' + x.id + '|' + id + '">Post ' + esc(x.name) + ' here</button>');
  }
  if(next){
    const cost = propCost(id, tier+1);
    const blocked = lockRep ? "Repute " + def.rep + " required" : lockRoute ? "You have no road to " + CITIES[def.city].name : null;
    h += '<div class="panel mb"><div class="kv"><span class="k"><b>' + next.name + '</b></span><span class="v gold">' + fmt(cost) + 'd</span></div>' +
      '<p class="hint">' + (next.note || "") + ' Costs one Hand.</p></div>' +
      '<button class="btn" data-a="upgrade" data-v="' + id + '"' + (blocked || cost>S.ducats || hands()<1 ? " disabled" : "") + '>' +
      (blocked || (cost>S.ducats ? "Not enough ducats" : hands()<1 ? "No Hands left this turn" : "Build it · " + fmt(cost) + "d")) + '</button>';
  }else h += '<p class="hint">This property is finished. Nothing more can be built here.</p>';
  return h + '<button class="btn ghost mt" data-a="close">Close</button>';
}

function sheetLine(line){
  const d = FLEET[line];
  let h = '<h3>' + d.name + '</h3><p class="sub">Travels ' + d.terrain.join(", ") + ' country. ' +
    'Work one up a step at a time, or buy a kind you have already owned.</p>';
  d.tiers.forEach((t, i) => {
    const own = unitsOn(line, i).length, free = freeOn(line, i).length;
    const unlocked = i <= unlockedTier(line);
    const prev = i > 0 ? freeOn(line, i-1).length : 0;
    h += '<div class="panel mb"><div class="kv"><span class="k"><b>' + t.name + '</b>' +
      (own ? ' <span class="tag">' + own + ' owned</span>' : '') + '</span>' +
      '<span class="v">' + t.cap + ' loads</span></div>' +
      '<p class="hint" style="margin-top:4px">' + t.note + ' Upkeep ' + t.upkeep + 'd each.</p>';
    if(i > 0){
      const upc = upPrice(line, i);
      h += '<button class="btn ghost sm mt" style="width:100%" data-a="upone" data-v="' + keyOf(line,i-1) + '"' +
        (prev < 1 || upc > S.ducats ? " disabled" : "") + '>' +
        (prev < 1 ? "Nothing to work up" : "Work one " + d.tiers[i-1].name.toLowerCase() + " up · " + fmt(upc) + "d") + '</button>';
    }
    h += '<button class="btn sm mt" style="width:100%" data-a="buyunit" data-v="' + keyOf(line,i) + '"' +

  });
  return h + '<button class="btn ghost mt" data-a="close">Close</button>';
}

function sheetHire(){
  return '<h3>Hire</h3><p class="sub">A signing fee now, wages every turn after. Staff are not Hands &mdash; they do one job, and in time a few may be brought into the household. Costs one Hand.</p><div class="rows">' +
    Object.entries(STAFF).map(([k,d]) => {
      const need = Object.keys(PROPS).find(p => PROPS[p].staff === k && S.props[p] > 0 && !staffAt(p));

      '<span class="glyph">' + d.name.slice(0,2) + '</span>' +
      '<span class="main"><span class="t">' + d.name + (need ? '<span class="tag good">wanted</span>' : '') + '</span>' +
      '<span class="sub">' + (d.effect || d.desc) + '</span></span>' +
      '<span class="end gold">' + d.hire + '<small>then ' + d.wage + '/turn</small></span></button>';
    }).join("") + '</div>' +
    (hands() < 1 ? '<p class="hint">No Hands left this turn.</p>' : '') +
    '<button class="btn ghost mt" data-a="close">Close</button>';
}
function sheetStaff(sid){
  const s = S.staff.find(x => x.id === sid); if(!s) return "";
  const d = STAFF[s.type];
  const posts = Object.keys(PROPS).filter(p => PROPS[p].staff === s.type && S.props[p] > 0);

function beginGame(){
  const nameEl = document.getElementById("pname");
  if(nameEl && nameEl.value.trim()) build.name = nameEl.value.trim();
  const sex = PORTRAIT_SEX[build.portrait] || "m";
  if(!build.name) build.name = pick(sex === "f" ? NAMES_F : NAMES_M);
  const pool = SON_NAMES.slice();
  const a = pool.splice(irnd(0,pool.length-1),1)[0], b = pool[irnd(0,pool.length-1)];
  newGame(build.name, build.portrait, build.age, sex, a, b);
  build.origins.forEach(id => { S.origins.push(id); originById(id).apply(); });
  build.flaws.forEach(id => { S.origins.push(id); flawById(id).apply(); });
  const kit = build.origins.map(id => originById(id).name).concat(build.flaws.map(id => flawById(id).name));
  if(kit.length){
    post("", "<em>What you brought with you.</em> " +
      kit.map(x => x.replace(/^A /,"a ").replace(/^An /,"an ")).join(", ") + ".");
  }
  build = null;
  closeSheet(); after();
}

/* --------------------------------------------------------- the wiring - */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]"); if(!t) return;
  const a = t.dataset.a, v = t.dataset.v;
  if(a === "scrim" && e.target === t){ if(!build) closeSheet(); return; }
  if(a === "scrim") return;
  if(t.disabled) return;
  // keep whatever has been typed into the name field across a repaint
  const nm = document.getElementById("pname");
  if(nm && build) build.name = nm.value;

  switch(a){
    case "go": go(v); break;
    case "cancel": cancelPlan(); after(); window.scrollTo(0,0); break;
    case "close": closeSheet(); render(); break;
    case "haggle": haggle(e, t); break;
    case "stores": buyStores(+v); break;

    case "good": openSheet(() => sheetGood(v), 1); break;
    case "q+": sheetQty = Math.min(999, sheetQty+1); refreshSheet(); break;
    case "q-": sheetQty = Math.max(1, sheetQty-1); refreshSheet(); break;
    case "qset": sheetQty = Math.max(1, +v); refreshSheet(); break;
    case "buy": buyGoods(v, sheetQty); refreshSheet(); break;
    case "sell": sellGoods(v, sheetQty); refreshSheet(); break;

    case "prop": openSheet(() => sheetProp(v)); break;
    case "upgrade": upgradeProp(v); break;
    case "line": openSheet(() => sheetLine(v)); break;
    case "buyunit": { const [l,ti] = v.split(":"); buyUnit(l, +ti, 1); break; }
    case "upone":   { const [l,ti] = v.split(":"); upgradeUnit(l, +ti); break; }
    case "hire": case "hirepick": openSheet(() => sheetHire()); break;
    case "hirebuy": hireStaff(v); break;
    case "staff": openSheet(() => sheetStaff(v)); break;
    case "dismiss": dismissStaff(v); break;
    case "promote": promoteStaff(v); break;
    case "assign": { const [sid,pid] = v.split("|"); assignStaff(sid,pid); break; }
    case "member": openSheet(() => sheetMember(v)); break;
    case "role": { const p = v.split("|"); setRole(p[0], p[1], p[2]); break; }
    case "social": doSocial(v); break;
    case "house": openSheet(() => sheetHouse(v)); break;
    case "wed": { const [hid,mid] = v.split("|"); marry(hid, mid); break; }
    case "issue": openSheet(() => sheetIssue(+v)); break;
    case "fix": { const [ix,fx] = v.split("|"); resolveIssue(+ix, +fx); break; }
    case "offer": openSheet(() => sheetOffer(v)); break;
    case "take": acceptOffer(v); break;
    case "drop": declineOffer(v); break;

    case "route": openSheet(() => sheetRoute(v)); break;
    case "mapcity":
      if(routeOpen(v)){
        if(routeBlocked(route(v))) { toast("bad", routeBlocked(route(v)) + "."); break; }
        planInit(v); after(); window.scrollTo(0,0);
      } else openSheet(() => sheetRoute(v));
      break;
    case "scout": openRoute(v); break;
    case "plan": planInit(v); after(); window.scrollTo(0,0); break;
    case "leader": S.plan.leader = v; after(); break;
    case "escort": S.plan.escort = +v; after(); break;
    case "bring": S.plan.bring = !S.plan.bring; after(); break;
    case "unit+": {
      const [l,ti] = v.split(":");
      if(freeOn(l,+ti).length > (S.plan.units[v] || 0)) S.plan.units[v] = (S.plan.units[v] || 0) + 1;
      after(); break; }
    case "unit-": {
      if(S.plan.units[v] > 0){
        S.plan.units[v]--;
        while(planLoads() > planCap()){ const g = GOOD_IDS.find(x => S.plan.cargo[x] > 0); if(!g) break; S.plan.cargo[g]--; S.goods[g]++; }
      }
      after(); break; }
    case "cargo+": if(S.goods[v] > 0 && planLoads() < planCap()){ S.goods[v]--; S.plan.cargo[v]++; } after(); break;
    case "cargo-": if(S.plan.cargo[v] > 0){ S.plan.cargo[v]--; S.goods[v]++; } after(); break;
    case "clearcargo": GOOD_IDS.forEach(g => { S.goods[g] += S.plan.cargo[g]; S.plan.cargo[g] = 0; }); after(); break;
    case "fill": autoFill(); after(); break;
    case "dispatch": dispatch(); break;

    case "choice": { const c = pendingChoices && pendingChoices[+v]; closeSheet(); if(c && c.do) c.do(); after(); break; }
    case "continue": S.over = null; S.flags.won = true; go("bazaar"); break;
    case "restart":
      ask("Abandon the house?","Everything is lost and a new house begins in the spring of 1247.",[
        {t:"Begin again", s:"", do(){ wipe(); closeSheet(); startCreate(); }},
        {t:"No", s:"", do(){}}
      ]);
      break;

    /* character creation */
    case "pface":
      build.portrait = v;
      if(!build.name) build.name = pick(PORTRAIT_SEX[v] === "f" ? NAMES_F : NAMES_M);
      refreshSheet(); break;
    case "age+": if(build.age < MAX_AGE){ build.age++; } refreshSheet(); break;
    case "age-": if(build.age > MIN_AGE && pointsFor(build.age-1) + buildGain() >= buildSpent()){ build.age--; } refreshSheet(); break;
    case "trait": {
      const i = build.origins.indexOf(v);
      if(i >= 0) build.origins.splice(i,1);
      else if(originById(v).cost <= buildLeft()) build.origins.push(v);
      refreshSheet(); break; }
    case "flaw": {
      const i = build.flaws.indexOf(v);
      if(i >= 0){ if(buildLeft() - flawById(v).gain >= 0) build.flaws.splice(i,1); }
      else if(build.flaws.length < MAX_FLAWS) build.flaws.push(v);
      refreshSheet(); break; }
    case "begin": beginGame(); break;
  }
});
$("#endturn").addEventListener("click", () => {
  if(!S) return;
  if(hands() > 0 && !S.over && !S.flags.noHandWarn){
    ask("Hands unspent","You still have " + hands() + " Hand" + (hands()===1?"":"s") + " this turn. A Hand not spent is gone.",[
      {t:"End the turn anyway", s:"", do(){ endTurn(); }},
      {t:"Wait — I'll use them", s:"", do(){}},
      {t:"End it, and stop asking", s:"You know how Hands work now.", do(){ S.flags.noHandWarn = true; endTurn(); }}
    ]);
    return;
  }
  endTurn();
});
