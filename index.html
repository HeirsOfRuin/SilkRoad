<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0F1621">
<meta name="description" content="Silk Road: a turn-based merchant game. Build a trading house from a ruined caravanserai outside Samarkand, 1247.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<title>The Samarkand Ledger</title>
<style>
:root{
  --ground:#0F1621; --ground-2:#0B1019; --panel:#182234; --panel-hi:#202D45;
  --line:#2B3A56; --line-soft:#212C42; --text:#EDE4D2; --muted:#93A1BC; --dim:#6D7B96;
  --brass:#D9A441; --brass-hi:#F0C265; --brass-dim:#7C6027;
  --tile:#35A79C; --lapis:#6B87DE; --madder:#C4544A; --silk:#E4CFAE;
  --shadow:0 10px 30px rgba(0,0,0,.45); --r:10px;
  --f-disp:"Amiri","Iowan Old Style",Georgia,serif;
  --f-ui:"Alegreya Sans","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--f-ui);font-size:16px;
  line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
h1,h2,h3{margin:0;font-family:var(--f-disp);font-weight:700;text-wrap:balance;letter-spacing:.01em}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.frame{max-width:620px;margin:0 auto;min-height:100dvh;position:relative;padding-bottom:64px;
  background:linear-gradient(180deg,#111A28 0%,var(--ground) 240px);
  border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
@media (max-width:640px){.frame{border:0}}

#hud{position:sticky;top:0;z-index:40;background:rgba(11,16,25,.93);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hud-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 14px 5px}
.house{font-family:var(--f-disp);font-size:19px;line-height:1.1;color:var(--silk)}
.house small{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--dim);margin-top:2px}
.date{text-align:right;font-size:12px;color:var(--muted);letter-spacing:.05em;flex:none}
.date b{display:block;font-family:var(--f-num);font-size:15px;color:var(--text);font-weight:500}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-top:1px solid var(--line)}
.chip{background:var(--ground-2);padding:6px 4px 7px;text-align:center;position:relative;overflow:hidden}
.chip .k{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.chip .v{display:block;font-family:var(--f-num);font-size:17px;font-weight:500;letter-spacing:-.02em;margin-top:1px}
.chip.d .v{color:var(--brass)} .chip.s .v{color:var(--tile)}
.chip.r .v{color:var(--lapis)} .chip.h .v{color:var(--silk)}
.chip.warn::after{content:"";position:absolute;inset:0;border:1px solid var(--madder);pointer-events:none;
  animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

main{padding:14px 14px 0;min-height:calc(100dvh - 320px)}
.sec{margin:0 0 18px}
.sec>h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);
  font-family:var(--f-ui);font-weight:800;display:flex;align-items:center;gap:10px;margin-bottom:9px}
.sec>h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--brass-dim),transparent)}
.lede{color:var(--muted);font-size:14px;margin:0 0 12px}

.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:12px 13px}
.rows{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line-soft);
  border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:11px;padding:11px 13px;text-align:left;width:100%;
  background:none;border:0;border-top:1px solid var(--line-soft);cursor:pointer}
.row:first-child{border-top:0}
.row:active{background:var(--panel-hi)}
.row.static{cursor:default}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.row .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.row .end{text-align:right;flex:none;font-family:var(--f-num);font-size:14px}
.row .end small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--dim);letter-spacing:.06em}
.row .chev{color:var(--dim);flex:none;font-size:17px;margin-left:-4px}
.row[disabled]{opacity:.45;cursor:default}
.glyph{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:8px;
  background:var(--panel-hi);border:1px solid var(--line);font-family:var(--f-disp);font-size:16px;color:var(--silk)}
.glyph.warn{border-color:#5a2a26;background:#2a1412;color:#E08B82}

.tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;
  border:1px solid var(--line);color:var(--muted);font-weight:700;white-space:nowrap}
.tag.good{color:var(--tile);border-color:#22564f;background:#0f2a28}
.tag.bad{color:var(--madder);border-color:#5a2a26;background:#2a1412}
.tag.gold{color:var(--brass);border-color:var(--brass-dim);background:#2a2110}
.tag.cool{color:var(--lapis);border-color:#2f3f6e;background:#141c33}

.btn{display:block;width:100%;padding:13px;border-radius:var(--r);border:1px solid var(--brass-dim);
  background:linear-gradient(180deg,#2A2413,#1D1A0F);color:var(--brass-hi);font-weight:700;
  font-size:15px;letter-spacing:.04em;cursor:pointer}
.btn:active{background:#332B15}
.btn[disabled]{opacity:.4;cursor:default}
.btn.ghost{border-color:var(--line);background:var(--panel);color:var(--text)}
.btn.ghost:active{background:var(--panel-hi)}
.btn.danger{border-color:#5a2a26;background:#231311;color:#E08B82}
.btn.sm{padding:9px 12px;font-size:13.5px;width:auto}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow .btn{flex:1}

.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px;border-top:1px dashed var(--line-soft)}
.kv:first-child{border-top:0}
.kv .k{color:var(--muted)} .kv .v{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pos{color:var(--tile)} .neg{color:var(--madder)} .gold{color:var(--brass)}

.haggle{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--brass-dim);
  background:radial-gradient(120% 90% at 50% 0%,#2E2718 0%,#151D2B 70%);padding:20px 14px 16px;
  text-align:center;width:100%;cursor:pointer;display:block;user-select:none}
.haggle:active{background:radial-gradient(120% 90% at 50% 0%,#3A3120 0%,#151D2B 70%)}
.haggle > span{display:block}
.haggle .hd{font-family:var(--f-disp);font-size:23px;line-height:1.15;color:var(--brass-hi)}
.haggle .hs{font-size:12.5px;color:var(--muted);margin-top:3px}
.haggle .meter{height:5px;border-radius:3px;background:#0C1220;margin-top:11px;overflow:hidden;border:1px solid var(--line)}
.haggle .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--brass-dim),var(--brass));transition:width .18s}
.coin{position:absolute;pointer-events:none;font-family:var(--f-num);font-weight:600;font-size:15px;
  color:var(--brass-hi);animation:fly .75s ease-out forwards;text-shadow:0 2px 6px #000}
@keyframes fly{0%{opacity:0;transform:translateY(0) scale(.8)}18%{opacity:1}
  100%{opacity:0;transform:translateY(-58px) scale(1.05)}}

.step{display:flex;align-items:center;gap:8px}
.step button{width:42px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--panel-hi);
  font-size:20px;font-family:var(--f-num);line-height:1;cursor:pointer}
.step button:active{background:#2A3A57}
.step .q{flex:1;text-align:center;font-family:var(--f-num);font-size:20px;font-weight:600}
.step .q small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--dim);letter-spacing:.08em}

.pillrow{display:flex;gap:7px;flex-wrap:wrap}
.pill{padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);
  font-size:13.5px;cursor:pointer;color:var(--muted)}
.pill[aria-pressed="true"]{border-color:var(--brass);color:var(--brass-hi);background:#241E10}

.entry{border-left:2px solid var(--line);padding:2px 0 12px 12px;margin-left:3px;position:relative}
.entry::before{content:"";position:absolute;left:-5px;top:7px;width:8px;height:8px;border-radius:50%;
  background:var(--line);border:2px solid var(--ground)}
.entry.good::before{background:var(--tile)} .entry.bad::before{background:var(--madder)}
.entry.gold::before{background:var(--brass)}
.entry .when{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.entry .txt{font-size:14.5px;margin-top:2px}
.entry .txt em{font-family:var(--f-disp);font-style:italic;color:var(--silk)}
.delta{font-family:var(--f-num);font-size:12.5px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim);text-align:right;
  padding:0 0 6px;font-weight:700;border-bottom:1px solid var(--line)}
.tbl th:first-child{text-align:left}
.tbl td{padding:7px 0;border-bottom:1px solid var(--line-soft);text-align:right;
  font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl td:first-child{text-align:left;font-family:var(--f-ui)}
.tbl td .w{color:var(--dim);font-size:11px;font-family:var(--f-num)}
.scrollx{overflow-x:auto}

.actionbar{position:sticky;bottom:calc(58px + env(safe-area-inset-bottom));z-index:35;
  padding:10px 14px;background:linear-gradient(180deg,rgba(15,22,33,0),var(--ground) 30%)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:45;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(11,16,25,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);max-width:620px;margin:0 auto}
nav button{background:none;border:0;padding:7px 2px 9px;cursor:pointer;color:var(--dim);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;letter-spacing:.07em;
  text-transform:uppercase;font-weight:700;position:relative}
nav button .ic{display:flex;color:inherit}
nav button .ic svg{display:block}
nav button[aria-current="page"]{color:var(--brass)}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--brass)}
nav .badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:8px;
  background:var(--madder);color:#fff;font-size:10px;line-height:16px;font-family:var(--f-num);padding:0 4px}
nav .badge.gold{background:var(--brass);color:#1a1408}

.scrim{position:fixed;inset:0;background:rgba(6,9,14,.72);z-index:60;display:flex;align-items:flex-end;
  justify-content:center;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:620px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:16px 15px calc(18px + env(safe-area-inset-bottom));
  max-height:88dvh;overflow-y:auto;animation:rise .24s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(28px);opacity:.4}}
.sheet h3{font-size:21px;margin-bottom:3px}
.sheet .sub{color:var(--muted);font-size:13.5px;margin-bottom:13px}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:-6px auto 12px}
.choice{display:block;width:100%;text-align:left;padding:12px 13px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--ground-2);margin-top:9px;cursor:pointer}
.choice:active{background:var(--panel-hi)}
.choice[disabled]{opacity:.45}
.choice .ct{font-weight:700;font-size:15px}
.choice .cs{font-size:12.5px;color:var(--muted);margin-top:2px}

#toasts{position:fixed;left:0;right:0;bottom:calc(126px + env(safe-area-inset-bottom));z-index:70;
  display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
#toasts.up{top:calc(env(safe-area-inset-top) + 92px);bottom:auto;flex-direction:column}
.toast{background:#101827;border:1px solid var(--line);border-left:3px solid var(--brass);
  border-radius:8px;padding:8px 12px;font-size:13.5px;box-shadow:var(--shadow);max-width:100%;animation:tin .25s ease-out}
.toast.good{border-left-color:var(--tile)} .toast.bad{border-left-color:var(--madder)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}

.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pgrid button{padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;
  background:var(--ground-2);cursor:pointer;aspect-ratio:1}
.pgrid button img{width:100%;height:100%;object-fit:cover;display:block}
.pgrid button[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 2px rgba(217,164,65,.3)}
.pts{font-size:24px;font-weight:600}
.trait{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:10px 4px;
  border:0;border-top:1px solid var(--line-soft);background:none;cursor:pointer;color:inherit}
.trait:first-child{border-top:0}
.trait[aria-pressed="true"]{background:#241E10}
.trait[disabled]{opacity:.4}
.trait .c{font-family:var(--f-num);color:var(--brass);flex:none;width:22px;text-align:right;font-size:15px}
.trait .main{flex:1;min-width:0}
.trait .t{font-weight:600;font-size:14.5px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.trait .sub{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.center{text-align:center}
.mt{margin-top:12px} .mb{margin-bottom:10px}
.hint{font-size:12.5px;color:var(--dim);margin-top:8px}
.primer{margin:0;font-size:13.5px;line-height:1.7;color:var(--muted)}
.primer b{color:var(--brass-hi);font-weight:700}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bar{display:block;height:6px;border-radius:3px;background:#0C1220;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:var(--brass)}
.bar.risk i{background:var(--madder)}
.bar.good i{background:var(--tile)}
.bar.slim{height:4px;margin-top:4px}

.chart{position:relative;margin:-14px -14px 12px;border-bottom:1px solid var(--line);
  background:var(--ground-2);overflow:hidden}
.chart::before{content:"";position:absolute;inset:0;background-image:var(--chart-bg);
  background-size:cover;background-position:center 62%;opacity:.07;filter:grayscale(.75) contrast(.8)}
.chart-scroll{position:relative;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.chart-scroll svg{display:block}
.chart-key{position:relative;display:flex;gap:12px;flex-wrap:wrap;padding:6px 14px 8px;
  font-size:10.5px;letter-spacing:.06em;color:var(--dim);border-top:1px solid var(--line-soft);
  background:linear-gradient(180deg,rgba(11,16,25,.7),var(--ground-2))}
.chart-key span{display:flex;align-items:center;gap:5px}
.chart-key i{width:14px;height:2px;background:var(--brass);border-radius:1px;flex:none}
.chart-key i.k-shut{background:repeating-linear-gradient(90deg,var(--line) 0 4px,transparent 4px 7px)}
.chart-key i.k-out{width:8px;height:8px;border-radius:50%;background:var(--brass-hi)}
.chart-key i.k-back{width:8px;height:8px;border-radius:50%;background:var(--ground);
  border:2px solid var(--brass-hi)}
.chart-key i.k-deal{width:9px;height:9px;border-radius:50%;background:none;border:2px solid var(--tile)}
.banner{position:relative;margin:-14px -14px 16px;aspect-ratio:2.6/1;overflow:hidden;
  border-bottom:1px solid var(--line);background:var(--ground-2)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.banner::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(11,16,25,.45) 0%,rgba(11,16,25,0) 34%,rgba(11,16,25,.72) 78%,var(--ground) 100%)}
.banner .cap{position:absolute;left:14px;right:14px;bottom:8px;z-index:2;font-family:var(--f-disp);
  font-size:20px;line-height:1.2;color:var(--silk);text-shadow:0 2px 12px rgba(0,0,0,.85)}
.banner .cap small{display:block;font-family:var(--f-ui);font-size:10.5px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:var(--brass-hi);text-shadow:0 1px 8px #000}
.sheet .banner{margin:-16px -15px 14px;border-radius:15px 15px 0 0;aspect-ratio:2.2/1}

/* matters outstanding — a problem should look like a problem */
.issue{border-left:3px solid var(--madder)}
.issue .glyph{border-color:#5a2a26;background:#2a1412;color:#E08B82}
/* an obligation with a clock on it */
.deal{border-left:3px solid var(--brass-dim)}
.deal.late{border-left-color:var(--madder)}
.deal.ready{border-left-color:var(--tile)}
/* people: a service bar under the name */
.who{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--dim);margin-top:3px}
.who .bar{flex:1;margin:0;max-width:90px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="frame">
  <header id="hud">
    <div class="hud-top">
      <div class="house" id="houseName">The House of Yusuf<small id="houseSeat">Samarkand</small></div>
      <div class="date" id="date"><b>Spring</b>1247</div>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="view"></main>
  <div class="actionbar"><button class="btn" id="endturn">End the Turn</button></div>
  <nav id="nav"></nav>
</div>
<div id="toasts"></div>
<div id="sheetHost"></div>
<script>
"use strict";
/* =====================================================================
   THE SAMARKAND LEDGER — a Silk Road merchant house, 1247
   One authoritative state object (S). Every displayed number derives
   from it; ducats move through coin() and nowhere else.
   ===================================================================== */

const CONFIG = {
  turnsPerSeason: 2,        // granularity dial: 1 = a turn is a whole season
  startYear: 1247,
  startDucats: 180,
  startStores: 40,
  startRepute: 4,
  hagglesBase: 10,
  storesPerHead: 1,
  storesPerLoadCap: 0.28,   // fodder scales with how much you can carry
  storesPerTravellerTurn: 2,
  storePrice: 2,
  debtGraceTurns: 3,
  reputeSaleBonus: 0.004,
  reputeSaleCap: 0.30,
  distancePay: 0.16,        // every extra turn of road adds this to the price
  satPerRun: 0.13,          // a market you work stops paying
  satDecay: 0.72,
  satCap: 0.40,
  promoteYears: 10,         // turns of service before a promotion is thinkable
  promoteLoyalty: 70,
  winDucats: 20000, winRepute: 60,
  saveKey: "samarkand-ledger-v2"
};
const SEASONS = ["Spring","Summer","Autumn","Winter"];

/* ---------------------------------------------------------- goods ---- */
const GOODS = {
  silk:      {name:"Bolts of silk",   short:"Silk",      base:42, g:"Si", supply:0.95},
  jade:      {name:"Khotan jade",     short:"Jade",      base:55, g:"Ja", supply:1.15},
  lapis:     {name:"Badakhshan lapis",short:"Lapis",     base:48, g:"La", supply:0.90},
  spices:    {name:"Pepper & casia",  short:"Spices",    base:34, g:"Sp", supply:1.05},
  incense:   {name:"Frankincense",    short:"Incense",   base:30, g:"In", supply:1.10},
  paper:     {name:"Samarkand paper", short:"Paper",     base:16, g:"Pa", supply:0.72},
  glass:     {name:"Syrian glassware",short:"Glass",     base:26, g:"Gl", supply:1.00},
  tea:       {name:"Brick tea",       short:"Tea",       base:22, g:"Te", supply:1.12},
  porcelain: {name:"White porcelain", short:"Porcelain", base:46, g:"Po", supply:1.18},
  horses:    {name:"Ferghana horses", short:"Horses",    base:66, g:"Ho", supply:0.88}
};
const GOOD_IDS = Object.keys(GOODS);

/* ---------------------------------------------------------- cities --- */

/* =====================================================================
   CONTRACTS — an order with a name, a deadline and a penalty on it.
   Fulfilled automatically when a caravan reaches the city carrying the
   goods. The premium over the market is the whole point of them.
   ===================================================================== */
const PATRONS = ["the qadi of","the mint at","the garrison of","a silk guild in","the hospital at",
  "a Genoese factor in","the governor of","a monastery near","the customs house at","a shipowner of"];

function contractCities(){
  return ROUTES.filter(r => routeOpen(r.id) && !routeBlocked(r) && !cityBlocked(r.to)).map(r => r.id);
}
function makeOffer(source){
  const pool = contractCities();
  let rid, patron, prem, span;
  const h = source && source.startsWith("house:") ? houseById(source.slice(6)) : null;
  if(h){
    const seat = ROUTES.find(r => CITIES[r.to].name === h.seat && routeOpen(r.id));
    rid = seat ? seat.id : pick(pool);
    patron = h.house;
    prem = rnd(1.34, 1.72);
    span = 4;
  }else{
    if(!pool.length) return null;
    rid = pick(pool);
    prem = rnd(1.14, 1.42);
    span = 3;
    patron = pick(PATRONS) + " " + CITIES[route(rid).to].name;
  }
  if(!rid) return null;
  const r = route(rid), city = r.to;
  const ranked = GOOD_IDS.slice().sort((a,b) => cityPrice(city,b) - cityPrice(city,a));
  const good = pick(ranked.slice(0, 4));
  const qty = clamp(Math.round(rnd(3, 5 + capacity()/8)), 3, 26);
  const pay = Math.round(cityPrice(city, good) * sellMult() * prem);
  return {
    id:"k" + Math.random().toString(36).slice(2,8),
    patron, good, qty, city, rid, pay,
    span: r.turns + irnd(3, 4 + span),
    rep: clamp(Math.round(r.turns/2) + 1, 1, 7),
    house: h ? h.id : null
  };
}

    return {kind:"gold", text:"<em>An order is put to you.</em> " + esc(o.patron) + " wants " + o.qty + " loads of " +
      GOODS[o.good].short.toLowerCase() + " landed at " + CITIES[o.city].name + ".", d:[o.pay + "d the load"]};
  }},
  {id:"houseContract", w:7, when:()=>S.marriages.length && S.offers.length<5, run(){
    const hid = pick(S.marriages), h = houseById(hid);
    const o = makeOffer("house:" + hid); if(!o) return null;
    S.offers.push(o);
    return {kind:"gold", text:"<em>Family business.</em> " + esc(h.house) + " puts an order your way that they would not have offered a stranger.",
      d:[o.qty + " loads of " + GOODS[o.good].short.toLowerCase(), o.pay + "d the load"]};
  }},
  {id:"illness", w:4, when:()=>S.house.some(m=>!travelling(m)), run(){
    const m = pick(S.house.filter(x=>!travelling(x)));
    m.busy = S.turn+1;
    const n = irnd(8,22); coin(-n,"Physician");
    return {kind:"bad", text:esc(m.name) + " takes a fever. The physician bleeds him, charges for it, and forbids the road for a season.", d:["-"+n+"d","one Hand lost"]};
  }},
  {id:"snow", w:5, when:()=>seasonOf(S.turn)==="Winter", run(){
    const n = Math.ceil(storesNeed()*0.5);
    S.stores = Math.max(0, S.stores-n);
    return {kind:"bad", text:"A hard freeze. The beasts eat double and the fodder-sellers know it.", d:["-"+n+" stores"]};
  }},
  {id:"passes", w:5, when:()=>seasonOf(S.turn)==="Winter" && !hasIssue("snowbound") && ROUTES.some(r=>routeOpen(r.id)&&r.terrain==="mountain"), run(){
    addIssue("snowbound");
    return {kind:"bad", text:"<em>The passes are shut.</em> Snow came a month early to the Pamirs and everything over the top waits for the thaw."};
  }},
  {id:"harvest", w:5, when:()=>seasonOf(S.turn)==="Autumn", run(){
    const n = irnd(8, 14 + S.props.serai*4);
    S.stores += n;
    return {kind:"good", text:"Threshing season. You buy grain at the field price and fill the serai's pits.", d:["+"+n+" stores"]};
  }},
  {id:"rumour", w:8, when:()=>ROUTES.some(r=>!routeOpen(r.id) && S.repute>=(r.rep||0)), run(){
    const r = pick(ROUTES.filter(x=>!routeOpen(x.id) && S.repute>=(x.rep||0)));
    S.flags["disc_"+r.id] = true;
    return {kind:"", text:"In the bathhouse you hear the whole of the " + r.name.toLowerCase() + " described by a man who has walked it twice. " + r.note, d:["scouting is cheaper now"]};
  }},
  {id:"matchmaker", w:7, when:()=>marriageable().length && HOUSES.some(h=>canMarry(h)), run(){
    const h = pick(HOUSES.filter(canMarry));
    return {kind:"gold", text:"<em>A matchmaker calls.</em> " + esc(h.house) + " of " + esc(h.seat) +
      " has a daughter of an age, and has asked, discreetly, whether your house would consider it.", d:["a match is open"]};
  }},
  {id:"raise", w:6, when:()=>S.staff.length>0, run(){
    const s = pick(S.staff), d = STAFF[s.type];
    return ask(s.name + " asks for more", "Your " + d.name.toLowerCase() + " has had the same wage for " + Math.max(1,s.years) + " turns, and says so respectfully.",[
      {t:"Raise the wage", s:"+2 a turn, and a man who stays.", do(){ s.bonus = (s.bonus||0)+2; s.loyalty = clamp(s.loyalty+18,0,100);
        post("good", esc(s.name) + " gets the raise and, more to the point, gets it without having to ask twice.");}},
      {t:"A purse this once", s:"A one-off. Cheaper, and he notices.", do(){ coin(-30,"Purse for " + s.name); s.loyalty = clamp(s.loyalty+6,0,100);
        post("", "You give " + esc(s.name) + " a purse and no promise. He takes it and says nothing.");}},
      {t:"Refuse", s:"", do(){ s.loyalty = clamp(s.loyalty-18,0,100);
        post("bad", "You tell " + esc(s.name) + " that times are hard. He has been in the yard long enough to know whether that is true.");}}
    ]);
  }},
  {id:"poach", w:5, when:()=>S.staff.some(s=>s.loyalty<45), run(){
    const s = pick(S.staff.filter(x=>x.loyalty<45)), d = STAFF[s.type];
    return ask("A rival is buying your people", "Someone has offered " + s.name + " better terms. Your " + d.name.toLowerCase() + " has come to tell you, which is itself a kind of loyalty.",[
      {t:"Beat the offer", s:"-" + (d.hire) + "d now, +3 a turn after.", do(){
        if(S.ducats < d.hire){ toast("bad","You cannot raise it."); return; }
        coin(-d.hire,"Kept " + s.name); s.bonus = (s.bonus||0)+3; s.loyalty = clamp(s.loyalty+30,0,100);
        post("good", esc(s.name) + " stays, and the rival hears that your house does not lose people.");}},
      {t:"Let them go", s:"You are not bidding for staff.", do(){
        S.staff = S.staff.filter(x=>x.id!==s.id); repute(-2);
        post("bad", esc(s.name) + " goes across the row with everything he knows about your stages and your margins.");}}
    ]);
  }},
  {id:"wagonwright", w:6, when:()=>fleetUnits().some(u=>u.tier < FLEET[u.line].tiers.length-1), run(){
    const u = pick(fleetUnits().filter(x=>x.tier < FLEET[x.line].tiers.length-1));
    const next = FLEET[u.line].tiers[u.tier+1], cost = Math.round(next.up*0.55);
    return ask("A wright with an idle winter", "He will make up a " + next.name.toLowerCase() + " out of what you already own, for " + cost + " ducats, if you decide now.",[
      {t:"Take the work", s:"-" + cost + "d, one unit upgraded.", do(){
        if(S.ducats < cost){ toast("bad","Not enough ducats."); return; }
        coin(-cost,"Wright's winter work"); u.tier++; unlockTier(u.line, u.tier);
        post("good","<em>" + esc(next.name) + ".</em> He works all winter in your yard and it comes out better than the price suggested.");}},
      {t:"Not this year", s:"", do(){ post("","You tell him to come back when the roads are open. He shrugs and goes to the next yard.");}}
    ]);
  }},
  {id:"dealer", w:6, when:()=>true, run(){
    const line = chance(0.7) ? "camel" : "mule";
    const tier = Math.min(unlockedTier(line), 1);
    const def = FLEET[line].tiers[tier], cost = Math.round(def.buy*0.62);
    return ask("A dealer with a debt", "He is selling a " + def.name.toLowerCase() + " below its worth because he needs the money before Friday.",[
      {t:"Buy it — " + cost + "d", s:"", do(){
        if(S.ducats < cost){ toast("bad","Not enough ducats."); return; }
        coin(-cost, def.name); addUnit(line, tier);
        post("good","You buy the " + esc(def.name.toLowerCase()) + " and do not ask what the money is for.");}},
      {t:"Walk on", s:"", do(){ post("","You walk on. Somebody else will have it by evening.");}}
    ]);
  }},
  {id:"muhtasib", w:5, when:()=>S.props.stall>=1 && !hasIssue("weights"), run(){
    return ask("The market inspector","The muhtasib has found your stall's scales a hair light. He suggests, delicately, that this can be settled here.",[
      {t:"Settle it here", s:"-" + irnd(20,40) + "d, and nobody hears.", do(){
        const n = irnd(20,40);
        if(S.ducats < n){ addIssue("weights"); post("bad","You cannot pay, and by evening the row has the story."); return; }
        coin(-n,"'Fee' to the muhtasib");
        post("","You pay. He recalibrates the scale with his thumb and wishes you a prosperous season.");}},
      {t:"Refuse him", s:"He will make a story of it.", do(){ addIssue("weights");
        post("bad","<em>Your weights are questioned.</em> You refuse to pay, and by Friday the cloth row is repeating it as fact.");}}
    ]);
  }},
  {id:"brawl", w:4, when:()=>S.props.serai>=2, run(){
    const n = irnd(15,45); coin(-n,"Damages at the serai");
    return {kind:"bad", text:"Two caravans that hate each other take rooms on the same night. The bathhouse door will need replacing.", d:["-"+n+"d"]};
  }},
  {id:"stray", w:4, when:()=>true, run(){
    addUnit("camel", 0);
    return {kind:"good", text:"A camel wanders in behind the evening column with no brand and no owner. After three days of asking, she is yours.", d:["+1 camel"]};
  }},
  {id:"scholar", w:4, when:()=>S.repute>=8, run(){
    const n = irnd(15,40);
    return ask("A geographer's request","A man copying a road-book asks for your stage-distances east, and offers to name your house in the margin.",[
      {t:"Give him the book", s:"-" + n + "d in a copyist's time. Your name travels.", do(){ coin(-n,"Copyist"); repute(5);
        post("good","Your stages go into a book that will be read in Tabriz and Cairo. Merchants you will never meet will know where to stable.");}},
      {t:"Keep your roads to yourself", s:"Knowledge is stock in trade.", do(){ S.flags.secretive=true;
        post("","You send him away with tea and nothing else. Some knowledge is worth more unwritten.");}}
    ]);
  }},
  {id:"toll", w:6, when:()=>S.caravans.length>0, run(){
    let n = irnd(10,35); if(bonus().tollFree) n = Math.round(n*0.4);
    coin(-n,"Road toll settled in absence");
    return {kind:"bad", text:"A rider brings word that your column is being held at a toll-post. You send the money out to meet it.", d:["-"+n+"d"]};
  }},
  {id:"prices", w:7, when:()=>true, run(){
    const g = pick(GOOD_IDS);
    S.supply[g] = clamp(S.supply[g] + (chance(0.5)?-1:1)*rnd(0.08,0.2), 0.5, 2.2);
    return {kind:"", text:"The bazaar turns over. " + GOODS[g].name + " find a new price and the criers announce it twice.", d:[]};
  }},
  {id:"almsAsk", w:4, when:()=>S.ducats>120, run(){
    const n = Math.round(clamp(S.ducats*0.04,10,70));
    return ask("The madrasa asks","The mudarris comes himself. The roof of the lecture hall is open to the sky and the winter is coming.",[
      {t:"Give " + n + "d", s:"Repute, and prayers you may need.", do(){ coin(-n,"Alms to the madrasa"); repute(5);
        post("good","Your name is read out after the Friday prayer. It is worth more than the roof cost.");}},
      {t:"Give nothing", s:"", do(){ repute(-2); post("bad","You plead a poor season. The mudarris accepts it politely and remembers it exactly.");}}
    ]);
  }},
  {id:"fire", w:3, when:()=>held()>14, run(){
    const g = GOOD_IDS.filter(x=>S.goods[x]>0); if(!g.length) return null;
    const pg = pick(g), q = Math.max(1, Math.floor(S.goods[pg]*rnd(0.1,0.3)));
    S.goods[pg] -= q;
    return {kind:"bad", text:"A lamp in the godown, a dry night, and a wall of bales. It could have been the whole quarter.", d:["-"+q+" "+GOODS[pg].short.toLowerCase()]};
  }},
  {id:"sonAsks", w:5, when:()=>S.house.some(m=>!m.you && m.skill<3 && !travelling(m)), run(){
    const m = pick(S.house.filter(x=>!x.you && x.skill<3 && !travelling(x)));
    return ask(m.name + " wants a road of his own","He has been out twice with a caravan master and thinks that is enough. It is not, quite.",[
      {t:"Let him lead the next one", s:"+1 skill now, and a season of worry.", do(){ m.skill++;
        post("good", esc(m.name) + " takes it seriously, which is the first good sign. He asks better questions than he did.");}},
      {t:"Another year under a master", s:"Safer. He will not thank you.", do(){ m.sore = true;
        post("", "You tell him to go out once more under somebody who knows the road. He does not argue, which is worse than arguing.");}}
    ]);
  }},
  {id:"strikeRisk", w:4, when:()=>S.staff.length>=2 && S.staff.some(s=>s.loyalty<30) && !hasIssue("strike"), run(){
    addIssue("strike");
    return {kind:"bad", text:"<em>The yard has stopped.</em> Wages were late once too often, and the drivers are sitting on the bales instead of loading them."};
  }},
  {id:"lawsuit", w:4, when:()=>S.repute>=18 && !hasIssue("lawsuit"), run(){
    addIssue("lawsuit");
    return {kind:"bad", text:"<em>A suit in the qadi's court.</em> A consignment you never handled has been laid at your door, with witnesses who are very sure."};
  }},
  {id:"plagueCity", w:3, when:()=>ROUTES.filter(r=>routeOpen(r.id)).length>=3, run(){
    const r = pick(ROUTES.filter(x=>routeOpen(x.id)));
    if(cityBlocked(r.to)) return null;
    addIssue("plague", {city:r.to});
    return {kind:"bad", text:"<em>Sickness at " + CITIES[r.to].name + ".</em> The gates are shut, the markets with them, and the road ends at a picket line."};
  }},
  {id:"clip", w:4, when:()=>!hasIssue("counterfeit") && S.props.stall>=1, run(){
    addIssue("counterfeit");
    return {kind:"bad", text:"<em>Clipped coin.</em> Somebody has been shaving the silver, and now the whole row weighs every dirham twice."};
  }},
  {id:"inheritance", w:3, when:()=>S.repute>=20, run(){
    const n = irnd(120, 260);
    coin(n,"A legacy");
    return {kind:"gold", text:"An uncle you met twice dies in Nishapur leaving no sons, and a notary you have never met sends the balance of his account.", d:["+"+fmt(n)+"d"]};
  }},
  {id:"rivalFail", w:4, when:()=>S.repute>=14, run(){
    const g = pick(GOOD_IDS), q = irnd(3,7);
    if(capacity()-held() < q) return null;
    S.goods[g] += q;
    return {kind:"good", text:"A house in the row has called in its creditors. You buy their standing stock at the assignee's price before the notice is even posted.", d:["+"+q+" "+GOODS[g].short.toLowerCase()]};
  }},
  {id:"monk", w:4, when:()=>ROUTES.some(r=>routeOpen(r.id)&&r.turns>=5), run(){
    return ask("A monk asks for passage","He is going east, a very long way east, and can pay in nothing but letters of introduction.",[
      {t:"Carry him", s:"Costs stores. Opens doors at the far end.", do(){ S.stores = Math.max(0,S.stores-12); repute(4); S.flags.monkFriend = true;
        post("good","You feed him for a season and send him on with your column. He writes three letters before he goes, and they are worth more than the food.");}},
      {t:"Refuse politely", s:"", do(){ post("","You wish him well and give him bread for the road. He takes it and does not press.");}}
    ]);
  }},
  {id:"loyaltyGift", w:5, when:()=>S.staff.length>=3, run(){
    const n = Math.round(20 + S.staff.length*8);
    return ask("A feast for the yard","It is nobody's birthday. The yard has had a hard season and everyone knows it.",[
      {t:"Kill a sheep — " + n + "d", s:"Loyalty across the whole house.", do(){
        if(S.ducats < n){ toast("bad","Not enough ducats."); return; }
        coin(-n,"A feast for the yard"); S.staff.forEach(s=>s.loyalty=clamp(s.loyalty+12,0,100));
        post("good","You kill a sheep for the yard and eat with them. It costs a day and a sheep, and it is the cheapest thing you do all year.");}},
      {t:"Not this season", s:"", do(){ S.staff.forEach(s=>s.loyalty=clamp(s.loyalty-3,0,100));
        post("","The season passes without a feast. Nobody says anything, which is how you know it was noticed.");}}
    ]);
  }},
  {id:"promotion", w:14, when:()=>promotable().length>0, run(){
    const s = promotable()[0], d = STAFF[s.type];
    return ask(s.name + " has served you " + s.years + " turns",
      "Your " + d.name.toLowerCase() + " has kept your books, your gate or your beasts through good seasons and bad, and has never once had to be watched.",[
      {t:"Bring him into the household", s:"Doubles his wage — and he gives you a Hand, every turn, like family.", do(){
        if(S.staff.filter(x=>x.trusted).length >= trustedCap()){ toast("bad","Not while your name is this size."); return; }
        s.trusted = true; s.bonus = (s.bonus||0) + d.wage; s.loyalty = clamp(s.loyalty+25,0,100); repute(4);
        post("gold","<em>" + esc(s.name) + " comes into the household.</em> He eats at your table, carries your seal, and can be sent where a son would be sent. The yard notices which of them you chose.",
          ["+1 Hand", "wage doubled"]);}},
      {t:"A purse and a good word", s:"Cheaper. He stays what he is.", do(){ coin(-60,"Purse for " + s.name); s.loyalty = clamp(s.loyalty+10,0,100);
        post("", "You give " + esc(s.name) + " a purse and praise him in front of the yard. He is pleased, and he understands exactly what he was not offered.");}}
    ]);
  }}
];

/* =====================================================================
   LONG THREADS — arcs that advance on what you have actually done,
   one beat at a time, with a cooling-off between beats.
   ===================================================================== */
const THREADS = [
  {id:"rival", name:"Karim of the Red Ledger", stages:[
    {when:()=>netIncome()>=18 || S.repute>=16, run(){

      return true; }},
    {when:()=>true, run(){
      GOOD_IDS.forEach(g => S.supply[g] = clamp(S.supply[g]-0.05,0.5,2.2));

      return true; }},
    {when:()=>true, run(){
      repute(-4);
      post("bad","<em>Slander.</em> A story goes round that your weights are light and your bonds are slow. It is not true, and it is repeated everywhere.",["-4 repute"]);
      return true; }},
    {when:()=>true, run(){
      ask("Karim's man at your gate","He offers, on his master's behalf, to divide the roads: the west to Karim, the east to you. He has brought a written bond and a pen.",[
        {t:"Sign the division", s:"Peace, and a smaller world.", do(){
          S.flags.divided=true; repute(2);
          post("","You sign. It is a quieter world and a smaller one. The western markets will not pay you what they pay him.");}},
        {t:"Refuse him", s:"He will make you regret it. You may make it back.", do(){

          post("gold","You hand the bond back unsigned. His man says nothing at all on the way out, which is worse than an argument.");}}
      ]);
      return true; }},
    {when:()=>S.flags.feud, run(){
      addIssue("feud");
      post("bad","<em>The feud bites.</em> A consignment of yours is held at customs for a month by an officer with new boots, and released spoiled.");
      return true; }},
    {when:()=>true, run(){
      const price = Math.round(clamp(netWorth()*0.16, 300, 3200));
      ask("Karim is finished","His eastern partner has absconded and his creditors are at the counting-house door. The red ledger is for sale, and so is his half of the cloth row.",[
        {t:"Buy him out — " + fmt(price) + "d", s:"His books, his buyers, his contracts.", do(){
          if(S.ducats<price){ toast("bad","You cannot raise it."); return; }

        {t:"Let him fall", s:"Costs nothing. Costs something.", do(){ repute(-2);
          post("","You let the creditors have him. Two of his drivers come to you for work and you take them. Nobody in the row thinks better of you for it.");}},
        {t:"Pay his smallest creditors", s:"-" + Math.round(price*0.3) + "d, and an enemy who owes you.", do(){
          const c = Math.round(price*0.3); if(S.ducats<c){ toast("bad","Not enough ducats."); return; }
          coin(-c,"Karim's creditors"); repute(12); S.flags.savedRival=true;
          post("gold","<em>An enemy in your debt.</em> You quietly settle the small men he owed — the porters, the ropemaker, the widow with the dye vats. Karim hears who did it. So does everyone else.");}}
      ]);
      return true; }}
  ]},

  {id:"governor", name:"The governor's favour", stages:[
    {when:()=>S.repute>=14, run(){
      post("gold","<em>An invitation.</em> The governor's steward asks you to the citadel to advise on the grain price. You are seated below the qadi and above the perfumers.");
      return true; }},
    {when:()=>S.repute>=22, run(){
      ask("The post-road contract","The citadel needs fodder and stabling for the yam riders on the Bukhara stage. It pays steadily and it ties you to the state.",[
        {t:"Take the contract", s:"Standing income, and an obligation.", do(){
          S.flags.postContract=true; repute(4);
          post("gold","<em>The yam contract.</em> Your serai is now a post-stage. Riders change horses in your yard at any hour, and the treasury pays by the quarter.",["standing income up"]);}},
        {t:"Stay a free merchant", s:"No retainer, no obligation.", do(){ repute(1);
          post("","You decline with respect. A merchant who owes nothing to the citadel can leave the city in a bad year.");}}
      ]);
      return true; }},
    {when:()=>S.repute>=34, run(){
      repute(6); S.flags.seal=true;
      post("gold","<em>A robe of honour.</em> At the spring audience you are given a robe and the right to a seal. Tolls on the Zarafshan road are waived for goods under your mark.",["+6 repute"]);

    {when:()=>S.repute>=48, run(){

        {t:"Accept the office", s:"Great repute. Some of the bazaar will never forgive it.", do(){

        {t:"Refuse the office", s:"Keep your hands free and your friends.", do(){

  {id:"debt", name:"Yakub the moneylender", stages:[
    {when:()=>S.ducats<0, run(){
      ask("Yakub at the door","He has heard you are short. He is very sorry to hear it, and he has brought a purse.",[
        {t:"Borrow 300d", s:"Repay 360 over six turns.", do(){

        {t:"Refuse the loan", s:"You will have to trade your way out.", do(){ repute(2);

  {id:"road", name:"The eastern commission", trigger:"caravan", stages:[
    {when:(ctx)=>ctx && ctx.route && ctx.route.turns>=4 && !ctx.hit, run(){

  {id:"succession", name:"The next generation", stages:[
    {when:()=>S.house.some(m=>!m.you && m.age>=24 && m.skill>=3), run(){
      const m = pick(S.house.filter(x=>!x.you && x.age>=24 && x.skill>=3));
      ask(m.name + " asks for a share","He has led caravans, taken losses and paid them back. He wants his name on the bond alongside yours.",[
        {t:"Make him a partner", s:"He earns as you do. He also decides as you do.", do(){
          m.partner=true; repute(6);
          post("gold","<em>A partnership.</em> " + esc(m.name) + "'s name goes on the seal beside yours. He is at once easier to work with and harder to overrule.");}},
        {t:"Not yet", s:"He will not see it that way.", do(){ m.sore=true;
          post("","You tell him to give it another two years. He accepts it without a word, which tells you something.");}}
      ]);
      return true; }},
    {when:()=>S.house.some(m=>m.partner) && yearOf(S.turn)>=CONFIG.startYear+6, run(){
      const m = S.house.find(x=>x.partner);
      repute(3);
      post("gold","<em>A grandson.</em> " + esc(m.name) + "'s wife is delivered of a son in the winter quarter. He is named for your father and will inherit a road that did not exist when you took the ruined serai.");
      return true; }}
  ]},

  {id:"inlaws", name:"The family you married", stages:[
    {when:()=>S.marriages.length>0, run(){
      const h = houseById(S.marriages[0]);
      post("gold","<em>The in-laws arrive.</em> Four of " + esc(h.house) + " come to see what their daughter married into. They walk the yard, count the beasts, and are polite about the well.");
      return true; }},
    {when:()=>S.marriages.length>0 && !hasIssue("inlaws"), run(){
      addIssue("inlaws");
      post("bad","<em>An obligation.</em> Her uncle has a debt, a plan, and a strong sense of what a son-in-law is for.");
      return true; }},
    {when:()=>S.marriages.length>=2, run(){
      repute(8);
      post("gold","<em>Two houses at one table.</em> You marry a second house into yours, and at the wedding the two families discover they have been trading through the same broker for years. Everyone does better out of it than they expected.",["+8 repute"]);
      for(let i=0;i<2;i++){ const o = makeOffer("house:" + pick(S.marriages)); if(o) S.offers.push(o); }
      return true; }}
  ]}
];

/* =====================================================================
   STATE
   ===================================================================== */
let S = null;

function newGame(playerName, portrait, age, sex, sonA, sonB){
  S = {
    v:2, houseName:"The House of " + playerName.split(" ")[0], tab:"bazaar", turn:0,
    ducats:CONFIG.startDucats, stores:CONFIG.startStores, repute:CONFIG.startRepute,
    goods:Object.fromEntries(GOOD_IDS.map(g=>[g,0])),
    supply:Object.fromEntries(GOOD_IDS.map(g=>[g,GOODS[g].supply])),
    props:{serai:0, stall:0, godown:0, dye:0, counting:0, depot:0, factory:0},
    staff:[],
    fleet:[],
    fleetTier:{camel:0, mule:0, boat:0},
    routes:{bukhara:{open:true, runs:0, sat:0}},
    caravans:[],
    house:[
      {id:"m1", name:playerName, age:age, role:"idle", at:null, skill:3, you:true, busy:0,
       wed:true, sex:sex || "m", portrait:portrait},
      {id:"m2", name:sonA, age:Math.max(6, Math.round(age*0.42)), role:"idle", at:null, skill:1, you:false, busy:0, sex:"m"},
      {id:"m3", name:sonB, age:Math.max(4, Math.round(age*0.42) - 3), role:"idle", at:null, skill:1, you:false, busy:0, sex:"m"}
    ],
    origins:[], marriages:[], offers:[], contracts:[], issues:[],
    haggles:CONFIG.hagglesBase,
    ledger:[], journal:[], threads:{}, flags:{}, debtTurns:0,
    stat:{earned:0, spent:0, tripsDone:0, tripsLost:0, taps:0, deals:0, dealsLate:0},
    over:null, plan:null
  };
  S.threads = Object.fromEntries(THREADS.map(t=>[t.id,{stage:0, cool:0, done:false}]));
  addUnit("camel",0); addUnit("camel",0);
  post("gold","You take possession of a ruined caravanserai a half-day east of Samarkand. The well is dry, the gate is off its hinges, and the road outside carries a hundred laden beasts a day.");
  return S;
}

/* ------------------------------------------------------ persistence -- */
function save(){ try{ localStorage.setItem(CONFIG.saveKey, JSON.stringify(S)); }catch(e){} }
function wipe(){ try{ localStorage.removeItem(CONFIG.saveKey); localStorage.removeItem("samarkand-ledger-v1"); }catch(e){} }
function load(){
  try{
    const raw = localStorage.getItem(CONFIG.saveKey);
    if(raw){ const o = JSON.parse(raw); if(o && o.v === 2){ S = o; return repair(); } }
    const old = localStorage.getItem("samarkand-ledger-v1");
    if(old){ const o = JSON.parse(old); if(o && o.v === 1) return migrate(o); }
  }catch(e){}
  return false;
}
function repair(){                       // forward-compatible defaults
  S.threads = S.threads || {};
  THREADS.forEach(t => { if(!S.threads[t.id]) S.threads[t.id] = {stage:0,cool:0,done:false}; });
  ["marriages","offers","contracts","issues","fleet","caravans","staff","origins"].forEach(k => { if(!Array.isArray(S[k])) S[k] = []; });
  S.fleetTier = S.fleetTier || {camel:0, mule:0, boat:0};
  S.stat = Object.assign({earned:0,spent:0,tripsDone:0,tripsLost:0,taps:0,deals:0,dealsLate:0}, S.stat||{});
  return true;
}
function migrate(o){                     // a v1 house keeps its road
  S = o; S.v = 2;
  S.fleet = []; S.fleetTier = {camel:0, mule:0, boat:0};
  const b = o.beasts || {};
  for(let i=0;i<(b.camel||0);i++) addUnit("camel",0);
  for(let i=0;i<(b.araba||0);i++) addUnit("mule",2);
  for(let i=0;i<(b.dhow||0);i++)  addUnit("boat",2);
  delete S.beasts;
  (S.staff||[]).forEach(s => {
    s.name = s.name || pick(STAFF_NAMES);
    s.loyalty = s.loyalty === undefined ? 55 : s.loyalty;
    s.years = s.years || 0; s.trusted = false; s.bonus = 0;
  });
  S.marriages = []; S.offers = []; S.contracts = []; S.issues = [];
  Object.values(S.routes || {}).forEach(r => { if(r.sat === undefined) r.sat = 0; });
  repair();
  post("","<em>The ledger is re-ruled.</em> A new book, the same house: your beasts are entered by name and tier, your people by their years of service.");
  return true;
}

/* ---------------------------------------------------------- helpers -- */
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rnd=(a,b)=>a+Math.random()*(b-a);
const irnd=(a,b)=>Math.floor(rnd(a,b+1));
const chance=p=>Math.random()<p;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const fmt=n=>{n=Math.round(n);return Math.abs(n)>=1000?n.toLocaleString("en-US"):String(n);};
const sgn=n=>(n>0?"+":"")+fmt(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=n=>Math.round(n*100)+"%";
const uid=p=>p+Math.random().toString(36).slice(2,8);

const seasonOf = t => SEASONS[Math.floor(t / CONFIG.turnsPerSeason) % 4];
const yearOf   = t => CONFIG.startYear + Math.floor(t / (CONFIG.turnsPerSeason * 4));
const dateStr  = t => seasonOf(t) + " " + yearOf(t);

/* -------------------------------------------------------- accounting - */
function coin(amount, item){
  amount = Math.round(amount);
  if(amount === 0) return 0;
  S.ducats += amount;
  if(amount > 0) S.stat.earned += amount; else S.stat.spent -= amount;
  S.ledger.push({turn:S.turn, item, dare: amount<0?-amount:0, avere: amount>0?amount:0, bal:S.ducats});
  if(S.ledger.length > 400) S.ledger.splice(0, S.ledger.length - 400);
  return amount;
}
function repute(d){
  if(d > 0 && hasOrigin("illname")) d *= 0.75;      // a bad name grows back slowly
  const before = S.repute;
  S.repute = clamp(S.repute + d, 0, 100);
  return S.repute - before;
}
function post(kind, text, deltas){
  S.journal.unshift({turn:S.turn, kind, text, deltas: deltas || null});
  if(S.journal.length > 140) S.journal.length = 140;
}

/* ------------------------------------------------------------ fleet -- */
function addUnit(line, tier){
  const u = {id:uid("u"), line, tier, busy:0};
  S.fleet.push(u); unlockTier(line, tier);
  return u;
}
function unlockTier(line, tier){ S.fleetTier[line] = Math.max(S.fleetTier[line] || 0, tier); }
const unlockedTier = line => S.fleetTier[line] || 0;
const fleetUnits = () => S.fleet;
const freeUnits  = () => S.fleet.filter(u => u.busy <= S.turn);
const unitsOn = (line, tier) => S.fleet.filter(u => u.line === line && u.tier === tier);
const freeOn  = (line, tier) => freeUnits().filter(u => u.line === line && u.tier === tier);
const lineOk  = (line, terrain) => FLEET[line].terrain.indexOf(terrain) >= 0;

/* --------------------------------------------------- marriage bonus -- */
function bonus(){
  const b = {sellAll:0, sell:{}, buy:{}, riskAll:0, riskTerrain:{}, fleetDiscount:{}, propDiscount:{},
             routeDiscount:{}, tollFree:false, guide:false, graceTurns:0, mongolTie:false};
  S.marriages.forEach(id => {
    const h = houseById(id); if(!h) return;
    const g = h.gift;
    if(g.sellAll) b.sellAll += g.sellAll;
    if(g.riskAll) b.riskAll += g.riskAll;
    if(g.graceTurns) b.graceTurns += g.graceTurns;
    if(g.tollFree) b.tollFree = true;
    if(g.guide) b.guide = true;
    if(g.mongolTie) b.mongolTie = true;
    ["sell","buy","riskTerrain","fleetDiscount","propDiscount","routeDiscount"].forEach(k => {
      if(!g[k]) return;
      Object.entries(g[k]).forEach(([kk,v]) => { b[k][kk] = (b[k][kk] || 0) + v; });
    });
  });
  return b;
}

/* ----------------------------------------------------------- issues -- */
const hasIssue = id => S.issues.some(i => i.id === id);
function addIssue(id, data){
  if(hasIssue(id) && !ISSUES[id].route && !ISSUES[id].city) return null;
  const it = Object.assign({id, since:S.turn}, data || {});
  if(ISSUES[id].route && !it.rid){
    const open = ROUTES.filter(r => routeOpen(r.id));
    it.rid = open.length ? pick(open).id : null;
  }
  if(ISSUES[id].eff && ISSUES[id].eff.staffIdle && !it.pid){
    const staffed = Object.keys(PROPS).filter(p => staffAt(p));
    if(!staffed.length) return null;
    it.pid = pick(staffed);
  }
  if(ISSUES[id].auto) it.until = S.turn + ISSUES[id].auto;
  S.issues.push(it);
  return it;
}
function clearIssue(it){ S.issues = S.issues.filter(x => x !== it); }
function issueTitle(it){
  const d = ISSUES[it.id];
  if(it.rid && route(it.rid)) return d.name + " — " + route(it.rid).name.toLowerCase().replace(/^the /,"");
  if(it.city) return "Sickness at " + CITIES[it.city].name;
  if(it.pid) return d.name + " — " + PROPS[it.pid].name.toLowerCase().replace(/,.*$/,"");
  return d.name;
}
function issueEff(){
  const e = {sell:0, risk:0, upkeep:0, haggle:1, decay:0, drain:0, repute:0,
             blockTerrain:null, cities:[], routes:[], noDispatch:false, props:[], beastLoss:0};
  S.issues.forEach(it => {
    const d = ISSUES[it.id].eff || {};
    if(d.sell) e.sell += d.sell;
    if(d.risk) { if(it.rid) e.routes.push({rid:it.rid, up:d.risk}); else e.risk += d.risk; }
    if(d.upkeep) e.upkeep += d.upkeep;
    if(d.haggle) e.haggle *= d.haggle;
    if(d.decay) e.decay += d.decay;
    if(d.drain) e.drain += d.drain;
    if(d.repute) e.repute += d.repute;
    if(d.beastLoss) e.beastLoss += d.beastLoss;
    if(d.blockTerrain) e.blockTerrain = d.blockTerrain;
    if(d.blockCity && it.city) e.cities.push(it.city);
    if(d.noDispatch) e.noDispatch = true;
    if(d.prop) e.props.push(d.prop);
    if(d.staffIdle && it.pid) e.props.push(it.pid);
  });
  return e;
}
const cityBlocked = c => issueEff().cities.indexOf(c) >= 0;

/* --------------------------------------------------------- derived --- */
const propTier = id => PROPS[id].tiers[S.props[id]];
const hasStaff = type => S.staff.some(s => s.type === type);
const staffAt  = pid => S.staff.find(s => s.at === pid);
const travelling = m => S.caravans.some(c => c.leader === m.id);
function tripOf(m){ const c = S.caravans.find(x => x.leader === m.id); return c ? route(c.rid) : null; }

function propIncome(id){
  const t = S.props[id]; if(!t) return 0;
  if(!staffAt(id)) return 0;
  if(issueEff().props.indexOf(id) >= 0) return 0;
  let inc = PROPS[id].tiers[t].income;
  if(S.house.some(m => m.role === "steward" && m.at === id)) inc *= 1.25;
  return Math.round(inc);
}
const staffWage = s => STAFF[s.type].wage + (s.bonus || 0);
function wages(){ return S.staff.reduce((n,s)=>n + staffWage(s), 0); }
function upkeep(){
  const mult = (1 + issueEff().upkeep) * (hasOrigin("beasts") ? 0.8 : 1);
  return Math.round(S.fleet.reduce((n,u)=>n + unitDef(u).upkeep, 0) * mult);
}
function grossIncome(){ return Object.keys(PROPS).reduce((n,id)=>n + propIncome(id), 0); }
function yamIncome(){ return S.flags.postContract ? 14 + S.props.serai*4 : 0; }
function netIncome(){ return grossIncome() + yamIncome() - wages() - upkeep() - issueEff().drain; }

function capacity(){
  return (PROPS.serai.tiers[S.props.serai].cap || 0) + (PROPS.godown.tiers[S.props.godown].cap || 0);
}
const held = () => GOOD_IDS.reduce((n,g)=>n + S.goods[g], 0);

/* Hands come from the household and from the few staff you have raised
   into it. Everyone else on the payroll is staff, and stays staff.     */
function handPeople(){
  return S.house.filter(m => m.role === "idle" && m.busy <= S.turn)
    .concat(S.staff.filter(s => s.trusted && s.busy <= S.turn));
}
function hands(){ return handPeople().length; }
function handTotal(){ return S.house.filter(m => m.role === "idle").length + S.staff.filter(s => s.trusted).length; }
function spendHand(){
  const p = handPeople(); if(!p.length) return false;
  const staffFirst = p.find(x => x.type) || p[0];   // spend paid people before family
  staffFirst.busy = S.turn + 1;
  return true;
}
function leaders(){        // who can take a caravan out
  return S.house.filter(m => m.role === "idle" && m.busy <= S.turn)
    .concat(S.staff.filter(s => (s.trusted || s.type === "master") && s.busy <= S.turn));
}
/* You can only bring so many outsiders to your own table. */
const trustedCap = () => 1 + Math.floor(S.repute / 25);
const promotable = () => S.staff.filter(s => !s.trusted && s.years >= CONFIG.promoteYears &&
  s.loyalty >= CONFIG.promoteLoyalty && S.repute >= 18) .filter(() => S.staff.filter(x=>x.trusted).length < trustedCap());

/* ------------------------------------------------------ the market --- */
function buyMult(){
  let m = 1 - (PROPS.stall.tiers[S.props.stall].buy || 0);
  if(S.house.some(x => x.role === "market")) m -= 0.10;
  if(hasOrigin("bargain")) m -= 0.08;
  if(hasOrigin("figures")) m += 0.09;
  return clamp(m, 0.50, 1.25);
}
function sellMult(){
  const b = bonus();
  let m = 1 + Math.min(S.repute * CONFIG.reputeSaleBonus, CONFIG.reputeSaleCap);
  m += PROPS.counting.tiers[S.props.counting].sell || 0;
  m += PROPS.factory.tiers[S.props.factory].sell || 0;
  if(hasStaff("dragoman")) m += 0.07;
  if(hasOrigin("tongue")) m += 0.08;
  m += standing();
  m += b.sellAll;
  m += issueEff().sell;
  return Math.max(0.4, m);
}
function buyPrice(g){
  const cut = 1 + (bonus().buy[g] || 0);          // a house bonus is a delta: -0.30 is 30% off
  return Math.max(1, Math.round(GOODS[g].base * S.supply[g] * buyMult() * Math.max(0.3, cut)));
}
const localSell = g => Math.max(1, Math.round(GOODS[g].base * S.supply[g] * 0.82));

const satOf = rid => Math.min(CONFIG.satCap, (S.routes[rid] && S.routes[rid].sat) || 0);
function satWord(rid){ const v = satOf(rid);
  return v < 0.08 ? "fresh" : v < 0.22 ? "worked" : v < 0.34 ? "tiring of you" : "glutted"; }
function firstRunBonus(rid){
  const runs = (S.routes[rid] && S.routes[rid].runs) || 0;
  return 0.40 * Math.pow(0.62, runs);
}
const distancePremium = r => 1 + (r.turns - 1) * CONFIG.distancePay;
function saleAt(rid, g){
  const r = route(rid), b = bonus();
  const silk = g === "silk" ? (PROPS.dye.tiers[S.props.dye].silk || 0) : 0;
  const house = b.sell[g] || 0;
  return cityPrice(r.to, g) * distancePremium(r) * sellMult() * (1 + firstRunBonus(rid)) *
         (1 - satOf(rid)) * (1 + silk + house);
}

/* ----------------------------------------------------------- risk ---- */
/* Two things nobody writes down. A young trader takes a road an older one
   would not; an old trader is not tested on a price. */
function playerAge(){ const y = S.house.find(m => m.you); return y ? y.age : BASE_AGE; }
const nerve    = () => (BASE_AGE - playerAge()) * 0.008;   // young hands, steadier on the road
const standing = () => (playerAge() - BASE_AGE) * 0.004;   // grey hairs, better prices

function riskMod(terrain){
  const b = bonus(); let r = nerve();
  if(hasStaff("guards")) r += 0.18;
  if(hasStaff("guide") || b.guide) r += 0.14;
  if(S.house.some(m => m.role === "road")) r += 0.15;
  r += (PROPS.depot.tiers[S.props.depot].risk || 0) * 2.5;
  r += Math.min(S.repute, 60) * 0.0025;
  r += b.riskAll;
  if(hasOrigin("guards")) r += 0.10;
  if(terrain && b.riskTerrain[terrain]) r += b.riskTerrain[terrain];
  return Math.min(r, 0.72);
}
function routeRisk(rid, extraCut){
  const r = route(rid), e = issueEff();
  const cut = Math.min(0.82, riskMod(r.terrain) + (extraCut || 0));
  let up = 1 + e.risk;
  e.routes.forEach(x => { if(x.rid === rid) up += x.up; });
  return clamp(r.risk * (1 - cut) * up, 0.02, 0.85);
}
const routeOpen = rid => !!(S.routes[rid] && S.routes[rid].open);
function routeBlocked(r){
  const b = bonus(), e = issueEff();
  if(r.needs === "guide"   && !hasStaff("guide") && !b.guide) return "Needs a mountain guide";
  if(r.needs === "captain" && (!hasStaff("captain") || !S.fleet.some(u => u.line === "boat"))) return "Needs a dhow and a captain";
  if(e.blockTerrain === r.terrain) return "The passes are shut";
  if(e.cities.indexOf(r.to) >= 0) return "Sickness at " + CITIES[r.to].name;
  if(e.noDispatch) return "The yard has stopped";
  return null;
}

function storesNeed(){
  const heads = S.house.filter(m => !travelling(m)).length + S.staff.length;
  const home = freeUnits().reduce((n,u)=>n + unitDef(u).cap * CONFIG.storesPerLoadCap, 0);
  const road = S.caravans.reduce((n,c)=>n + CONFIG.storesPerTravellerTurn + c.loads*0.12, 0);
  return Math.ceil(heads*CONFIG.storesPerHead + home + road);
}
function netWorth(){
  let n = S.ducats + S.stores * CONFIG.storePrice;
  GOOD_IDS.forEach(g => n += S.goods[g] * localSell(g));
  S.fleet.forEach(u => n += unitDef(u).buy * 0.6);
  Object.keys(PROPS).forEach(id => { for(let i=1; i<=S.props[id]; i++) n += PROPS[id].tiers[i].cost * 0.6; });
  S.caravans.forEach(c => n += c.invested);
  return Math.round(n);
}

/* =====================================================================
   ACTIONS
   ===================================================================== */
function haggle(ev, el){
  if(S.over) return;
  if(S.haggles <= 0){ toast("bad","The bazaar has heard enough of you today."); return; }
  S.haggles--; S.stat.taps++;
  const base = 2 + S.props.stall * 2 + Math.floor(S.repute / 8);
  let gain = Math.max(1, Math.round(irnd(base, base + 3 + S.props.stall) * issueEff().haggle));
  if(chance(0.06)){ gain *= 3; toast("good","A gullible pilgrim overpays for paper."); }
  coin(gain, "Bazaar haggling");
  flyCoin(ev, el, "+" + gain);
  renderChips();
  const m = document.getElementById("haggleMeter");
  if(m) m.style.width = (100 * S.haggles / maxHaggles()) + "%";
  const c = document.getElementById("haggleCount");
  if(c) c.textContent = S.haggles + " of " + maxHaggles() + " left this turn";
  save();
}
const maxHaggles = () => CONFIG.hagglesBase + S.props.stall * 3;

function buyGoods(g, q){
  q = Math.max(0, Math.min(q, capacity() - held()));
  if(q <= 0){ toast("bad","No room. Build or enlarge a warehouse."); return; }
  const cost = buyPrice(g) * q;
  if(cost > S.ducats){ toast("bad","Not enough ducats."); return; }
  coin(-cost, "Bought " + q + " " + GOODS[g].short.toLowerCase());
  S.goods[g] += q;
  S.supply[g] = clamp(S.supply[g] + q * 0.012, 0.5, 2.2);
  toast("good", "Bought " + q + " " + GOODS[g].short.toLowerCase() + " for " + fmt(cost) + "d");
  after();
}
function sellGoods(g, q){
  q = Math.max(0, Math.min(q, S.goods[g]));
  if(q <= 0) return;
  const gain = localSell(g) * q;
  coin(gain, "Sold " + q + " " + GOODS[g].short.toLowerCase() + " in Samarkand");
  S.goods[g] -= q;
  S.supply[g] = clamp(S.supply[g] - q * 0.012, 0.5, 2.2);
  toast("good","Sold " + q + " " + GOODS[g].short.toLowerCase() + " for " + fmt(gain) + "d");
  after();
}
function buyStores(q){
  const cost = q * CONFIG.storePrice;
  if(cost > S.ducats){ toast("bad","Not enough ducats."); return; }
  coin(-cost, "Grain and fodder x" + q);
  S.stores += q;
  after();
}

function propCost(id, tier){
  let d = bonus().propDiscount[id] || 0;
  if(id === "counting" && S.flags.cousin) d += 0.33;
  return Math.round(PROPS[id].tiers[tier].cost * (1 - Math.min(d, 0.6)));
}
function upgradeProp(id){
  const def = PROPS[id], next = S.props[id] + 1;
  if(next >= def.tiers.length) return;
  const cost = propCost(id, next);
  if(cost > S.ducats){ toast("bad","Not enough ducats."); return; }
  if(def.rep && S.repute < def.rep){ toast("bad","Your name is not yet worth that much."); return; }
  if(def.needsRoute && !routeOpen(def.needsRoute)){ toast("bad","You have no road there yet."); return; }
  if(!spendHand()){ toast("bad","No Hands left this turn."); return; }
  const t = def.tiers[next];
  coin(-cost, def.name + " — " + t.name);
  S.props[id] = next;
  repute(next >= def.tiers.length - 1 ? 3 : 2);
  post("gold", "<em>" + esc(t.name) + ".</em> " + esc(def.name) + " stands finished. " + esc(t.note));
  toast("good", t.name + " completed.");
  closeSheet(); after();
}

/* ----------------------------------------------------------- people -- */
function hireStaff(type){
  const d = STAFF[type], fee = Math.round(d.hire * (hasOrigin("hard") ? 1.25 : 1));
  if(fee > S.ducats){ toast("bad","Not enough ducats."); return; }
  if(!spendHand()){ toast("bad","No Hands left this turn."); return; }
  coin(-fee, "Hired a " + d.name.toLowerCase());
  const s = {id:uid("s"), type, at:null, busy:0, name:pick(STAFF_NAMES), loyalty:55, years:0, trusted:false, bonus:0};
  const want = Object.keys(PROPS).find(p => PROPS[p].staff === type && S.props[p] > 0 && !staffAt(p));
  if(want) s.at = want;
  S.staff.push(s);
  post("", esc(s.name) + " takes service with you as " + esc(d.name.toLowerCase()) +
        (want ? ", for the " + esc(PROPS[want].name.toLowerCase()) : "") + ".");
  toast("good", s.name + " hired." + (want ? " Posted to the " + PROPS[want].name.toLowerCase() + "." : ""));
  closeSheet(); after();
}
function dismissStaff(sid){
  const i = S.staff.findIndex(s => s.id === sid);
  if(i < 0) return;
  const s = S.staff[i];
  post("", "You pay off " + esc(s.name) + " and send " + (s.trusted ? "him out of the household" : "him on") + ".");

  S.staff.forEach(x => x.loyalty = clamp(x.loyalty - 4, 0, 100));

}
function assignStaff(sid, pid){
  const s = S.staff.find(x => x.id === sid); if(!s) return;
  const cur = staffAt(pid); if(cur) cur.at = null;
  s.at = pid; closeSheet(); after();
}
function setRole(mid, role, at){
  const m = S.house.find(x => x.id === mid); if(!m) return;
  if(travelling(m)){ toast("bad", m.name + " is on the road."); return; }
  m.role = role; m.at = at || null;
  post("", esc(m.name) + " takes up the work of " + esc(ROLES[role].name.toLowerCase()) +
        (at ? " at the " + esc(PROPS[at].name.toLowerCase()) : "") + ".");

/* ------------------------------------------------------------ fleet -- */
function unitPrice(line, tier){
  const d = bonus().fleetDiscount[line] || 0;
  return Math.round(FLEET[line].tiers[tier].buy * (1 - Math.min(d, 0.5)));
}
function upPrice(line, tier){
  const d = bonus().fleetDiscount[line] || 0;
  return Math.round(FLEET[line].tiers[tier].up * (1 - Math.min(d, 0.5)));
}
function buyUnit(line, tier, q){
  q = Math.max(1, q || 1);
  if(tier > unlockedTier(line)){ toast("bad","You have never owned one. Work up to it."); return; }
  const cost = unitPrice(line, tier) * q;
  if(cost > S.ducats){ toast("bad","Not enough ducats."); return; }
  coin(-cost, q + "x " + FLEET[line].tiers[tier].name.toLowerCase());
  for(let i=0;i<q;i++) addUnit(line, tier);
  toast("good","Bought " + q + " " + FLEET[line].tiers[tier].name.toLowerCase() + (q>1?"s":"") + ".");
  closeSheet(); after();
}
function upgradeUnit(line, tier){
  const u = freeOn(line, tier)[0];
  if(!u){ toast("bad","Nothing of that kind is in the yard."); return; }
  const next = FLEET[line].tiers[tier+1];
  if(!next){ toast("bad","There is nothing better of that kind."); return; }
  const cost = upPrice(line, tier+1);
  if(cost > S.ducats){ toast("bad","Not enough ducats."); return; }
  coin(-cost, "Made up into a " + next.name.toLowerCase());
  u.tier++; unlockTier(line, u.tier);
  const first = unitsOn(line, tier+1).length === 1;
  post(first ? "gold" : "", (first ? "<em>" + esc(next.name) + ".</em> " : "") +
    "The yard works up one " + esc(FLEET[line].tiers[tier].name.toLowerCase()) + " into a " + esc(next.name.toLowerCase()) + ". " +
    (first ? "You can have them built outright now, for rather more than this cost you." : ""));
  toast("good", next.name + " made up.");
  closeSheet(); after();
}

function openRoute(rid){
  const r = route(rid), b = bonus();
  if(S.repute < (r.rep||0)){ toast("bad","Your name does not open that road yet."); return; }
  const cost = routeCost(rid);
  if(cost > S.ducats){ toast("bad","Not enough ducats."); return; }
  if(!spendHand()){ toast("bad","No Hands left this turn."); return; }
  coin(-cost, "Scouted " + r.name.toLowerCase());
  S.routes[rid] = {open:true, runs:0, sat:0};
  repute(2);
  post("gold","<em>" + esc(r.name) + " is opened.</em> You buy a scout's memory: wells, tolls, and the names of men who can be trusted with a bond. " + esc(r.note));
  toast("good", r.name + " opened.");
  closeSheet(); after();
}
function routeCost(rid){
  const r = route(rid), b = bonus();
  let c = r.cost || 0;
  if(S.flags["disc_"+rid]) c *= 0.7;
  if(b.routeDiscount[rid]) c *= (1 - Math.min(b.routeDiscount[rid], 0.7));
  return Math.round(c);
}

/* --------------------------------------------------------- marriage -- */
const marriageable = () => S.house.filter(m => !m.wed && m.age >= 18 && !travelling(m));
const canMarry = h => S.marriages.indexOf(h.id) < 0 && S.repute >= h.rep;
function marry(hid, mid){
  const h = houseById(hid), m = S.house.find(x => x.id === mid);
  if(!h || !m) return;
  if(h.price > S.ducats){ toast("bad","You cannot raise the bride-price."); return; }
  if(!spendHand()){ toast("bad","No Hands left this turn."); return; }
  coin(-h.price, "Bride-price to " + h.house);
  m.wed = true; m.spouseHouse = hid;
  S.marriages.push(hid);
  const d = h.dowry || {};
  if(d.ducats) coin(d.ducats, "Dowry from " + h.house);
  if(d.stores) S.stores += d.stores;
  if(d.goods) Object.entries(d.goods).forEach(([g,q]) => { S.goods[g] += q; });
  if(d.fleet) d.fleet.forEach(f => { for(let i=0;i<f.n;i++) addUnit(f.line, f.tier); });
  const g = h.gift || {};
  if(g.route && !routeOpen(g.route)) S.routes[g.route] = {open:true, runs:0, sat:0};
  if(g.repute) repute(g.repute);
  if(g.postContract) S.flags.postContract = true;
  // the spouse joins the household, and that is one more pair of Hands
  S.house.push({id:uid("m"), name:h.match, age:irnd(18,26), role:"idle", at:null, skill:2,
                you:false, busy:0, wed:true, spouseOf:m.id, fromHouse:hid});
  for(let i=0;i<2;i++){ const o = makeOffer("house:" + hid); if(o) S.offers.push(o); }
  post("gold","<em>A marriage.</em> " + esc(m.name) + " is married to " + esc(h.match) + " of " + esc(h.house) +
    ". " + esc(h.wedding) + " " + esc(h.giftText),
    ["+1 Hand", d.ducats ? "+" + fmt(d.ducats) + "d dowry" : "", g.route ? "a road opened" : ""].filter(Boolean));
  toast("good", h.match + " joins the household.");
  closeSheet(); after();
}

/* ----------------------------------------------------------- issues -- */
function resolveIssue(idx, fixIdx){
  const it = S.issues[idx]; if(!it) return;
  const d = ISSUES[it.id], f = d.fix[fixIdx]; if(!f) return;
  const cost = f.cost ? f.cost() : 0;
  if(cost > S.ducats){ toast("bad","Not enough ducats."); return; }
  if(f.rep && S.repute < f.rep){ toast("bad","Your name is not heavy enough for that."); return; }
  if(f.hand && !spendHand()){ toast("bad","No Hands left this turn."); return; }
  if(cost) coin(-cost, d.name);
  if(f.chance !== undefined && !chance(f.chance)){
    post("bad", "<em>" + esc(d.name) + ".</em> " + esc(f.fail || "It did not work."));
    toast("bad","It did not work.");
    closeSheet(); after(); return;
  }
  if(f.rep && f.rep > 0 && f.chance !== undefined) repute(4);
  if(f.rep && f.rep < 0) repute(f.rep);
  clearIssue(it);
  post("good","<em>Settled.</em> " + esc(f.done));
  toast("good","Settled.");
  closeSheet(); after();
}

function promoteStaff(sid){
